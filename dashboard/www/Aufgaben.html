<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C4501F">
<title>Aufgaben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F6F8FC; --surface-3:#E9EEF6; --border:#E1E6F0; --border-strong:#CBD3E2;
  --ink:#141B2C; --muted:#5C6680; --faint:#646D84; --good-ink:#0D7038; --good:#16A85A; --mid-ink:#8F5400; --bad-ink:#A8241A; --bad:#D63F30;
  --accent:#B4471A; --accent-fill:#C4501F; --accent-soft:rgba(196,80,31,.10); --accent-line:rgba(196,80,31,.30);
  --shadow:0 1px 2px rgba(20,27,44,.04),0 8px 24px rgba(20,27,44,.06); --r:16px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; --disp:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1016; --surface:#161B25; --surface-2:#1B212D; --surface-3:#242C3A; --border:#28303F; --border-strong:#3A4458;
  --ink:#EAEEF6; --muted:#98A3B8; --faint:#8A95AA; --good-ink:#5AD597; --good:#2FC473; --mid-ink:#F2B65C; --bad-ink:#FF8577; --bad:#F0604F;
  --accent:#FF9466; --accent-fill:#C4501F; --accent-soft:rgba(255,148,102,.14); --accent-line:rgba(255,148,102,.34);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1016; --surface:#161B25; --surface-2:#1B212D; --surface-3:#242C3A; --border:#28303F; --border-strong:#3A4458;
  --ink:#EAEEF6; --muted:#98A3B8; --faint:#8A95AA; --good-ink:#5AD597; --good:#2FC473; --mid-ink:#F2B65C; --bad-ink:#FF8577; --bad:#F0604F;
  --accent:#FF9466; --accent-fill:#C4501F; --accent-soft:rgba(255,148,102,.14); --accent-line:rgba(255,148,102,.34);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
.app{max-width:820px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.glyph{width:40px;height:40px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent-fill),#EC7A48);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--accent-line)}
.glyph svg{width:22px;height:22px}
h1{font-family:var(--disp);font-size:24px;letter-spacing:-.4px;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.ibtn,.who{height:44px;min-width:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none;padding:0 10px;font-weight:600;font-size:14px}
.ibtn svg{width:20px;height:20px}
.ibtn:hover,.who:hover{border-color:var(--accent)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:11.5px;flex:none}
.av.s{width:20px;height:20px;font-size:10px}
@media(max-width:560px){.who .nm{display:none}h1{font-size:21px}.glyph{width:36px;height:36px}#themeBtn{display:none}.pc.hint{display:none}.pv{min-height:0}}
.qa .sh{display:none}
@media(max-width:560px){.qa .lg{display:none}.qa .sh{display:inline;font-size:18px;line-height:1}.qa .btn{min-width:42px}}
.brand>div{min-width:0}.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tabs: oben auf breiten Bildschirmen, unten auf dem Handy */
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:14px}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:19px;height:19px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
@media(max-width:640px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;border-radius:0;border:0;border-top:1px solid var(--border);padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px)}
  .nav button{flex-direction:column;gap:2px;font-size:11.5px;min-height:52px}
  .nav .badge{position:absolute;top:4px;right:calc(50% - 22px)}
  .app{padding:max(10px,env(safe-area-inset-top)) 12px calc(100px + env(safe-area-inset-bottom))}}

/* Schnelleingabe */
.qa{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.qa:focus-within{border-color:var(--accent)}
.qa .plus{width:20px;height:20px;color:var(--accent);flex:none}
.qa input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:9px 0;outline:none}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 0;min-height:24px}
.pc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pc.hint{background:none;color:var(--faint);font-weight:500;padding:3px 0}

.btn{min-height:42px;padding:8px 14px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13.5px}
.btn.dng:hover{border-color:var(--bad);color:var(--bad-ink)}
.btn.ghost{border-color:transparent;background:none}

/* Filter */
.bar{display:flex;align-items:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .av{width:20px;height:20px;font-size:10px}

/* 7-Tage-Leiste */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
.wd b{font-family:var(--mono);font-size:16px;color:var(--ink)}
.wd .n{min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;background:var(--surface-3);color:var(--muted)}
.wd .n.z{background:none;color:transparent}
.wd.td{border-color:var(--accent);background:var(--accent-soft)}.wd.td .n:not(.z){background:var(--accent-fill);color:#fff}
.wd.we{background:var(--surface-2)}
.over{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--bad-ink)}

/* Abschnitte & Zeilen */
.sec{margin-top:18px}
.sec>h2{display:flex;align-items:baseline;gap:8px;font-family:var(--disp);font-size:16px;letter-spacing:-.2px;margin:0 4px 8px}
.sec>h2 small{font-family:var(--body);font-size:12.5px;color:var(--faint);font-weight:500}
.sec>h2 .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
.sec.bad>h2{color:var(--bad-ink)}
.sec.today>h2{color:var(--accent)}
.tasks{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:4px;padding:4px 8px 4px 4px;min-height:56px}
.task+.task{border-top:1px solid var(--border)}
.ck{flex:none;width:44px;height:48px;display:grid;place-items:center;border:0;background:none}
.ck i{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ck i svg{width:14px;height:14px}
.ck:hover i{border-color:var(--accent)}
.task.p1 .ck i{border-color:var(--pr1)}.task.p2 .ck i{border-color:var(--pr2);border-width:2.5px}.task.p3 .ck i{border-color:var(--pr3);border-width:2.5px}
.task.p3{box-shadow:inset 3px 0 0 var(--pr3)}
.tm .pr1{color:var(--pr1-ink);font-weight:700}.tm .pr2{color:var(--pr2-ink);font-weight:700}.tm .pr3{color:var(--bad-ink);font-weight:700}
.pc.pr2{color:var(--pr2-ink)}.pc.pr3{color:var(--bad-ink)}
.opt.pro b{font-family:var(--mono);letter-spacing:-1px}.opt.pr1[aria-pressed="true"]{background:var(--pr1);border-color:var(--pr1);color:#fff}.opt.pr2[aria-pressed="true"]{background:var(--pr2);border-color:var(--pr2);color:#fff}.opt.pr3[aria-pressed="true"]{background:var(--pr3);border-color:var(--pr3);color:#fff}
:root{--pr1:#B87708;--pr1-ink:var(--mid-ink);--pr2:#D9621C;--pr2-ink:#B4500F;--pr3:var(--bad)}
:root[data-theme="dark"]{--pr2-ink:#FF9E5E}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pr2-ink:#FF9E5E}}
.ck[aria-pressed="true"] i{background:var(--good);border-color:var(--good);color:#fff}
.ck:disabled{cursor:default}.ck:disabled i{border-style:dashed}
.tb{flex:1;min-width:0;text-align:left;border:0;background:none;padding:9px 4px 9px 0;display:flex;flex-direction:column;gap:3px}
.tt{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--faint);font-weight:500}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.tm span{display:inline-flex;align-items:center;gap:4px}
.tm svg{width:13px;height:13px}
.tm .bad{color:var(--bad-ink);font-weight:600}.tm .warn{color:var(--mid-ink);font-weight:600}.tm .acc{color:var(--accent);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.pill.neu{background:color-mix(in srgb,#D99318 18%,transparent);color:var(--mid-ink)}
.pill.abgelehnt{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad-ink)}
.pill.arbeit{background:color-mix(in srgb,#2E9BB5 16%,transparent);color:#1C7A90}
.nw{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent-fill);color:#fff;vertical-align:2px}
.more{width:100%;border:0;border-top:1px solid var(--border);background:var(--surface-2);min-height:44px;font-weight:600;color:var(--muted);font-size:13.5px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}

/* Wünsche */
.wish{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.wish+.wish{margin-top:8px}
.wh{display:flex;gap:10px;align-items:flex-start}
.wt{font-weight:700;font-size:15.5px}.ws{font-size:12.5px;color:var(--muted)}
.wn{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.wa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wa .in{width:auto}
.banner{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-top:12px;font-size:14px}
.banner b{flex:1}

/* Listen */
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.lc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-height:96px;border-top:4px solid var(--lc)}
.lc b{font-family:var(--disp);font-size:16px}
.lc .c{font-size:13px;color:var(--muted)}
.lc:hover{border-color:var(--lc)}
.lhead{display:flex;align-items:center;gap:10px;margin-top:14px}
.lhead h2{font-family:var(--disp);font-size:20px;flex:1}

/* Erledigt-Statistik */
.stats{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.stats span{display:inline-flex;align-items:center;gap:6px}.stats b{color:var(--ink);font-family:var(--mono)}

/* Detailblatt */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,13,20,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:min(92vh,900px);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:640px){.ov{align-items:flex-end;padding:0}.dlg{max-width:none;border-radius:22px 22px 0 0;max-height:94vh;padding-bottom:env(safe-area-inset-bottom)}}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.dh h3{font-family:var(--disp);font-size:17px;flex:1}
.x{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:18px;flex:none}
.x:hover{border-color:var(--accent);color:var(--accent)}
.db{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.df{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.df .sp{flex:1}
.in{width:100%;min-width:0;padding:10px 11px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);font-size:15px}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.in:disabled{opacity:.75}
textarea.in{resize:vertical;min-height:70px}
.ttl{font-size:18px;font-weight:700;border-color:transparent;background:none;padding:6px 2px}
.ttl:focus{background:var(--surface-2)}
.fs{display:flex;flex-direction:column;gap:8px}
.lt{font:600 11.5px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fl .in{width:auto;flex:1;min-width:120px}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);font-weight:600;font-size:13.5px;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opt .av{width:22px;height:22px;font-size:10px}
.opt:disabled{cursor:default;opacity:.6}
.sw{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.sw input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;cursor:pointer;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked{background:var(--accent-fill);border-color:var(--accent-fill)}.sw input:checked::after{left:20px}
.cl{display:flex;flex-direction:column;gap:4px}
.cli{display:flex;align-items:center;gap:4px}
.cli .ck{width:40px;height:40px}.cli .ck i{width:22px;height:22px}
.cli.ok .in{text-decoration:line-through;color:var(--faint)}
.cli .in{border-color:transparent;background:none;padding:7px 6px}
.cli .in:focus{background:var(--surface-2);border-color:var(--border)}
.log{display:flex;flex-direction:column;gap:8px}
.lg{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.lg .bx{background:var(--surface-2);border-radius:12px;padding:7px 10px}
.lg .mt{font-size:11.5px;color:var(--faint);margin-top:2px}
.lg.sys{font-size:12px;color:var(--faint);padding-left:4px}
.note{font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 10px;color:var(--muted)}
.urls{display:flex;flex-direction:column;gap:8px}
.url{display:flex;align-items:center;gap:8px}
.url code{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.lrow{display:grid;grid-template-columns:44px 1fr 42px;gap:8px;align-items:center}
.lrow input[type=color]{width:44px;height:42px;border:1px solid var(--border);border-radius:11px;background:none;padding:3px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 12px 10px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 24px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent-fill);font-weight:700;padding:6px 8px;min-height:36px;filter:brightness(1.6)}
@media(max-width:640px){.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:24px}
@media (pointer:coarse){.in,.qa input{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* PC: breiter, „Anstehend“ zweispaltig – links Eingabe, Wünsche, Filter, Woche; rechts die Zeitleiste */
@media(min-width:1024px){
  .app{max-width:1080px}
  .nav{width:fit-content}.nav button{flex:none;padding:0 18px}
  .cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
  .side .wa .btn{min-height:38px}
  .side .week{gap:5px}.side .wd b{font-size:15px}
  .flow>.sec:first-child,.flow>.card:first-child{margin-top:0}
  .lists{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
/* Runde 7: private Aufgaben */
.tm .lk{color:var(--muted);font-weight:600}
.pnote{font-size:12.5px;color:var(--muted);margin-left:54px;margin-top:-2px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div>
      <div><h1>Aufgaben</h1><div class="sub" id="sub"></div></div>
    </div>

<script>
"use strict";
/* =====================================================================
   AUFGABEN 2 – gemeinsame Aufgaben der Familie
   Hauptansicht „Anstehend“: alles Offene als Zeitleiste (Überfällig → Heute → Woche → Später).
   Speicher: localStorage[KEY] = {tasks,lists,log,set}. Sammlungen {id:{…,upd}} führt der Pi pro
   Eintrag zusammen (Sync „liste“). Rechte kommen vom Pi (window.__PI_ROLE): Tool sehen/bearbeiten,
   Sicht eigene/alle, Admin. Der Pi setzt sie auch selbst durch.
   ===================================================================== */
const KEY='aufgaben_v1', APP='aufgaben';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{ if(v==null||v==='') return null; const x=parseFloat(String(v).replace(',','.')); return isNaN(x)?null:x; };
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'], WK=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const AUFW=[5,15,30,60,120];
const PRIO=['Normal','Wichtig','Sehr wichtig','Dringend'], pr=t=>Math.max(0,Math.min(3,+(t&&t.prio)||0));
const STAT={neu:'Wunsch',offen:'offen',arbeit:'in Arbeit',erledigt:'erledigt',abgelehnt:'abgelehnt'};
const LCOL=['#E0673A','#2C7BD6','#16A85A','#B4567F','#D99318','#6B7FD7','#2E9BB5','#7D8597'];
const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

/* ---------- Datum ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const kDate=k=>new Date(k+'T00:00');
const kAdd=(k,n)=>{ const d=kDate(k); d.setDate(d.getDate()+n); return iso(d); };
const kDiff=(a,b)=>Math.round((kDate(a)-kDate(b))/864e5);
const kMon=(k,n)=>{ const d=kDate(k), day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return iso(d); };
const wd=k=>kDate(k).getDay();
function fDue(k,z){ const t=today(), d=kDiff(k,t), dt=kDate(k);
  const s=d===0?'heute':d===1?'morgen':d===-1?'gestern':d>1&&d<7?WD[dt.getDay()]:d<0?`seit ${-d} Tagen`:`${WK[dt.getDay()]} ${dt.getDate()}.${dt.getMonth()+1}.`+(dt.getFullYear()!==new Date().getFullYear()?dt.getFullYear():'');
  return s+(z?' '+z:''); }
const fDay=k=>{ const dt=kDate(k); return `${WD[dt.getDay()]}, ${dt.getDate()}. ${MON[dt.getMonth()]}`; };
const fTs=ts=>{ const d=new Date(ts), k=iso(d), t=today(); return (k===t?'heute':k===kAdd(t,-1)?'gestern':d.getDate()+'.'+(d.getMonth()+1)+'.')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); };
const nextSat=()=>{ let k=today(); for(let i=0;i<7&&wd(k)!==6;i++) k=kAdd(k,1); return k; };
const nextMon=()=>{ let k=kAdd(today(),1); for(let i=0;i<7&&wd(k)!==1;i++) k=kAdd(k,1); return k; };

/* ---------- Personen & Rechte (vom Pi) ---------- */
const DEFP=[{id:'alex',name:'Alex',kz:'alex',farbe:'#5B4BE0',owner:true},{id:'sam',name:'Sam',kz:'sam',farbe:'#E0673A'},{id:'kim',name:'Kim',kz:'kim',farbe:'#2C7BD6'},{id:'robin',name:'Robin',kz:'robin',farbe:'#16A85A'}];
const ROLE=window.__PI_ROLE||null;
let PL=DEFP.slice(), me=null;
try{ const c=JSON.parse(localStorage.getItem('pd_personen')||'null'); if(c&&c.length) PL=c; me=localStorage.getItem('pd_person')||null; }catch(e){}
if(ROLE) me=ROLE.pid||null;
const person=id=>PL.find(p=>p.id===id)||(id?{id,name:id,farbe:'#7D8597'}:null);
const owner=()=>PL.find(p=>p.owner)||PL[0];
const isAdmin=()=>!ROLE||!!ROLE.admin;
const canEdit=()=>!ROLE||(ROLE.tools&&ROLE.tools[APP]==='edit');
const seesAll=()=>!ROLE||ROLE.sicht==='alle';
const admins=()=>ROLE?(ROLE.admins||[]):[owner().id];
const mayEdit=t=>canEdit()&&(isAdmin()||!t||t.von===me||t.erstVon===me);   // Felder ändern, löschen
const canTick=t=>canEdit()&&t.status!=='neu'&&t.status!=='abgelehnt';      // abhaken, Checkliste, Status
const pName=id=>{ const p=person(id); return p?p.name:'–'; };
const av=(id,cls)=>{ const p=person(id); return p?`<span class="av${cls?' '+cls:''}" style="background:${esc(p.farbe||'#7D8597')}" title="${esc(p.name)}" aria-hidden="true">${esc((p.name||'?').charAt(0).toUpperCase())}</span>`:''; };
/* Privat: Aufgabe sieht nur die Person, die sie für sich selbst eingetragen hat – auch kein Admin. Geht nur, wenn sie für sie
   selbst ist und nicht abwechselnd mit anderen. Der Pi filtert (server.py hidden()); hier nur Anzeige und Standardwert. */
const privOk=t=>!!t&&!!t.von&&(!t.fuer||t.fuer===t.von)&&!(((t.wdh||{}).rot)||[]).some(p=>p!==t.von);
const isPriv=t=>!!(t&&t.privat)&&privOk(t);
function loadPersons(){ if(location.protocol==='file:') return;
  fetch('/api/personen').then(r=>r.ok?r.json():null).then(x=>{ if(x&&x.list&&x.list.length){ PL=x.list; try{ localStorage.setItem('pd_personen',JSON.stringify(PL)); }catch(_){} render(); } }).catch(()=>{}); }

/* ---------- Zustand ---------- */
const DEFSET=()=>({upd:0,dring:2});
let D, view='anstehend', sheet=null, qa='', wen='me', curList=null, doneN=60, laterAll=false, newsOpen=false;
function normalize(x){
  x=x&&typeof x==='object'&&!Array.isArray(x)?x:{};
  ['tasks','lists','log'].forEach(c=>{ if(!x[c]||typeof x[c]!=='object'||Array.isArray(x[c])) x[c]={}; });
  const d=DEFSET(); x.set=x.set&&typeof x.set==='object'?x.set:d; Object.keys(d).forEach(k=>{ if(x.set[k]==null) x.set[k]=d[k]; });
  x.app=APP; x.v=1; x.savedAt=+x.savedAt||0; return x; }
function load(){ let x=null; try{ x=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){} D=normalize(x);
  if(!Object.keys(D.lists).length&&isAdmin()){ [['haushalt','Haushalt'],['privat','Privat'],['uni','Uni'],['einkauf','Einkauf']].forEach(([id,name],i)=>put('lists',{id:'l-'+id,name,farbe:LCOL[i]})); } }
let sumT=null, icsT=null;
function save(){ if(!canEdit()) return; D.savedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){ toast('Speichern im Browser nicht möglich'); }
  clearTimeout(sumT); sumT=setTimeout(pushSum,1200); clearTimeout(icsT); icsT=setTimeout(pushIcs,3000); stamp(); }
const live=c=>Object.values(D[c]).filter(x=>x&&!x.del);
function put(c,it){ it.upd=Date.now(); D[c][it.id]=it; return it; }
function rm(c,id){ if(D[c][id]) D[c][id]={id,upd:Date.now(),del:true}; }
function note(task,t,sys){ put('log',{id:uid('g'),task,wer:me,ts:Date.now(),t,sys:!!sys}); }
const logOf=id=>live('log').filter(g=>g.task===id).sort((a,b)=>a.ts-b.ts);
const lists=()=>live('lists').sort((a,b)=>a.name.localeCompare(b.name,'de'));
const list=id=>id&&D.lists[id]&&!D.lists[id].del?D.lists[id]:null;

/* ---------- Gesehen (pro Gerät und Person) ---------- */
let SEEN={};
function seenLoad(){ try{ SEEN=JSON.parse(localStorage.getItem('aufg_seen_'+me)||'null'); }catch(e){ SEEN=null; } if(!SEEN){ SEEN={_0:Date.now()}; seenSave(); } }
function seenSave(){ try{ localStorage.setItem('aufg_seen_'+me,JSON.stringify(SEEN)); }catch(e){} }
function markSeen(id){ SEEN[id]=Date.now(); seenSave(); }
function isNewFor(t){ if(!me||(t.von!==me&&t.fuer!==me)) return false; const s=SEEN[t.id]||SEEN._0||0;
  return logOf(t.id).some(g=>g.wer!==me&&g.ts>s); }

/* ---------- Aufgaben-Logik ---------- */
const open=t=>t.status==='offen'||t.status==='arbeit';
const tasks=()=>live('tasks');
const wishesForMe=()=>tasks().filter(t=>t.status==='neu'&&t.fuer===me);
const newsForMe=()=>tasks().filter(t=>t.status!=='neu'&&isNewFor(t));
function inFilter(t){ if(wen==='alle') return true; if(wen==='me') return t.fuer===me; if(wen==='von') return t.von===me&&t.fuer!==me; return t.fuer===wen; }
const isOver=t=>open(t)&&t.due&&(t.due<today()||(t.due===today()&&t.zeit&&t.zeit<new Date().toTimeString().slice(0,5)));
function sortT(a,b){ return (a.due||'9999').localeCompare(b.due||'9999')||pr(b)-pr(a)||(a.zeit||'99').localeCompare(b.zeit||'99')||a.erst-b.erst; }
function nextDue(t){ const w=t.wdh; if(!w) return null; const n=Math.max(1,+w.n||1), td=today();
  let base=w.basis==='erledigt'||!t.due?td:t.due;
  const step=k=>{ if(w.typ==='tag') return kAdd(k,n); if(w.typ==='monat') return kMon(k,n); if(w.typ==='jahr') return kMon(k,12*n);
    if(w.typ==='woche'){ if(w.tage&&w.tage.length){ let x=kAdd(k,1); for(let i=0;i<8;i++){ if(w.tage.includes(wd(x))) return x; x=kAdd(x,1); } return x; } return kAdd(k,7*n); } return kAdd(k,1); };
  let k=step(base); for(let i=0;i<500&&k<=td&&w.basis!=='erledigt';i++){ if(k===td&&base!==td) break; k=step(k); }
  return k; }
function firstDue(w){ const td=today(); if(w.typ==='woche'&&w.tage&&w.tage.length){ let x=td; for(let i=0;i<8;i++){ if(w.tage.includes(wd(x))) return x; x=kAdd(x,1); } } return td; }
function wdhText(w){ if(!w) return ''; const n=+w.n||1;
  if(w.typ==='woche'&&w.tage&&w.tage.length) return w.tage.length===5&&[1,2,3,4,5].every(x=>w.tage.includes(x))?'werktags':'jeden '+w.tage.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(x=>WK[x]).join(', ');
  const u={tag:['täglich','Tage'],woche:['wöchentlich','Wochen'],monat:['monatlich','Monate'],jahr:['jährlich','Jahre']}[w.typ]||['',''];
  return (n===1?u[0]:`alle ${n} ${u[1]}`)+(w.basis==='erledigt'?' (ab Erledigung)':'')+(w.rot&&w.rot.length>1?' · abwechselnd':''); }
function complete(t){ const was=JSON.parse(JSON.stringify(t)); let nx=null;
  t.status='erledigt'; t.erledigtVon=me; t.erledigtAm=Date.now(); put('tasks',t); note(t.id,'hat erledigt',true);
  if(t.wdh){ const k=nextDue(t), rot=t.wdh.rot||[], i=rot.indexOf(t.fuer);
    nx=put('tasks',{...JSON.parse(JSON.stringify(t)),id:uid('t'),status:'offen',due:k,erledigtVon:null,erledigtAm:null,erst:Date.now(),
      fuer:rot.length>1?rot[(i+1)%rot.length]:t.fuer,check:(t.check||[]).map(c=>({...c,ok:false}))}); }
  save(); render();
  toast(t.wdh?`Erledigt – nächstes Mal ${fDue(nx.due)}${nx.fuer!==t.fuer?' ('+pName(nx.fuer)+')':''}`:'Erledigt',()=>{ D.tasks[t.id]=was; put('tasks',D.tasks[t.id]); if(nx) rm('tasks',nx.id); note(t.id,'hat wieder geöffnet',true); save(); render(); }); }
function reopen(t){ t.status='offen'; t.erledigtVon=null; t.erledigtAm=null; put('tasks',t); note(t.id,'hat wieder geöffnet',true); save(); render(); }

/* ---------- Schnelleingabe (Deutsch) ---------- */
const WDN={montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6,sonntag:0,mo:1,di:2,mi:3,do:4,fr:5,sa:6,so:0};
const WRE='montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|mo|di|mi|do|fr|sa|so';
function nextWd(n,strict){ let k=today(); if(strict) k=kAdd(k,1); for(let i=0;i<8;i++){ if(wd(k)===n) return k; k=kAdd(k,1); } return k; }
function parse(raw){ let s=' '+raw.replace(/\s+/g,' ')+' '; const r={};
  const take=(re,fn)=>{ s=s.replace(re,(...m)=>{ const v=fn(...m); return v===false?m[0]:' '; }); };
  take(/\s(täglich|jeden tag)(?=\s)/i,()=>{ r.wdh={typ:'tag',n:1}; });
  take(/\s(werktags)(?=\s)/i,()=>{ r.wdh={typ:'woche',n:1,tage:[1,2,3,4,5]}; });
  take(/\s(wöchentlich|jede woche)(?=\s)/i,()=>{ r.wdh={typ:'woche',n:1}; });
  take(/\s(monatlich|jeden monat)(?=\s)/i,()=>{ r.wdh={typ:'monat',n:1}; });
  take(/\s(jährlich|jedes jahr)(?=\s)/i,()=>{ r.wdh={typ:'jahr',n:1}; });
  take(new RegExp(`\\sjede[nm]?\\s+((?:${WRE})\\.?(?:\\s*(?:,|und|\\+)\\s*(?:${WRE})\\.?)*)(?=\\s)`,'i'),(m,a)=>{ const t=a.toLowerCase().split(/\s*(?:,|und|\+)\s*/).map(x=>WDN[x.replace('.','')]).filter(x=>x!=null); if(!t.length) return false; r.wdh={typ:'woche',n:1,tage:[...new Set(t)]}; });
  take(/\salle\s+(\d{1,3})\s+(tage?n?|wochen?|monate?n?|jahre?n?)(?=\s)/i,(m,n,u)=>{ u=u.toLowerCase(); r.wdh={typ:u.startsWith('tag')?'tag':u.startsWith('woch')?'woche':u.startsWith('mon')?'monat':'jahr',n:+n}; });
  take(/\s(ab erledigung|nach erledigung)(?=\s)/i,()=>{ if(r.wdh) r.wdh.basis='erledigt'; else return false; });
  const art=p=>{ if(p&&/^am/i.test(p)) r.art='am'; };
  take(/\s(am\s+|bis\s+)?(heute)(?=\s)/i,(m,p)=>{ r.due=today(); art(p); });
  take(/\s(gestern)(?=\s)/i,()=>{ r.due=kAdd(today(),-1); });
  take(/\s(am\s+|bis\s+)?(übermorgen)(?=\s)/i,(m,p)=>{ r.due=kAdd(today(),2); art(p); });
  take(/\s(am\s+|bis\s+)?(morgen)(?=\s)/i,(m,p)=>{ r.due=kAdd(today(),1); art(p); });
  take(/\s(nächste woche|naechste woche)(?=\s)/i,()=>{ r.due=nextMon(); });
  take(/\s(am wochenende|wochenende)(?=\s)/i,()=>{ r.due=nextSat(); });
  take(/\s(am\s+|bis\s+)?(\d{1,2})\.(\d{1,2})\.(\d{2,4})?(?=\s)/,(m,p,d,mo,y)=>{ const yy=y?(+y<100?2000+ +y:+y):new Date().getFullYear(); const dt=new Date(yy,+mo-1,+d); if(dt.getDate()!==+d) return false;
    let k=iso(dt); if(!y&&k<today()) k=iso(new Date(yy+1,+mo-1,+d)); r.due=k; art(p); });
  take(/\sin\s+(\d{1,3})\s+(tagen|tag|wochen|woche|monaten|monat)(?=\s)/i,(m,n,u)=>{ u=u.toLowerCase(); r.due=u.startsWith('tag')?kAdd(today(),+n):u.startsWith('woch')?kAdd(today(),7*n):kMon(today(),+n); });
  take(new RegExp(`\\s(am\\s+|bis\\s+|nächsten\\s+|naechsten\\s+)?(${WRE})\\.?(?=\\s)`,'i'),(m,p,w)=>{ w=w.toLowerCase(); if(r.due) return false; if(w==='so'&&!p) return false; r.due=nextWd(WDN[w],!!(p&&/^n/i.test(p))); art(p); });
  take(/\s(?:um\s+)?([01]?\d|2[0-3])[:.]([0-5]\d)(?:\s*uhr)?(?=\s)/i,(m,h,mi)=>{ r.zeit=String(h).padStart(2,'0')+':'+mi; });
  take(/\s(?:um\s+)?([01]?\d|2[0-3])\s*uhr(?=\s)/i,(m,h)=>{ r.zeit=String(h).padStart(2,'0')+':00'; });
  take(/\s(!{1,3})(?=\s)/,(m,x)=>{ r.prio=x.length; });
  take(/\s#([\wäöüß-]{1,30})(?=\s)/i,(m,x)=>{ const n=x.toLowerCase(), l=lists().find(l=>l.name.toLowerCase()===n)||lists().find(l=>l.name.toLowerCase().startsWith(n)); r.liste=l?l.id:null; r.neueListe=l?null:x; });
  take(/\s@([\wäöüß-]{1,30})(?=\s)/i,(m,x)=>{ const n=x.toLowerCase(), p=PL.find(p=>(p.kz||'').toLowerCase()===n||p.name.toLowerCase()===n)||PL.find(p=>p.name.toLowerCase().startsWith(n)||(p.kz||'').startsWith(n)); if(!p) return false; r.fuer=p.id; });
  take(/\s(?:für|fuer)\s+([\wäöüß-]{2,30})(?=\s)/i,(m,x)=>{ const n=x.toLowerCase(), p=PL.find(p=>p.name.toLowerCase()===n||(p.kz||'').toLowerCase()===n); if(!p) return false; r.fuer=p.id; });
  take(/\s~\s?(\d{1,3})\s*(min|m|h|std)?(?=\s)/i,(m,n,u)=>{ let v=+n*(u&&/^(h|std)/i.test(u)?60:1); r.aufwand=AUFW.find(a=>a>=v)||120; });
  if(r.wdh&&!r.due) r.due=firstDue(r.wdh);
  r.titel=s.replace(/\s+/g,' ').trim(); return r; }
function chips(r){ const c=[];
  if(r.due) c.push(`<span class="pc">${r.art==='am'?'am':'bis'} ${esc(fDue(r.due,r.zeit))}</span>`); else if(r.zeit) c.push(`<span class="pc">${esc(r.zeit)}</span>`);
  if(r.wdh) c.push(`<span class="pc">↻ ${esc(wdhText(r.wdh))}</span>`);
  if(r.prio) c.push(`<span class="pc pr${pr(r)}">${PRIO[pr(r)].toLowerCase()}</span>`);
  if(r.liste) c.push(`<span class="pc">${esc(list(r.liste).name)}</span>`); else if(r.neueListe) c.push(`<span class="pc">neue Liste „${esc(r.neueListe)}“</span>`);
  if(r.fuer) c.push(`<span class="pc">für ${esc(pName(r.fuer))}${wishRule(r.fuer)?' (als Wunsch)':''}</span>`);
  return c.join(''); }
/* Wunsch: wer kein Admin ist und etwas für einen Admin einträgt, schickt es als Wunsch – der Admin nimmt an oder lehnt ab. */
const wishRule=fuer=>!isAdmin()&&fuer&&fuer!==me&&admins().includes(fuer);
function newTask(r){ const fuer=r.fuer||(wen!=='me'&&wen!=='alle'&&wen!=='von'&&seesAll()?wen:me);
  if(r.neueListe){ const l=put('lists',{id:uid('l'),name:r.neueListe.charAt(0).toUpperCase()+r.neueListe.slice(1),farbe:LCOL[lists().length%LCOL.length]}); r.liste=l.id; }
  const t={id:uid('t'),titel:r.titel||'',notiz:r.notiz||'',von:me,fuer,due:r.due||null,zeit:r.zeit||null,art:r.art||'bis',prio:r.prio||0,liste:r.liste||(view==='listen'&&curList&&curList!=='-'?curList:null),aufwand:r.aufwand||null,
    wdh:r.wdh||null,check:r.check||[],status:wishRule(fuer)?'neu':'offen',erst:Date.now(),erstVon:me};
  t.privat=privOk(t);   // für sich selbst eingetragen → standardmäßig privat (Entscheidung Grill-Runde, Abschnitt 5)
  return t; }
function addQuick(){ if(!canEdit()) return; const r=parse(qa); if(!r.titel){ toast('Bitte einen Titel eingeben'); return; }
  const t=put('tasks',newTask(r)); note(t.id,t.status==='neu'?'hat sich das gewünscht':'hat eingetragen',true); qa=''; save(); render();
  toast(t.status==='neu'?`Wunsch an ${pName(t.fuer)} geschickt`:'Eingetragen'+(isPriv(t)?' (privat)':'')+(t.due?' · '+fDue(t.due):''),()=>{ rm('tasks',t.id); save(); render(); });
  const q=$('qa'); if(q) q.focus(); }

/* Eine Zeile. o.date: Datum anzeigen (in Gruppen ohne Tagesbezug), o.status: Status-Pille */
function row(t,o){ o=o||{}; const done=t.status==='erledigt'||t.status==='abgelehnt', ov=isOver(t), m=[], l=list(t.liste), cm=logOf(t.id).filter(g=>!g.sys).length, ck=t.check||[];
  if(t.status==='neu') m.push(`<span class="pill neu">Wunsch${t.fuer!==me?' an '+esc(pName(t.fuer)):''} – wartet</span>`);
  else if(t.status==='arbeit') m.push('<span class="pill arbeit">in Arbeit</span>');
  else if(o.status&&t.status==='abgelehnt') m.push('<span class="pill abgelehnt">abgelehnt</span>');
  if(done&&t.erledigtVon) m.push(`<span>${av(t.erledigtVon,'s')} ${esc(pName(t.erledigtVon))} · ${esc(fTs(t.erledigtAm))}</span>`);
  if(!done&&t.due&&o.date) m.push(`<span class="${ov?'bad':t.due===today()?'warn':''}">${t.art==='am'?'am ':''}${esc(fDue(t.due,t.zeit))}</span>`);
  else if(!done&&t.zeit) m.push(`<span class="${ov?'bad':''}">${IC.clock}${esc(t.zeit)}</span>`);
  if(pr(t)&&!done) m.push(`<span class="pr${pr(t)}">${'!'.repeat(pr(t))} ${PRIO[pr(t)].toLowerCase()}</span>`);
  if(t.fuer&&t.fuer!==me&&t.status!=='neu') m.push(`<span>${av(t.fuer,'s')} ${esc(pName(t.fuer))}</span>`);
  if(t.von&&t.von!==me&&t.fuer===me) m.push(`<span>von ${esc(pName(t.von))}</span>`);
  if(isPriv(t)) m.push(`<span class="lk" title="Privat – nur du siehst diese Aufgabe">${IC.lock}privat</span>`);
  if(l) m.push(`<span><i class="dot" style="background:${esc(l.farbe)}"></i>${esc(l.name)}</span>`);
  if(t.wdh) m.push(`<span title="${esc(wdhText(t.wdh))}">${IC.rep}${esc(wdhText(t.wdh))}</span>`);
  if(ck.length) m.push(`<span>${IC.cl}${ck.filter(c=>c.ok).length}/${ck.length}</span>`);
  if(cm) m.push(`<span>${IC.msg}${cm}</span>`);
  const tk=canTick(t)||(done&&canEdit()&&t.status==='erledigt');
  return `<div class="task${done?' done':''}${!done&&pr(t)?' p'+pr(t):''}">
    <button class="ck" data-done="${t.id}" aria-pressed="${t.status==='erledigt'}" aria-label="${t.status==='erledigt'?'Wieder öffnen':'Erledigt'}: ${esc(t.titel)}"${tk?'':' disabled'}><i>${CHK}</i></button>
    <button class="tb" data-open="${t.id}"><span class="tt">${esc(t.titel)}${isNewFor(t)?'<span class="nw">neu</span>':''}</span>${m.length?`<span class="tm">${m.join('')}</span>`:''}</button></div>`; }
function sec(title,L,o){ o=o||{}; if(!L.length) return '';
  const max=o.max&&!o.all?o.max:L.length;
  return `<section class="sec${o.cls?' '+o.cls:''}"${o.id?` id="${o.id}"`:''}><h2>${title}${o.small?`<small>${o.small}</small>`:''}<span class="n">${L.length}</span></h2><div class="tasks">${L.slice(0,max).map(t=>row(t,o)).join('')}${L.length>max?`<button class="more" data-more="${o.more}">${L.length-max} weitere anzeigen</button>`:''}</div></section>`; }
function qaBox(ph){ if(!canEdit()) return ''; return `<div class="qa"><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <input id="qa" placeholder="${esc(ph)}" value="${esc(qa)}" autocomplete="off" enterkeyhint="done" aria-label="Neue Aufgabe – Kürzel wie morgen, fr, 14 Uhr, !, #liste, @person">
  <button class="btn sm ghost" data-new="1" title="Mit allen Feldern anlegen" aria-label="Mit allen Feldern anlegen"><span class="lg">Details</span><span class="sh">⋯</span></button><button class="btn pri sm" data-qadd="1" aria-label="Hinzufügen"><span class="lg">Hinzufügen</span><span class="sh">+</span></button></div><div class="pv" id="pv">${qaPreview()}</div>`; }
function qaPreview(){ if(!qa.trim()) return `<span class="pc hint">Kürzel: morgen · fr · 12.11. · 14 Uhr · jeden Mo · ! / !! / !!! wichtig · #liste · @person</span>`; return chips(parse(qa)); }
function wenBar(withVon){ const O=[['me','Für mich']]; if(withVon) O.push(['von','Von mir']);
  if(seesAll()){ O.push(['alle','Alle']); PL.filter(p=>p.id!==me).forEach(p=>O.push([p.id,av(p.id)+esc(p.name)])); }

/* ---------- Ansichten ---------- */
function render(){
  if(!D) return;
  document.querySelectorAll('.nav button').forEach(b=>b.dataset.v===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const d=new Date(); $('sub').textContent=WD[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]+(ROLE&&ROLE.ro?' · nur ansehen':'');
  const p=person(me); $('whoBtn').innerHTML=p?`${av(me)}<span class="nm">${esc(p.name)}</span>`:'<span class="nm">Wer bist du?</span>';
  const nb=wishesForMe().length+newsForMe().length, b=$('inBadge'); b.hidden=!nb; b.textContent=nb;
  $('main').classList.toggle('wide',view==='anstehend');
  ({anstehend:vAnstehend,listen:vListen,erledigt:vErledigt}[view]||vAnstehend)($('main'));
  stamp(); }

function vAnstehend(el){ const td=today(), W=wishesForMe(), N=newsForMe();
  const L=tasks().filter(t=>(open(t)||(t.status==='neu'&&!(t.fuer===me)))&&inFilter(t)).sort(sortT);
  let h=qaBox(innerWidth<560||innerWidth>=1024?'Neue Aufgabe …':'Neue Aufgabe … z. B. Müll rausbringen morgen #haushalt');
  if(W.length) h+=`<section class="sec"><h2>Wünsche an dich<span class="n">${W.length}</span></h2>${W.sort((a,b)=>a.erst-b.erst).map(wishCard).join('')}</section>`;
  if(N.length) h+=`<div class="banner"><b>${N.length} ${N.length===1?'Aufgabe hat':'Aufgaben haben'} Neuigkeiten</b><button class="btn sm" data-news="1">${newsOpen?'Ausblenden':'Ansehen'}</button></div>${newsOpen?`<div class="tasks" style="margin-top:8px">${N.map(t=>row(t,{date:1})).join('')}</div>`:''}`;
  h+=`<div class="bar">${wenBar(true)}</div>`;
  // 7-Tage-Leiste
  const cnt={}, over=L.filter(t=>t.due&&t.due<td); L.forEach(t=>{ if(t.due) cnt[t.due]=(cnt[t.due]||0)+1; });
  h+=`<div class="week" role="group" aria-label="Die nächsten 7 Tage">${[0,1,2,3,4,5,6].map(i=>{ const k=kAdd(td,i), n=cnt[k]||0;
    return `<button class="wd${i===0?' td':''}${wd(k)%6===0?' we':''}" data-day="${k}" aria-label="${esc(fDay(k))}: ${n} offen"><span>${i===0?'Heute':WK[wd(k)]}</span><b>${kDate(k).getDate()}</b><span class="n${n?'':' z'}">${n||'·'}</span></button>`; }).join('')}</div>`;
  if(over.length) h+=`<div class="over">${over.length} überfällig</div>`;
  // Zeitleiste (am PC rechte Spalte)
  const side=h; h='';
  const g=(f)=>L.filter(f);
  h+=sec('Überfällig',g(t=>t.due&&t.due<td),{cls:'bad',date:1,id:'d-over'});
  h+=sec('Heute',g(t=>t.due===td),{cls:'today',id:'d-'+td,small:fDay(td).split(',')[1]});
  h+=sec('Morgen',g(t=>t.due===kAdd(td,1)),{id:'d-'+kAdd(td,1),small:WD[wd(kAdd(td,1))]});
  for(let i=2;i<7;i++){ const k=kAdd(td,i); h+=sec(WD[wd(k)],g(t=>t.due===k),{id:'d-'+k,small:kDate(k).getDate()+'. '+MON[kDate(k).getMonth()]}); }
  h+=sec('Nächste Woche',g(t=>t.due&&t.due>=kAdd(td,7)&&t.due<=kAdd(td,13)),{date:1});
  h+=sec('Später',g(t=>t.due&&t.due>kAdd(td,13)),{date:1,max:8,all:laterAll,more:'later'});
  h+=sec('Ohne Datum',g(t=>!t.due),{});
  if(!L.length) h+=`<div class="card" style="margin-top:14px"><div class="empty">${wen==='me'?'Für dich ist nichts offen.':'Hier ist nichts offen.'}${canEdit()?' Oben eine neue Aufgabe eintragen.':''}</div></div>`;
  el.innerHTML=`<div class="cols"><div class="side">${side}</div><div class="flow">${h}</div></div>`; }
function wishCard(t){ const ck=t.check||[];
  return `<div class="wish"><div class="wh">${av(t.von)}<div style="min-width:0;flex:1"><div class="wt">${esc(t.titel)}</div><div class="ws">von ${esc(pName(t.von))} · ${esc(fTs(t.erst))}${t.due?' · '+(t.art==='am'?'am ':'bis ')+esc(fDue(t.due,t.zeit)):''}${pr(t)?' · '+PRIO[pr(t)].toLowerCase():''}${ck.length?' · '+ck.length+' Punkte':''}</div></div></div>
    ${t.notiz?`<div class="wn">${esc(t.notiz)}</div>`:''}
    ${canEdit()?`<div class="wa"><button class="btn pri" data-acc="${t.id}">Annehmen</button><input class="in" type="date" id="wd_${t.id}" value="${t.due||''}" aria-label="Frist für ${esc(t.titel)}">
      <span style="flex:1"></span><button class="btn" data-open="${t.id}" data-ask="1">Rückfrage</button><button class="btn dng" data-rej="${t.id}">Ablehnen</button></div>`:''}</div>`; }

function vListen(el){ const V=tasks().filter(t=>inFilter(t)||wen==='alle');

    const X=V.filter(t=>curList==='-'?!list(t.liste):t.liste===l.id), O=X.filter(t=>open(t)||t.status==='neu').sort(sortT), E=X.filter(t=>t.status==='erledigt').sort((a,b)=>(b.erledigtAm||0)-(a.erledigtAm||0));

function vErledigt(el){ const T=tasks().filter(t=>(t.status==='erledigt'||t.status==='abgelehnt')&&(wen==='alle'||inFilter(t)||(wen==='me'&&t.erledigtVon===me))).sort((a,b)=>(b.erledigtAm||b.upd)-(a.erledigtAm||a.upd));
  const by={}; T.slice(0,doneN).forEach(t=>{ const k=iso(new Date(t.erledigtAm||t.upd)); (by[k]=by[k]||[]).push(t); });
  const d7=T.filter(t=>t.status==='erledigt'&&t.erledigtAm>Date.now()-7*864e5), cnt={}; d7.forEach(t=>cnt[t.erledigtVon]=(cnt[t.erledigtVon]||0)+1);

    ${Object.keys(by).map(k=>sec(k===today()?'Heute':k===kAdd(today(),-1)?'Gestern':fDay(k),by[k],{status:1})).join('')||'<div class="card" style="margin-top:14px"><div class="empty">Noch nichts erledigt.</div></div>'}

/* ---------- Detailblatt ---------- */
const WDH=[['','nie'],['tag','täglich'],['werktags','werktags'],['woche','wöchentlich'],['woche2','alle 2 Wochen'],['monat','monatlich'],['jahr','jährlich']];
function wdhKey(w){ if(!w) return ''; const n=+w.n||1, T=w.tage||[];
  if(w.typ==='tag'&&n===1) return 'tag';
  if(w.typ==='woche'&&n===1&&T.length===5&&[1,2,3,4,5].every(x=>T.includes(x))) return 'werktags';
  if(w.typ==='woche'&&n===1&&T.length<=1) return 'woche';
  if(w.typ==='woche'&&n===2&&!T.length) return 'woche2';
  if(w.typ==='monat'&&n===1) return 'monat'; if(w.typ==='jahr'&&n===1) return 'jahr'; return 'eigen'; }
function wdhFrom(k,t){ const old=t.wdh||{};
  const M={tag:{typ:'tag',n:1},werktags:{typ:'woche',n:1,tage:[1,2,3,4,5]},woche:{typ:'woche',n:1,tage:t.due?[wd(t.due)]:[]},woche2:{typ:'woche',n:2},monat:{typ:'monat',n:1},jahr:{typ:'jahr',n:1}};
  return M[k]?{...M[k],basis:old.basis||'termin',rot:old.rot||[]}:null; }
function openTask(id,ask){ const t=D.tasks[id]; if(!t||t.del) return; sheet={m:'task',id,t:JSON.parse(JSON.stringify(t)),dirty:false}; markSeen(id); drawSheet(); show(); render();
  if(ask) setTimeout(()=>{ const c=$('cmt'); if(c){ c.focus(); c.scrollIntoView({block:'center'}); } },60); }
function openNew(r){ if(!canEdit()) return; const t=newTask(r||parse(qa)); sheet={m:'task',id:null,t,dirty:true,isNew:true}; drawSheet(); show(); setTimeout(()=>{ const i=$('tTit'); if(i&&!i.value) i.focus(); },60); }
function show(){ $('ov').classList.add('show'); }
function closeSheet(force){ if(!force&&sheet&&sheet.m==='task'&&sheet.dirty&&!confirm(sheet.isNew?'Die neue Aufgabe verwerfen?':'Änderungen verwerfen?')) return; if(sheet&&sheet.m==='who'&&!me) return;
  sheet=null; $('ov').classList.remove('show'); render(); }
function drawSheet(){ const s=sheet, d=$('dlg'); if(!s) return;

      ${!ed?`<p class="note">Von ${esc(pName(t.von))} eingetragen${canTick(t)?' – du kannst abhaken, die Checkliste abhaken und kommentieren.':canEdit()?' – du kannst kommentieren.':'.'}</p>`:''}

        ${t.due?`<label class="sw"><input type="checkbox" id="tArt"${t.art==='am'?' checked':''}${dis}> Fester Termin (genau an diesem Tag, nicht „bis“)</label>`:''}</div>
      <div class="fs"><span class="lt">Für</span><div class="fl">${PL.map(p=>`<button class="opt" data-fuer="${esc(p.id)}" aria-pressed="${t.fuer===p.id}"${dis}>${av(p.id)}${esc(p.id===me?'mich':p.name)}</button>`).join('')}</div>

function readForm(){ const s=sheet; if(!s||s.m!=='task') return; const t=s.t, v=id=>{ const e=$(id); return e?e.value:null; };

  const pv=$('tPriv'); if(pv) t.privat=pv.checked&&privOk(t); else if(!privOk(t)) t.privat=false;

  if(!privOk(t)) t.privat=false;
  if(s.isNew){ t.status=wishRule(t.fuer)?'neu':'offen'; put('tasks',t); note(t.id,t.status==='neu'?'hat sich das gewünscht':'hat eingetragen',true); }
  else { const o=D.tasks[s.id], ch=[]; [['titel','Titel'],['notiz','Notiz'],['due','Datum'],['zeit','Uhrzeit'],['prio','Wichtig'],['fuer','Für'],['liste','Liste']].forEach(([k,l])=>{ if(String(o[k]??'')!==String(t[k]??'')) ch.push(l); });
    if(JSON.stringify(o.wdh)!==JSON.stringify(t.wdh)) ch.push('Wiederholung'); if(JSON.stringify(o.check)!==JSON.stringify(t.check)) ch.push('Checkliste');
    if(!!o.privat!==!!t.privat) ch.push('Privat');
    ['status','erledigtVon','erledigtAm'].forEach(k=>t[k]=o[k]);   // Status kann sich inzwischen (Sync) geändert haben

  save(); sheet.dirty=false; closeSheet(true); toast(s.isNew?(t.status==='neu'?`Wunsch an ${pName(t.fuer)} geschickt`:'Eingetragen'+(isPriv(t)?' (privat)':'')):'Gespeichert'); }

let dashUndo=null;
window.__dashAct=function(kind,id){ if(!D) return {ok:false,error:'noch nicht geladen'};

  if(kind!=='done') return {ok:false,error:'unbekannt'};
  const t=D.tasks[id]; if(!t||t.del) return {ok:false,error:'Aufgabe nicht gefunden'};
  if(!open(t)||!canTick(t)) return {ok:false,error:'Diese Aufgabe kannst du nicht abhaken'};
  let cap=null; const ot=toast; toast=(m,u)=>{ cap={m,u}; };
