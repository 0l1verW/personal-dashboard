<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B4BE0"><title>Familie &amp; Rechte · {{TITLE}}</title><link rel="stylesheet" href="/fonts/fonts.css">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/uni-64.png"><link rel="apple-touch-icon" href="/icons/uni-180.png">
<script>try{var t=localStorage.getItem('launcher_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#EEF1F8;--card:#fff;--card2:#F6F8FC;--card3:#E9EEF6;--ink:#141B2C;--muted:#5C6680;--border:#E1E6F0;--border2:#CBD3E2;--accent:#5B4BE0;--good:#0D7038;--bad:#A8241A;--warn:#8F5400;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1016;--card:#161B25;--card2:#1B212D;--card3:#242C3A;--ink:#EAEEF6;--muted:#98A3B8;--border:#28303F;--border2:#3A4458;--accent:#8B7CF5;--good:#5AD597;--bad:#FF8577;--warn:#F2B65C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1016;--card:#161B25;--card2:#1B212D;--card3:#242C3A;--ink:#EAEEF6;--muted:#98A3B8;--border:#28303F;--border2:#3A4458;--accent:#8B7CF5;--good:#5AD597;--bad:#FF8577;--warn:#F2B65C;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
main{max-width:860px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 120px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px}
h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:26px;letter-spacing:-.4px;flex:1}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.intro{color:var(--muted);font-size:14px}
.pc{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.ph{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 44px 44px;gap:8px;align-items:center}
.ph input[type=color]{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:none;padding:3px;cursor:pointer}
.in{width:100%;min-width:0;padding:10px 11px;border:1px solid var(--border);border-radius:11px;background:var(--card2);font-size:15px}
.in:focus{outline:none;border-color:var(--accent);background:var(--card)}
.in.nm{font-weight:700;font-size:16px}
.kz{position:relative}.kz::before{content:"@";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}.kz .in{padding-left:25px}
.x{width:44px;height:44px;border-radius:11px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--muted);font-size:18px}
.x:hover{border-color:var(--bad);color:var(--bad)}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card3);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tag.ad{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lt{font:600 11.5px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);min-width:96px}
.btn{min-height:40px;padding:8px 13px;border-radius:10px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dng:hover{border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--card2)}
.seg button{border:0;background:none;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[aria-pressed="true"].v0{background:var(--muted)}
.seg button:disabled{cursor:default;opacity:.55}
.rt{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.rr{display:flex;align-items:center;gap:10px;padding:8px 10px;flex-wrap:wrap}
.rr+.rr{border-top:1px solid var(--border)}
.rr .an{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rr.sub{background:var(--card2);padding-left:30px}
.rr.sub .an{font-weight:500;color:var(--muted);font-size:13.5px}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.sw input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--card3);border:1px solid var(--border2);position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked{background:var(--accent);border-color:var(--accent)}.sw input:checked::after{left:20px}
.sw input:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--muted)}
.sf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px}
.sf .in{width:170px;flex:1}
.sf .seg button[aria-pressed="true"].v0{background:var(--accent)}
.sf.pinf{flex-direction:column;align-items:center;padding:16px 10px 6px}.sf.pinf #pph{width:100%}
.err{color:var(--bad);font-size:13px;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);display:flex;justify-content:center;gap:10px;transform:translateY(110%);transition:transform .2s}
.bar.show{transform:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (pointer:coarse){.in{font-size:16px}}
@media (max-width:560px){.ph{grid-template-columns:44px minmax(0,1fr) 44px}.ph .kz{grid-column:2;grid-row:2}.ph .x{grid-column:3;grid-row:1}.lt{min-width:0;width:100%}}
</style></head><body>
<main>
  <header><a class="back" href="/">← Dashboard</a><h1>Familie &amp; Rechte</h1></header>
  <p class="intro">Hier legst du fest, wer welches Tool sehen oder bearbeiten darf. Admins dürfen alles und diese Seite öffnen – dafür brauchen sie eine PIN oder ein Passwort. Ohne PIN kann jede Person auf jedem Gerät ausgewählt werden.</p>
  <div id="list"></div>
  <button class="btn" id="add" style="align-self:flex-start">+ Person</button>
</main>
<div class="bar" id="bar"><button class="btn" id="undo">Verwerfen</button><button class="btn pri" id="save">Änderungen speichern</button></div>
<div class="toast" id="toast" role="status"></div>
<script src="/pinpad.js"></script>
<script>
var R=null, pers=[], rec={}, dirty=false, form=null;
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2400); }
function slug(s){ return String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'').slice(0,20); }
function req(m,u,b){ return fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'}); }
function load(){ return req('GET','/api/rechte').then(function(r){ if(r.status===403){ location.href='/anmelden?z=/verwaltung'; throw 0; } return r.json(); }).then(function(x){ R=x;
  pers=JSON.parse(JSON.stringify(x.personen)); rec={};
  pers.forEach(function(p){ var e=x.rechte[p.id]; rec[p.id]={admin:e.adminFlag||p.id===x.ownerId,sicht:e.sicht,tools:Object.assign({},e.tools)}; });
  setDirty(false); draw(); }); }
function setDirty(v){ dirty=v; $('bar').classList.toggle('show',v); }
function seg(name,val,opts,dis){ return '<span class="seg" role="group">'+opts.map(function(o,i){ return '<button class="v'+i+'" data-seg="'+esc(name)+'" data-val="'+o[0]+'" aria-pressed="'+(val===o[0])+'"'+(dis?' disabled':'')+'>'+o[1]+'</button>'; }).join('')+'</span>'; }
function draw(){ var oid=R.ownerId;
  $('list').innerHTML=pers.map(function(p,i){ var r=rec[p.id], own=p.id===oid, lk=R.lock[p.id], isNew=!R.rechte[p.id], adm=own||(r.admin&&lk);
    var h='<section class="pc" aria-label="'+esc(p.name)+'"><div class="ph"><input type="color" value="'+esc(p.farbe||'#7D8597')+'" data-f="farbe" data-i="'+i+'" aria-label="Farbe">'
      +'<input class="in nm" value="'+esc(p.name)+'" data-f="name" data-i="'+i+'" aria-label="Name" placeholder="Name">'
      +'<span class="kz"><input class="in" value="'+esc(p.kz||'')+'" data-f="kz" data-i="'+i+'" aria-label="Kürzel" placeholder="kürzel"></span>'
      +(own||p.id===R.ich?'<span></span>':'<button class="x" data-rm="'+i+'" aria-label="'+esc(p.name)+' entfernen">×</button>')+'<span></span></div>';
    // Schutz
    h+='<div class="line"><span class="lt">Anmeldung</span>'+(lk?'<span class="tag ok">'+(lk==='pin'?'PIN':'Passwort')+' gesetzt</span>':'<span class="tag">ohne Schutz</span>');
    if(isNew) h+='<span class="hint">Erst speichern, dann PIN festlegen.</span>';
    else if(!(own&&R.ich!==oid&&!R.open)) h+='<button class="btn" data-sec="'+esc(p.id)+'">'+(lk?'Ändern':'PIN/Passwort festlegen')+'</button>'+(lk&&!own&&p.id!==R.ich?'<button class="btn dng" data-unsec="'+esc(p.id)+'">Entfernen</button>':'')+(lk&&p.id===R.ich?'<span class="hint">Eigenen Schutz entfernst du im Dashboard-Menü.</span>':'');
    h+='</div>';
    if(form&&form.pid===p.id&&form.kind==='pin') h+='<div class="sf pinf">'+seg('kind',form.kind,[['pin','PIN'],['pw','Passwort']])+'<div id="pph"></div></div>';
    else if(form&&form.pid===p.id) h+='<div class="sf">'+seg('kind',form.kind,[['pin','PIN'],['pw','Passwort']])
      +(p.id===R.ich&&lk&&!R.open?'<input class="in" type="password" id="sAlt" placeholder="bisherige" autocomplete="current-password" aria-label="Bisherige PIN oder Passwort">':'')
      +'<input class="in" type="password" id="sNeu" placeholder="'+(form.kind==='pin'?'neue PIN (4–8 Ziffern)':'neues Passwort')+'" autocomplete="new-password" '+(form.kind==='pin'?'inputmode="numeric" maxlength="8"':'')+' aria-label="Neu">'
      +'<button class="btn pri" data-secsave="1">Speichern</button><button class="btn" data-seccancel="1">Abbrechen</button><span class="err" id="sErr"></span></div>';
    // Admin
    h+='<div class="line"><span class="lt">Rolle</span>'+(own?'<span class="tag ad">Besitzer · darf alles</span>'
      :'<label class="sw"><input type="checkbox" data-admin="'+esc(p.id)+'"'+(r.admin?' checked':'')+(lk?'':' disabled')+'> Admin</label>'+(lk?'<span class="hint">Admins dürfen alles und Rechte verwalten.</span>':'<span class="hint">Admin geht nur mit PIN/Passwort.</span>'))+'</div>';
    // Rechte
    h+='<div class="rt">'+R.apps.map(function(a){ var v=adm?'edit':(r.tools[a.id]||'none');
      var row='<div class="rr"><span class="an"><i class="dot" style="background:'+esc(a.farbe||'#7D8597')+'"></i>'+esc(a.titel)+'</span>'+seg(p.id+'|'+a.id,v,[['none','Kein'],['view','Sehen'],['edit','Bearbeiten']],adm)+'</div>';
      if(a.proPerson&&v!=='none') row+='<div class="rr sub"><span class="an">sieht</span>'+seg(p.id+'|sicht',adm?'alle':r.sicht,[['eigene','Nur eigene'],['alle','Alle']],adm)+'</div>';
      return row; }).join('')+'</div>';
    return h+'</section>'; }).join('');
  if(form&&form.kind==='pin'&&$('pph')){ var fp=form.pid, mine=fp===R.ich, lk0=R.lock[fp], pl=(R.plen||{})[fp];
    PinPad.setup($('pph'),{needAlt:mine&&lk0&&!R.open?(lk0==='pin'?'pin':'pw'):null,altLen:pl,defLen:pl||(fp===R.ownerId?6:4),
      onCancel:function(){ form=null; draw(); },
      onSave:function(neu,alt){ return req('POST','/api/geheimnis',{pid:fp,neu:neu,alt:alt,kind:'pin'}).then(function(r){
        if(r.ok){ form=null; toast('PIN gespeichert – andere Geräte dieser Person sind abgemeldet'); load(); return true; }
        return r.json().catch(function(){ return {}; }).then(function(x){ return x.error==='altes falsch'?'alt':(x.error||'Fehler'); }); }); }});
    var pc=$('pph').closest('.pc'); if(pc&&pc.scrollIntoView) pc.querySelector('.pinf').scrollIntoView({block:'nearest'}); }
  else if(form){ var n=$('sAlt')||$('sNeu'); if(n) n.focus(); } }
document.addEventListener('click',function(e){ var t=e.target.closest('button'); if(!t) return; var d=t.dataset;
  if(d.seg){ var k=d.seg.split('|');
    if(d.seg==='kind'){ form.kind=d.val; return draw(); }
    if(k[1]==='sicht') rec[k[0]].sicht=d.val; else rec[k[0]].tools[k[1]]=d.val; setDirty(true); return draw(); }
  if(d.sec){ form={pid:d.sec,kind:R.lock[d.sec]||'pin'}; return draw(); }
  if(d.seccancel){ form=null; return draw(); }
  if(d.secsave){ var neu=$('sNeu').value, alt=$('sAlt')?$('sAlt').value:'';
    if(form.kind==='pin'&&!/^\d{4,8}$/.test(neu)){ $('sErr').textContent='4–8 Ziffern'; return; }
    if(form.kind==='pw'&&neu.length<4){ $('sErr').textContent='mindestens 4 Zeichen'; return; }
    return req('POST','/api/geheimnis',{pid:form.pid,neu:neu,alt:alt,kind:form.kind}).then(function(r){
      if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(x){ $('sErr').textContent=x.error==='altes falsch'?'Bisherige stimmt nicht':(x.error||'Fehler'); });
      form=null; toast('Gespeichert – andere Geräte dieser Person sind abgemeldet'); return load(); }); }
  if(d.unsec){ var p=pers.filter(function(x){ return x.id===d.unsec; })[0];
    if(!confirm('Schutz für '+p.name+' entfernen? Dann kann jede Person auf jedem Gerät „'+p.name+'“ auswählen. Admin-Rechte ruhen ohne Schutz.')) return;
    return req('POST','/api/geheimnis',{pid:d.unsec,neu:''}).then(function(){ toast('Entfernt'); load(); }); }
  if(d.rm){ var q=pers[+d.rm]; if(!confirm(q.name+' entfernen? Zugang und Rechte werden gelöscht; Aufgaben behalten den Namen.')) return; pers.splice(+d.rm,1); delete rec[q.id]; setDirty(true); return draw(); }
  if(t.id==='add'){ var id='p'+Date.now().toString(36); pers.push({id:id,name:'',kz:'',farbe:'#7D8597'}); rec[id]={admin:false,sicht:'eigene',tools:{}};
    R.apps.forEach(function(a){ rec[id].tools[a.id]=a.familie?'edit':'none'; }); setDirty(true); draw(); var n=document.querySelectorAll('.nm'); n[n.length-1].focus(); return; }
  if(t.id==='undo'){ form=null; return load(); }
  if(t.id==='save'){ var ok=pers.filter(function(p){ return p.name.trim(); }), seen={};
    ok.forEach(function(p){ p.name=p.name.trim(); var k=slug(p.kz||p.name)||p.id; while(seen[k]) k+='2'; seen[k]=1; p.kz=k; });
    var rr={}; ok.forEach(function(p){ rr[p.id]=rec[p.id]; });
    t.disabled=true;
    return req('PUT','/api/personen',{savedAt:Date.now(),list:ok}).then(function(r){ if(!r.ok) throw 0; return req('PUT','/api/rechte',{p:rr}); })
      .then(function(r){ if(!r.ok) throw 0; t.disabled=false; toast('Gespeichert'); return load(); })
      .catch(function(){ t.disabled=false; toast('Speichern fehlgeschlagen'); }); }
});
document.addEventListener('change',function(e){ var el=e.target;
  if(el.dataset.admin){ rec[el.dataset.admin].admin=el.checked; setDirty(true); draw(); } });
document.addEventListener('input',function(e){ var el=e.target; if(el.dataset.f){ pers[+el.dataset.i][el.dataset.f]=el.value; setDirty(true); } });
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.target.id==='sNeu'||e.target.id==='sAlt')){ var b=document.querySelector('[data-secsave]'); if(b) b.click(); } });
window.addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });
load();
</script></body></html>
