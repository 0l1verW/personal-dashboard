function actFrame(a){ var x=ACT[a.id]; if(x&&x.f.isConnected){ clearTimeout(x.t); return x.ready; }
  var f=document.createElement('iframe'); f.src='/'+encodeURI(a.datei)+'#hintergrund'; f.title='Wird im Hintergrund erledigt'; f.tabIndex=-1; f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;left:-9999px;top:0;width:400px;height:300px;border:0;opacity:0;pointer-events:none'; document.body.appendChild(f);
  x=ACT[a.id]={f:f}; x.ready=new Promise(function(res,rej){ var n=0; (function poll(){ var w=null; try{ w=f.contentWindow; }catch(e){}
      if(w&&typeof w.__dashAct==='function'&&w.document&&w.document.readyState==='complete') return setTimeout(function(){ res(w); },150);
      if(++n>60) return rej(new Error('Tool lädt nicht')); setTimeout(poll,200); })(); });
  return x.ready; }
function actClose(id,ms){ var x=ACT[id]; if(!x) return; clearTimeout(x.t); x.t=setTimeout(function(){ try{ x.f.remove(); }catch(e){} delete ACT[id]; },ms); }
function act(w,kind,id){ return new Promise(function(res){ var n=0; (function go(){ var r={ok:false,error:'Fehler'}; try{ r=w.__dashAct(kind,id)||r; }catch(e){ r={ok:false,error:String(e&&e.message||e)}; }
    if(!r.ok&&r.error==='noch nicht geladen'&&++n<20) return setTimeout(go,200); res(r); })(); }); }
var pdtT=0;
function pdToast(m,undo){ var t=$('pdt'); if(!t){ t=document.createElement('div'); t.id='pdt'; t.className='pdt'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.innerHTML=esc(m)+(undo?'<button type="button" id="pdUndo">Rückgängig</button>':''); t.classList.add('show'); clearTimeout(pdtT); pdtT=setTimeout(function(){ t.classList.remove('show'); },undo?6000:2600);
  if(undo) $('pdUndo').onclick=function(){ t.classList.remove('show'); undo(); }; }
function abhaken(btn){ var p=btn.dataset.ab.split('|'), a=APPS.filter(function(x){ return x.id===p[0]; })[0], k=btn.dataset.ab; if(!a||DONE[k]) return;
  DONE[k]=1; render();
  actFrame(a).then(function(w){ return act(w,'done',p[1]).then(function(r){
      if(!r.ok){ delete DONE[k]; render(); actClose(a.id,1000); return pdToast(r.error||'Nicht erledigt'); }
      pdToast(r.text||'Erledigt',r.undo?function(){ act(w,'undo').then(function(u){ delete DONE[k]; pdToast(u.ok?'Wieder offen':(u.error||'Fehler')); setTimeout(function(){ load(); },2300); actClose(a.id,4000); }); }:null);
      setTimeout(function(){ load().then(function(){ delete DONE[k]; render(); }); },2300); actClose(a.id,9000); }); })
    .catch(function(e){ delete DONE[k]; render(); actClose(a.id,0); pdToast('Aufgaben ließ sich nicht laden – bitte in der App abhaken'); }); }
/* Schnellaktion einer Kachel (z. B. „+250 ml“): legt einen Eintrag in einer Sammlung des Tools an – der Sync-Modus „liste“ führt ihn auf dem Pi zusammen */
function bump(o,path,by){ var k=path.split('.'), x=o; for(var i=0;i<k.length-1;i++){ x=x&&x[k[i]]; } if(x&&typeof x[k[k.length-1]]==='number') x[k[k.length-1]]=Math.round((x[k[k.length-1]]+by)*100)/100; }
function quick(t){ var p=t.dataset.act.split('|'), a=APPS.filter(function(x){ return x.id===p[0]; })[0], s=SUM[p[0]], ac=s&&s.aktionen&&s.aktionen[+p[1]];
  if(!a||!ac||!ac.key||!ac.coll) return; t.disabled=true;
  var now=new Date(), id=(ac.pre||'x')+now.getTime().toString(36)+Math.random().toString(36).slice(2,5), body={savedAt:now.getTime()}, it={};
  Object.keys(ac.item||{}).forEach(function(k){ it[k]=ac.item[k]; });
  it.id=id; it.datum=todayISO(); it.zeit=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'); it.upd=now.getTime();
  body[ac.coll]={}; body[ac.coll][id]=it;
  var put=function(u,b){ return fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),credentials:'same-origin'}); };
  put('/api/'+ac.key,body).then(function(r){ if(!r.ok) throw new Error('nicht gespeichert');
      if(!s.zahl||!s.zahl.datum||s.zahl.datum===todayISO()){ (ac.plus||[]).forEach(function(q){ bump(s,q[0],q[1]); }); s.savedAt=Date.now(); return put('/api/sum_'+a.id,s); } })
    .then(function(){ render(); })
    .catch(function(){ t.disabled=false; t.textContent='nicht gespeichert'; setTimeout(render,2500); }); }
function render(){
  $('date').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  var p=person(me); $('whoAv').textContent=p?p.name.charAt(0).toUpperCase():'?'; $('whoAv').style.background=p?p.farbe:'var(--muted)'; $('whoName').textContent=p?p.name:'Wer bist du?';
  var list=APPS;
  if(!list.length){ $('tiles').innerHTML='<div class="note">Für dich ist noch kein Tool freigegeben. Frag '+esc((owner()||{}).name||'Alex')+', ob er dir etwas freischaltet.</div>'; return; }
  var withT=list.some(function(a){ var s=adapt(a.id,SUM[a.id]); return s&&(s.termine||(s.zeilen||[]).some(function(z){ return z&&z.due; })); });
  var G=[], byG={}; list.forEach(function(a){ var g=a.gruppe||''; if(!byG[g]){ byG[g]=[]; G.push(g); } byG[g].push(a); });
  var h=withT?'<div class="bento">'+heuteTile(list)+'</div>':'';
  G.forEach(function(g,i){ var lab=G.length>1&&g; h+=(lab?'<h2 class="grp">'+esc(g)+'</h2>':'')+'<div class="bento"'+(lab||(!withT&&i===0)?'':' style="margin-top:14px"')+'>'+byG[g].map(tile).join('')+'</div>'; });
  $('tiles').innerHTML=h; }
function load(){
  return Promise.all([fetch('/api/personen').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }).then(function(x){ if(x&&x.list&&x.list.length) P=x; })]
    .concat(APPS.map(function(a){ return fetch('/api/sum_'+a.id+'?t='+Date.now()).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }).then(function(x){ SUM[a.id]=x; }); })))
    .then(render).then(bgCheck).then(sysCheck); }
/* Admins: Hinweis, wenn am Pi etwas nicht stimmt (Sicherung, Uhr, Temperatur, Strom, Speicher); Rotes zuerst */
var sysT=0;
function sysCheck(){ if(!isAdmin()||Date.now()-sysT<5*60e3) return; sysT=Date.now();
  fetch('/api/system_hinweise').then(function(r){ return r.ok?r.json():[]; }).then(function(H){ H=(H||[]).filter(function(h){ return h.ton==='rot'||h.ton==='gelb'; })
      .sort(function(a,b){ return (a.ton==='rot'?0:1)-(b.ton==='rot'?0:1); });
    var rot=H.some(function(h){ return h.ton==='rot'; });
    $('sysh').innerHTML=H.length?'<a class="sysh'+(rot?' rot':'')+'" href="/system"><i></i><span>'+esc(H[0].text)+(H.length>1?' (+'+(H.length-1)+')':'')+'</span><b>Ansehen ›</b></a>':''; }).catch(function(){}); }
/* Kacheln mit Zusatz-Skript (z. B. Planer): Vorschau hängt von der Zeit ab („läuft“, „Frist vorbei“) und kommt sonst nur,
   wenn das Tool geöffnet wird. Darum lädt das Dashboard das Tool kurz unsichtbar und holt sich die aktuelle Vorschau. */
function bgCheck(){ APPS.forEach(function(a){ var s=SUM[a.id]; if(!a.bg||a.lvl!=='edit') return;
  if(!s||s.v!==1||(a.bgZeit&&Date.now()-(+s.savedAt||0)>20*60e3)||(s.bis&&Date.now()>+s.bis)) bgRefresh(a); }); }
function bgRefresh(a){ var k='pd_bg_'+a.id; try{ if(Date.now()-(+sessionStorage.getItem(k)||0)<5*60e3) return; sessionStorage.setItem(k,Date.now()); }catch(e){}
  if(document.getElementById('bg_'+a.id)) return;
  var f=document.createElement('iframe'); f.id='bg_'+a.id; f.src='/'+encodeURI(a.datei)+'#hintergrund'; f.title='Vorschau wird aktualisiert'; f.tabIndex=-1; f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;left:-9999px;top:0;width:400px;height:300px;border:0;opacity:0;pointer-events:none';
  var tries=0, done=function(){ try{ f.remove(); }catch(e){} };
  var poll=function(){ tries++; var w=null; try{ w=f.contentWindow; }catch(e){}
    var b=w&&(w.__dashSum||w.__planerSum), s=null; try{ if(b) s=b(); }catch(e){}
    if(s&&s.v===1&&(s.zeilen&&s.zeilen.length||s.termine&&s.termine.length||tries>6)){
      fetch('/api/sum_'+a.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)}).then(function(r){ if(r.ok){ SUM[a.id]=s; render(); } }).catch(function(){}).then(done); return; }
    if(tries<12) setTimeout(poll,1000); else done(); };
  f.onload=function(){ setTimeout(poll,1500); };
  document.body.appendChild(f); }

/* Person: anzeigen, wechseln, eigene PIN/Passwort, Verwaltung (Admins) */
var sec=null;
function openWho(){ sec=null; drawWho(); $('ov').classList.add('show'); }
function closeWho(){ $('ov').classList.remove('show'); }
function post(u,b){ return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{}),credentials:'same-origin'}); }
function drawWho(){ var p=person(me)||{name:me||'?',farbe:'#7D8597'}, lk=ROLE.lock[me], own=me===ROLE.ownerId;
  var h='<div class="mec"><span class="av avl" style="background:'+esc(p.farbe)+'">'+esc(p.name.charAt(0).toUpperCase())+'</span><div><b>'+esc(p.name)+'</b><div class="sub">'
    +(ROLE.open?'Kein Passwort aktiv – jedes Gerät darf alles':(lk?(lk==='pin'?'mit PIN':'mit Passwort')+' angemeldet':'ohne PIN – jede Person kann dich auswählen'))+(ROLE.admin&&!ROLE.open?' · Admin':'')+'</div></div></div>';
  if(ROLE.open&&own) h+='<p class="warnp"><b>Noch keine PIN und kein Passwort für dich.</b> Solange du ungeschützt bist, darf jedes Gerät alles. Leg jetzt eins fest – danach gelten die Rechte.</p>';
  var segH='<span class="seg2" role="group"><button data-kind="pin" aria-pressed="'+(sec&&sec.kind==='pin')+'">PIN</button><button data-kind="pw" aria-pressed="'+(sec&&sec.kind==='pw')+'">Passwort</button></span>';
  var delWarn=own?'Danach ist der Schutz aus: <b>jedes Gerät darf alles</b>, bis du wieder eine PIN oder ein Passwort festlegst.'
    :'Danach kann jede Person auf jedem Gerät „'+esc(p.name)+'“ auswählen.'+(ROLE.admin?' Deine Admin-Rechte ruhen, solange du keinen Schutz hast.':'');
  if(sec&&sec.kind==='del') h+='<div class="sf"><p class="warnp">'+delWarn+'</p>'+(lk==='pin'?'<div id="pph"></div>'
    :'<input class="in" type="password" id="dAlt" placeholder="Passwort zur Bestätigung" autocomplete="current-password" aria-label="Passwort zur Bestätigung"><div class="acts"><button class="btn" id="sX">Abbrechen</button><button class="btn pri" id="dOk" style="background:#C0392B;border-color:#C0392B">Passwort entfernen</button></div><div class="err" id="sErr" role="alert"></div>')+'</div>';
  else if(sec&&sec.kind==='pin') h+='<div class="sf">'+segH+'<div id="pph" style="margin-top:6px"></div></div>';
  else if(sec) h+='<div class="sf">'+segH
    +(lk&&!ROLE.open?'<input class="in" type="password" id="sAlt" placeholder="bisherige" autocomplete="current-password" aria-label="Bisherige PIN oder Passwort">':'')
    +'<input class="in" type="password" id="sNeu" placeholder="'+(sec.kind==='pin'?'neue PIN (4–8 Ziffern)':'neues Passwort')+'" autocomplete="new-password"'+(sec.kind==='pin'?' inputmode="numeric" maxlength="8"':'')+' aria-label="Neu">'
    +'<div class="acts"><button class="btn" id="sX">Abbrechen</button><button class="btn pri" id="sOk">Speichern</button></div><div class="err" id="sErr" role="alert"></div></div>';
  else h+='<div class="acts col"><a class="btn" href="/anmelden?z=/">Person wechseln</a><button class="btn" id="sec">'+(lk&&!ROLE.open?'PIN/Passwort ändern':'PIN/Passwort festlegen')+'</button>'
    +(lk&&!ROLE.open?'<button class="btn dng" id="secdel">'+(lk==='pin'?'PIN':'Passwort')+' entfernen</button>':'')
    +(isAdmin()?'<a class="btn" href="/verwaltung">Familie &amp; Rechte verwalten</a><a class="btn" href="/system">System &amp; Sicherung</a>':'')+'<button class="btn" id="logout">Abmelden</button></div>';
  $('manage').innerHTML=h;
  if(sec&&sec.kind==='del'&&lk==='pin') PinPad($('pph'),{title:'PIN eingeben zum Entfernen',len:(ROLE.plen||{})[me]||0,onCancel:function(){ sec=null; drawWho(); },
    onDone:function(pin){ return delSecret(pin).then(function(m){ return m===true?true:m; }); }});
  else if(sec&&sec.kind==='del'){ var dA=$('dAlt'); if(dA) dA.focus(); }
  else if(sec&&sec.kind==='pin') PinPad.setup($('pph'),{needAlt:lk&&!ROLE.open?(lk==='pin'?'pin':'pw'):null,altLen:(ROLE.plen||{})[me],defLen:(ROLE.plen||{})[me]||(own?6:4),
    onCancel:function(){ sec=null; drawWho(); },
    onSave:function(neu,alt){ return post('/api/geheimnis',{pid:me,neu:neu,alt:alt,kind:'pin'}).then(function(r){ if(r.ok){ location.reload(); return true; }
      return r.json().catch(function(){ return {}; }).then(function(x){ return x.error==='altes falsch'?'alt':(x.error||'Fehler'); }); }); }});
  else if(sec){ var f=$('sAlt')||$('sNeu'); if(f) f.focus(); } }
function delSecret(alt){ return post('/api/geheimnis',{pid:me,neu:'',alt:alt}).then(function(r){ if(r.ok){ location.reload(); return true; }
  return r.json().catch(function(){ return {}; }).then(function(x){ return x.error==='altes falsch'?(ROLE.lock[me]==='pin'?'Falsche PIN':'Passwort stimmt nicht'):(x.error||'Fehler'); }); }); }
document.addEventListener('click',function(e){ var t=e.target.closest('button,#who'); if(!t) return;
  if(t.dataset.cal!=null){ var n=+t.dataset.cal; if(n===0){ CAL.off=0; CAL.sel=null; } else { CAL.off+=n; CAL.sel=null; } return render(); }
  if(t.dataset.cday){ CAL.sel=t.dataset.cday; return render(); }
  if(t.dataset.ab) return abhaken(t);
  if(t.dataset.act) return quick(t);
  if(t.id==='who') return openWho();
  if(t.id==='close') return closeWho();
  if(t.id==='logout') return post('/api/abmelden').then(function(){ try{ localStorage.setItem('pd_person',''); }catch(_){} location.replace('/anmelden?z=/'); });
  if(t.id==='sec'){ sec={kind:ROLE.lock[me]||(me===ROLE.ownerId?'pw':'pin')}; return drawWho(); }
  if(t.dataset.kind){ sec.kind=t.dataset.kind; return drawWho(); }
  if(t.id==='sX'){ sec=null; return drawWho(); }
  if(t.id==='secdel'){ sec={kind:'del'}; return drawWho(); }
  if(t.id==='dOk'){ var v=$('dAlt').value; if(!v) return; t.disabled=true; return delSecret(v).then(function(m){ if(m!==true){ t.disabled=false; $('sErr').textContent=m; $('dAlt').value=''; } }); }
  if(t.id==='sOk'){ var neu=$('sNeu').value, alt=$('sAlt')?$('sAlt').value:'';
    if(sec.kind==='pin'&&!/^\d{4,8}$/.test(neu)){ $('sErr').textContent='PIN: 4–8 Ziffern'; return; }
    if(sec.kind==='pw'&&neu.length<4){ $('sErr').textContent='Mindestens 4 Zeichen'; return; }
    return post('/api/geheimnis',{pid:me,neu:neu,alt:alt,kind:sec.kind}).then(function(r){ if(r.ok){ location.reload(); return; }
      return r.json().catch(function(){ return {}; }).then(function(x){ $('sErr').textContent=x.error==='altes falsch'?'Die bisherige stimmt nicht.':(x.error||'Fehler'); }); }); }
  if(t.id==='tb'){ var r=document.documentElement, cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'), nx=cur==='dark'?'light':'dark';
    r.setAttribute('data-theme',nx); try{ ['launcher_theme','sp_theme','cockpit_theme','aufg_theme','essen_theme','haushalt_theme','training_theme'].forEach(function(k){ localStorage.setItem(k,nx); }); }catch(_){} }
});
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.target.id==='sNeu'||e.target.id==='sAlt')){ var b=$('sOk'); if(b) b.click(); } if(e.key==='Enter'&&e.target.id==='dAlt'){ var d=$('dOk'); if(d) d.click(); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeWho(); });
$('ov').addEventListener('click',function(e){ if(e.target.id==='ov') closeWho(); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') load(); });
setInterval(function(){ if(document.visibilityState==='visible'&&!$('ov').classList.contains('show')) load(); },60000);
if(me){ render(); load().then(function(){ if(ROLE.open&&me===ROLE.ownerId&&!sessionStorage.getItem('pd_openhint')){ sessionStorage.setItem('pd_openhint',1); openWho(); } }); }
</script></body></html>
