<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2255C">
<title>Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F6F8FC; --surface-3:#E9EEF6; --border:#E1E6F0; --border-strong:#CBD3E2;
  --ink:#141B2C; --muted:#5C6680; --faint:#646D84; --good-ink:#0D7038; --mid-ink:#8F5400; --bad-ink:#A8241A;
  --accent:#C2255C; --accent-2:#E64980; --accent-fill:#C2255C; --accent-soft:rgba(194,37,92,.09); --accent-line:rgba(194,37,92,.28);
  --pause:#1F7FB8; --pause-soft:rgba(31,127,184,.10); --gold:#B7791F;
  --shadow:0 1px 2px rgba(20,27,44,.04),0 8px 24px rgba(20,27,44,.06); --r:16px; --r-lg:22px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; --disp:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1016; --surface:#161B25; --surface-2:#1B212D; --surface-3:#242C3A; --border:#28303F; --border-strong:#3A4458;
  --ink:#EAEEF6; --muted:#98A3B8; --faint:#8A95AA; --good-ink:#5AD597; --mid-ink:#F2B65C; --bad-ink:#FF8577;
  --accent:#F27AA4; --accent-2:#F78FB4; --accent-fill:#C2255C; --accent-soft:rgba(242,122,164,.13); --accent-line:rgba(242,122,164,.32);
  --pause:#5DB2E8; --pause-soft:rgba(93,178,232,.13); --gold:#E8B04A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1016; --surface:#161B25; --surface-2:#1B212D; --surface-3:#242C3A; --border:#28303F; --border-strong:#3A4458;
  --ink:#EAEEF6; --muted:#98A3B8; --faint:#8A95AA; --good-ink:#5AD597; --mid-ink:#F2B65C; --bad-ink:#FF8577;
  --accent:#F27AA4; --accent-2:#F78FB4; --accent-fill:#C2255C; --accent-soft:rgba(242,122,164,.13); --accent-line:rgba(242,122,164,.32);
  --pause:#5DB2E8; --pause-soft:rgba(93,178,232,.13); --gold:#E8B04A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1040px;margin:0 auto;padding:18px 20px 100px}
@media(max-width:640px){.app{padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.glyph{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent-fill),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--accent-line)}
.glyph svg{width:22px;height:22px}
.brand h1{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.brand .sub{font-size:12.5px;color:var(--muted)}
.ibtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none;flex:none}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn svg{width:18px;height:18px}
/* Navigation */
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:5px;margin-bottom:16px;width:fit-content;box-shadow:var(--shadow)}
.nav button{border:0;background:none;color:var(--muted);font-weight:500;font-size:13.5px;padding:9px 15px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;position:relative}
.nav button svg{width:16px;height:16px;flex:none}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .run{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
@media(max-width:640px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;width:auto;margin:0;border-radius:0;border:0;border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 0 6px;min-width:0}
  .nav button svg{width:22px;height:22px}.nav button[aria-current="page"]{background:none}
  .nav .run{top:4px;right:calc(50% - 18px)}
}
/* Grundbausteine */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-family:var(--disp);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.cap{font-size:12.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}
@media(max-width:860px){.s7,.s6,.s5{grid-column:span 12}}
.btn{font-weight:600;font-size:13.5px;border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:6px;justify-content:center;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.btn.dng:hover{border-color:#D63F30;color:#D63F30}
.btn:disabled{opacity:.45;cursor:default}
.x{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted);display:grid;place-items:center;font-weight:700;flex:none}
.x:hover{border-color:var(--accent);color:var(--accent)}
.x:disabled{opacity:.35;cursor:default}
.x svg{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.in{font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);width:100%;min-width:0}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.in{min-height:70px;resize:vertical;line-height:1.45}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:14px 2px;color:var(--muted);font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;line-height:1.5}
.note b{color:var(--ink)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.head .tt{font-family:var(--disp);font-weight:700;font-size:18px;margin-right:auto;min-width:0}
.head .tt small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted)}
/* Start */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.vk{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface-2);cursor:pointer;min-height:92px}
.vk:hover{border-color:var(--accent)}
.vk b{font-family:var(--disp);font-size:16px}
.vk span{font-size:12.5px;color:var(--muted);line-height:1.4}
.vk em{font-style:normal;font-size:12px;color:var(--accent);font-weight:700;margin-top:auto}
.vk.leer{border-style:dashed;background:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
/* Timer (oben, bleibt beim Scrollen sichtbar) */
.tim{position:sticky;top:8px;z-index:15;background:var(--surface);border:1.5px solid var(--accent-line);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.tim.pause{border-color:color-mix(in srgb,var(--pause) 45%,transparent)}
.tim .tl{display:flex;align-items:center;gap:10px;min-width:0}
.tim .ph{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.tim.pause .ph{color:var(--pause)}
.tim .un{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tim .clk{font-family:var(--mono);font-weight:700;font-size:40px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-left:auto}
.tim.pause .clk{color:var(--pause)}
.tim .clk.sm{font-size:22px}
.tim .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tim .go{flex:1;min-height:54px;font-size:16px;border-radius:14px}
.tim .ent{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.tim .clk{font-size:34px}}
.step{display:flex;align-items:center;gap:6px;min-width:0}
.step .in{text-align:center;font-family:var(--mono);font-weight:700;font-size:20px;padding:6px 4px;min-height:48px}
.step button{width:48px;height:48px;flex:none;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface-2);font-size:22px;font-weight:600;cursor:pointer;color:var(--ink);touch-action:manipulation}
.step button:hover{border-color:var(--accent);color:var(--accent)}
.stepl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.dur{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
/* Übungen im Training */
.uk{margin-bottom:12px;padding:0;overflow:hidden}
.uk.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.uh{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px}
.uh .us{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;text-align:left;cursor:pointer;padding:0;color:var(--ink)}
.uh .us b{font-family:var(--disp);font-size:16px;font-weight:700}
.uh .us span{font-size:12.5px;color:var(--muted);line-height:1.4}
.uh .us .lm{color:var(--ink)}
.uh .us .lm i{font-style:normal;color:var(--muted)}
.unote{display:flex;gap:8px;padding:0 14px 10px}
.unote .in{font-size:13.5px}
.sl{border-top:1px solid var(--border)}
.sr2{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:var(--ink);min-height:44px}
.sr2:first-child{border-top:0}
.sr2:hover{background:var(--surface-2)}
.sr2 .n{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.sr2 .w{font-family:var(--mono);font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr2 .w small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.sr2 .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.pr{display:inline-block;font-family:var(--body);font-size:10.5px;font-weight:800;letter-spacing:.3px;color:#fff;background:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.uadd{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px dashed var(--border);background:var(--surface-2);flex-wrap:wrap}
.tfoot{display:flex;flex-direction:column;gap:10px}
/* Listen */
.lst{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--border);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;color:var(--ink);min-height:48px}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .n{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--muted);grid-column:1/-1;min-width:0}
.li .k{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.li.run .n::after{content:"läuft";font-family:var(--body);font-size:10.5px;font-weight:800;color:#fff;background:var(--accent-fill);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.wh{font:700 11.5px var(--body);letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px;display:flex;justify-content:space-between;gap:8px}
.wh:first-child{margin-top:0}
.grp{font:700 11.5px var(--body);letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.orow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--border)}
.orow:first-child{border-top:0}
.orow .n{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Fortschritt */
.chart{width:100%;height:auto;display:block}
.pk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.pk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hist{display:flex;flex-direction:column}
.hr2{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:13px;align-items:baseline}
.hr2:first-child{border-top:0}
.hr2 .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hr2 .s{min-width:0;overflow-wrap:anywhere}
.hr2 .e{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
/* Blatt */
.ov{position:fixed;inset:0;background:rgba(10,13,20,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:24px 16px;overscroll-behavior:contain}
.ov.show{display:flex}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);width:100%;max-width:560px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;overflow:hidden}
.dlg .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex:none}
.dlg .dh h3{font-family:var(--disp);font-size:17px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.dlg .df{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);flex:none;padding-bottom:max(12px,env(safe-area-inset-bottom))}
@media(max-width:640px){.ov{padding:0;align-items:flex-end}.dlg{max-width:none;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0}}
.srch{position:relative}
.srch .in{padding-left:34px;font-size:15px;min-height:42px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .w2{grid-column:1/-1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:11px 18px;border-radius:11px;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.gold{background:var(--gold);color:#1a1205;font-weight:700}
@media(max-width:640px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
body:has(.ov.show) .toast{bottom:auto;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-90px)}body:has(.ov.show) .toast.show{transform:translateX(-50%) translateY(0)}
.foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (pointer:coarse){
  .in{font-size:16px}.btn{min-height:44px}.btn.sm{min-height:40px}.x{width:44px;height:44px}.ibtn{width:44px;height:44px}.chip{min-height:40px}
  .srch .in{font-size:16px}
}

/* schmale Handys: Gewicht wie 102,5 passt neben die ±-Knöpfe */
@media(max-width:440px){.tim .ent,.dlg .form{gap:8px}.step{gap:4px}.step button{width:40px;height:48px;font-size:20px}.step .in{font-size:17px;padding:6px 2px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></div>
      <div><h1>Training</h1><div class="sub" id="sub"></div></div>
    </div>
    <a class="ibtn" href="/" id="homeBtn" title="Zum Dashboard" aria-label="Zum Dashboard" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></a>
    <button class="ibtn" id="dataBtn" title="Daten sichern" aria-label="Daten und Backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></button>
    <button class="ibtn" id="themeBtn" title="Hell / Dunkel" aria-label="Farbschema wechseln"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </header>
  <nav class="nav" aria-label="Ansichten">
    <button data-v="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Training</button>
    <button data-v="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Verlauf</button>
    <button data-v="fortschritt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Fortschritt</button>
    <button data-v="uebungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Übungen</button>
  </nav>
  <main id="main"></main>
  <div class="foot"><span id="saved"></span> · Daten bleiben auf diesem Gerät<span id="piFoot"></span></div>
</div>
<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT" id="dlg"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="impFile" accept=".json,application/json" class="sr" tabindex="-1">

<script>
"use strict";
/* =====================================================================
   TRAINING – Krafttraining mit Satz- und Pausen-Timer, Vorlagen, Verlauf, Fortschritt
   Speicher: localStorage[KEY]. Sammlungen {id:{…,upd}} – auf dem Pi pro Eintrag zusammengeführt (Sync „liste“).
   Offline zuerst: jede Aktion wird sofort lokal gespeichert, der Pi gleicht später ab.
   Alle Zeiten sind Zeitstempel (ms) – der Timer stimmt auch nach dem Sperren des Handys.
   ===================================================================== */
const KEY='training_v1', APP='training';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{ if(v==null||v==='') return null; const x=parseFloat(String(v).replace(',','.')); return isNaN(x)?null:x; };
const rk=v=>Math.round((+v||0)*100)/100;
const fmt=(v,d=0)=>v==null||isNaN(v)?'–':(+v).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:d});
const fkg=v=>v==null?'–':fmt(v,2);
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'], WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'], MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const GRUPPEN=['Brust','Rücken','Schultern','Beine','Arme','Bauch','Ganzkörper','Sonstiges'];

/* ---------- Datum & Zeit ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const kDate=k=>new Date(k+'T00:00');
const kAdd=(k,n)=>{ const d=kDate(k); d.setDate(d.getDate()+n); return iso(d); };
const kDiff=(a,b)=>Math.round((kDate(a)-kDate(b))/864e5);
const weekStart=k=>kAdd(k,-((kDate(k).getDay()+6)%7));
const fClock=sec=>{ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); };
const fDauer=ms=>{ const m=Math.max(0,Math.round(ms/6e4)), h=Math.floor(m/60); return h?`${h} h ${String(m%60).padStart(2,'0')} min`:`${m} min`; };
const fHM=ms=>{ const d=new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function fTag(k){ const d=kDate(k), t=today(); return k===t?'Heute':k===kAdd(t,-1)?'Gestern':WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'+(d.getFullYear()!==new Date().getFullYear()?String(d.getFullYear()).slice(2):''); }

/* ---------- Startausstattung (feste Kennungen, upd:1 – zwei Geräte legen nichts doppelt an) ---------- */
const STARTUEB=[['u-bank','Bankdrücken','Brust'],['u-schraeg','Schrägbankdrücken (Kurzhantel)','Brust'],['u-schulter','Schulterdrücken','Schultern'],['u-seit','Seitheben','Schultern'],
  ['u-trizeps','Trizepsdrücken am Kabel','Arme'],['u-klimm','Klimmzüge','Rücken'],['u-rudern','Rudern (Langhantel)','Rücken'],['u-latzug','Latzug','Rücken'],['u-face','Face Pulls','Schultern'],
  ['u-bizeps','Bizepscurls','Arme'],['u-kniebeuge','Kniebeugen','Beine'],['u-rdl','Rumänisches Kreuzheben','Beine'],['u-beinpresse','Beinpresse','Beine'],['u-beinbeuger','Beinbeuger','Beine'],
  ['u-waden','Wadenheben','Beine'],['u-plank','Plank','Bauch']];
const STARTVOR=[['v-push','Push',['u-bank','u-schraeg','u-schulter','u-seit','u-trizeps']],['v-pull','Pull',['u-klimm','u-rudern','u-latzug','u-face','u-bizeps']],
  ['v-beine','Beine',['u-kniebeuge','u-rdl','u-beinpresse','u-beinbeuger','u-waden']]];

/* ---------- Zustand ---------- */
const DEFSET=()=>({upd:0,wochenziel:3,schritt:2.5});   // wochenziel: Trainings pro Woche (Ring auf der Kachel) · schritt: kg je ±-Tipp
let D, view='start', tId=null, progU=null, sheet=null, noteOpen={};
function normalize(x){
  x=x&&typeof x==='object'&&!Array.isArray(x)?x:{};
  ['uebungen','vorlagen','trainings'].forEach(c=>{ if(!x[c]||typeof x[c]!=='object'||Array.isArray(x[c])) x[c]={}; });
  if(!Object.keys(x.uebungen).length&&!Object.keys(x.vorlagen).length){   // erster Start: Startausstattung
    STARTUEB.forEach(([id,name,gruppe])=>x.uebungen[id]={id,name,gruppe,upd:1});
    STARTVOR.forEach(([id,name,u],i)=>x.vorlagen[id]={id,name,uebungen:u.slice(),ord:i,upd:1}); }
  const d=DEFSET(); x.set=x.set&&typeof x.set==='object'&&!Array.isArray(x.set)?x.set:d;
  Object.keys(d).forEach(k=>{ if(x.set[k]==null) x.set[k]=d[k]; });
  Object.values(x.trainings).forEach(trN);
  x.app=APP; x.v=1; x.savedAt=+x.savedAt||0; return x; }
function trN(t){ if(!t||t.del) return t;   // Training: fehlende Felder mit Standardwert (keine Daten gehen verloren)
  if(!Array.isArray(t.saetze)) t.saetze=[]; if(!Array.isArray(t.reihe)) t.reihe=[]; if(!t.uebNotiz||typeof t.uebNotiz!=='object') t.uebNotiz={};
  if(!t.namen||typeof t.namen!=='object') t.namen={}; if(t.notiz==null) t.notiz=''; if(!t.name) t.name='Training';
  t.saetze.forEach(s=>{ if(s.uebung&&!t.reihe.includes(s.uebung)) t.reihe.push(s.uebung); });
  return t; }
function load(){ let x=null; try{ x=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){} D=normalize(x); }
let sumT=null;
function save(){ D.savedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){ toast('Speichern im Browser nicht möglich'); }
  clearTimeout(sumT); sumT=setTimeout(pushSum,1200); stamp(); }
const live=c=>Object.values(D[c]).filter(x=>x&&!x.del);
function put(c,it){ it.upd=Date.now(); D[c][it.id]=it; return it; }
function rm(c,id){ const o=D[c][id]; if(o) D[c][id]=c==='uebungen'?{...o,del:true,upd:Date.now()}:{id,upd:Date.now(),del:true}; }   // Übungen behalten ihren Namen (für den Verlauf)
function setS(fn){ fn(D.set); D.set.upd=Date.now(); save(); }

/* ---------- Übungen & Vorlagen ---------- */
const UE=id=>{ const u=D.uebungen[id]; return u&&!u.del?u:null; };
function uName(id,t){ const u=D.uebungen[id]; return (u&&u.name)||(t&&t.namen&&t.namen[id])||'Übung'; }
const uebungen=()=>live('uebungen').sort((a,b)=>a.name.localeCompare(b.name,'de'));
const vorlagen=()=>live('vorlagen').sort((a,b)=>(a.ord??99)-(b.ord??99)||a.name.localeCompare(b.name,'de'));
const norm=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');

/* ---------- Trainings ---------- */
const trainings=()=>live('trainings').map(trN).sort((a,b)=>b.start-a.start);
const laufend=()=>trainings().find(t=>!t.ende)||null;
const satzVon=(t,u)=>t.saetze.filter(s=>s.uebung===u);
/* letztes anderes Training mit dieser Übung (vor `vor`) */
function vorher(u,vor,ohne){ for(const t of trainings()){ if(t.id===ohne||!(t.start<vor)) continue; const S=satzVon(t,u); if(S.length) return {t,S}; } return null; }
/* Vorschlag für den nächsten Satz: der vorige Satz dieses Trainings, sonst der gleiche Satz vom letzten Mal */
function vorschlag(t,u){ const S=satzVon(t,u); if(S.length){ const s=S[S.length-1]; return {kg:s.kg,wdh:s.wdh}; }
  const p=vorher(u,t.start,t.id); if(p){ const s=p.S[0]; return {kg:s.kg,wdh:s.wdh}; } return {kg:null,wdh:null}; }
const satzTxt=s=>(s.kg>0?fkg(s.kg)+' × ':'')+(s.wdh??'–')+(s.kg>0?'':' Wdh.');
const satzListe=S=>S.map(satzTxt).join(' · ');
/* geschätztes Maximalgewicht (1RM) nach Epley; bei 1 Wiederholung das Gewicht selbst */
const e1=s=>!(s.kg>0)||!(s.wdh>0)?0:s.wdh===1?+s.kg:+s.kg*(1+s.wdh/30);
const vol=S=>S.reduce((a,s)=>a+(s.kg>0&&s.wdh>0?s.kg*s.wdh:0),0);
/* Bestwerte: welche Sätze eines Trainings sind neu (schwerer als alles davor bzw. höheres 1RM)? Nur, wenn es die Übung vorher schon gab. */
function prOf(t){ const out={}, base={};
  trainings().forEach(o=>{ if(o.id===t.id||!(o.start<t.start)) return; o.saetze.forEach(s=>{ if(!(s.kg>0&&s.wdh>0)) return; const b=base[s.uebung]=base[s.uebung]||{kg:0,e1:0,n:0}; b.kg=Math.max(b.kg,+s.kg); b.e1=Math.max(b.e1,e1(s)); b.n++; }); });
  t.saetze.forEach((s,i)=>{ if(!(s.kg>0&&s.wdh>0)) return; const b=base[s.uebung]=base[s.uebung]||{kg:0,e1:0,n:0};
    if(b.n){ if(+s.kg>b.kg+1e-9) out[i]='kg'; else if(e1(s)>b.e1+0.05) out[i]='e1'; }
    b.kg=Math.max(b.kg,+s.kg); b.e1=Math.max(b.e1,e1(s)); b.n++; });
  return out; }
/* Verlauf je Übung (älteste zuerst) */
function verlaufU(u){ return trainings().slice().reverse().map(t=>{ const S=satzVon(t,u); if(!S.length) return null;
  const W=S.filter(s=>s.kg>0&&s.wdh>0); return {t,S,top:W.length?Math.max(...W.map(s=>+s.kg)):0,e1:W.length?Math.max(...W.map(e1)):0,vol:vol(S),wdh:S.reduce((a,s)=>a+(+s.wdh||0),0)}; }).filter(Boolean); }
const dauer=t=>(t.ende||Date.now())-t.start;
const wocheN=()=>{ const ws=weekStart(today()); return trainings().filter(t=>t.datum>=ws&&(t.saetze.length||!t.ende)).length; };

/* ---------- Timer: Satz starten → Satzzeit → fertig → kg/Wdh → Pause läuft bis zum nächsten Satz ----------
   lauf = {phase: null|'satz'|'eingabe'|'pause', seit: ms, uebung, satzSek?, pauseSeit?}
   Die Pause zählt ab „fertig“ (das Eintragen gehört schon zur Pause) und wird beim nächsten Satz am vorigen Satz gespeichert. */
function neuesTraining(vid){ const v=vid?D.vorlagen[vid]:null, now=Date.now();
  const reihe=v&&!v.del?(v.uebungen||[]).filter(id=>UE(id)):[], namen={}; reihe.forEach(id=>namen[id]=uName(id));
  const t=put('trainings',{id:uid('t'),datum:today(),start:now,ende:null,name:v&&!v.del?v.name:'Training',vorlage:v&&!v.del?v.id:null,notiz:'',uebNotiz:{},reihe,namen,saetze:[],lauf:{phase:null,seit:now,uebung:reihe[0]||null}});
  save(); return t; }
function letzterSatz(t){ return t.saetze.length?t.saetze[t.saetze.length-1]:null; }
function satzStart(t,u){ const now=Date.now(), L=t.lauf||{};
  if(L.phase==='pause'){ const s=letzterSatz(t); if(s) s.pauseSek=Math.round((now-L.seit)/1000); }
  t.lauf={phase:'satz',seit:now,uebung:u,pauseSeit:L.phase==='pause'?L.seit:null}; put('trainings',t); save(); }
function satzFertig(t){ const now=Date.now(), L=t.lauf; if(!L||L.phase!=='satz') return;
  t.lauf={phase:'eingabe',seit:now,uebung:L.uebung,satzSek:Math.round((now-L.seit)/1000)}; put('trainings',t); save(); }
function satzAbbrechen(t){ const L=t.lauf; if(!L) return; const s=letzterSatz(t);
  if(L.pauseSeit&&s) s.pauseSek=null;
  t.lauf=L.pauseSeit?{phase:'pause',seit:L.pauseSeit,uebung:L.uebung}:{phase:null,seit:Date.now(),uebung:L.uebung}; put('trainings',t); save(); }
/* Satz speichern – mit Timer (aus „eingabe“) oder ohne (direkt eingetragen). Gibt den Index des Satzes zurück. */
function satzSpeichern(t,u,kg,wdh,notiz){ const L=t.lauf||{}, now=Date.now(), mitTimer=L.phase==='eingabe'&&L.uebung===u;
  if(!mitTimer&&L.phase==='pause'){ const s=letzterSatz(t); if(s&&s.pauseSek==null) s.pauseSek=null; }
  const s={uebung:u,nr:satzVon(t,u).length+1,kg:kg==null?0:rk(kg),wdh:wdh==null?null:Math.round(wdh),satzSek:mitTimer?L.satzSek:null,pauseSek:null,t:now};
  if(notiz) s.notiz=notiz;
  t.saetze.push(s); if(!t.reihe.includes(u)) t.reihe.push(u); t.namen[u]=uName(u,t);
  if(!t.ende) t.lauf={phase:'pause',seit:mitTimer?L.seit:now,uebung:u};
  put('trainings',t); save(); return t.saetze.length-1; }
function renum(t,u){ let n=0; t.saetze.forEach(s=>{ if(s.uebung===u) s.nr=++n; }); }
function beenden(t){ const now=Date.now(); t.ende=now; t.lauf=null; if(!t.saetze.length){ rm('trainings',t.id); save(); return false; } put('trainings',t); save(); return true; }

/* ---------- Dashboard-Kachel (Vorschau-Vertrag v1) ---------- */
function kachel(){ const T=trainings(), run=T.find(t=>!t.ende), last=T.find(t=>t.ende&&t.saetze.length), n=wocheN(), ziel=+D.set.wochenziel||0;
  const nx=kDate(kAdd(weekStart(today()),7)).getTime(), Z=[];
  if(run) Z.push({t:'Läuft: '+run.name,sub:'seit '+fHM(run.start)+' · '+run.saetze.length+' Sätze'});
  T.filter(t=>t.ende&&t.saetze.length).slice(0,run?2:3).forEach((t,i)=>Z.push({t:(i||run?'':'Zuletzt: ')+t.name,sub:fTag(t.datum)+' · '+fDauer(dauer(t))+' · '+t.saetze.length+' Sätze'}));
  const L=run?[{l:'Weiter',hash:'#laeuft',titel:'Zum laufenden Training'}]:vorlagen().slice(0,4).map(v=>({l:v.name,hash:'#start='+v.id,titel:'Training „'+v.name+'“ starten'}));
  return {v:1,savedAt:Date.now(),bis:nx,zahl:{wert:n,einheit:n===1?'Training':'Trainings',label:'diese Woche'+(ziel?' · Ziel '+ziel:'')},
    ...(ziel?{ring:{wert:n,von:ziel,label:'Woche'}}:{}),zeilen:Z,links:L,leer:last?'Diese Woche noch kein Training':'Noch kein Training eingetragen'}; }
function pushSum(){ if(!window.__PI_SYNC) return; try{ fetch('/api/sum_training',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(kachel())}).catch(()=>{}); }catch(e){} }
window.__dashSum=()=>kachel();

/* ---------- Ansichten ---------- */
const ICO={back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  srch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'};
function render(){ const run=laufend();
  if(view==='training'&&(!tId||!D.trainings[tId]||D.trainings[tId].del)){ view=run?'start':'verlauf'; tId=null; }
  const nv=view==='training'?(run&&run.id===tId?'start':'verlauf'):view;
  document.querySelectorAll('.nav button').forEach(b=>{ b.dataset.v===nv?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');
    let d=b.querySelector('.run'); if(b.dataset.v==='start'&&run&&!d){ d=document.createElement('i'); d.className='run'; d.title='Training läuft'; b.appendChild(d); } else if(d&&!(b.dataset.v==='start'&&run)) d.remove(); });
  $('sub').textContent=run?'läuft seit '+fHM(run.start)+' · '+run.name:WDL[new Date().getDay()]+', '+new Date().getDate()+'. '+MON[new Date().getMonth()];
  ({start:vStart,training:vTraining,verlauf:vVerlauf,fortschritt:vFort,uebungen:vUeb}[view]||vStart)($('main'));
  stamp(); tick(); }

/* Start: Vorlagen mit einem Tipp starten – läuft ein Training, steht hier der Trainingsbildschirm */
function vStart(el){ const run=laufend(); if(run){ tId=run.id; return vTraining(el,run); }
  const T=trainings(), ws=weekStart(today()), W=T.filter(t=>t.datum>=ws&&t.saetze.length), last=T.find(t=>t.ende&&t.saetze.length), ziel=+D.set.wochenziel||0;
  const offen=T.filter(t=>!t.ende);
  const zuletzt=vid=>{ const t=T.find(x=>x.vorlage===vid&&x.saetze.length); return t?'zuletzt '+fTag(t.datum):'noch nie'; };
  el.innerHTML=`<div class="head"><div class="tt">Neues Training<small>Vorlage antippen – oder leer starten und Übungen spontan hinzufügen</small></div></div>
    <div class="stack">
    <div class="card"><div class="vgrid" style="margin-top:0">${vorlagen().map(v=>`<button class="vk" data-start="${esc(v.id)}"><b>${esc(v.name)}</b><span>${(v.uebungen||[]).filter(id=>UE(id)).map(id=>esc(uName(id))).join(' · ')||'noch ohne Übungen'}</span><em>Starten › <span style="color:var(--muted);font-weight:500">${zuletzt(v.id)}</span></em></button>`).join('')}
      <button class="vk leer" data-start=""><b>Leeres Training</b><span>Übungen spontan hinzufügen</span><em>Starten ›</em></button></div></div>
    <div class="card"><h2>Diese Woche<span class="cap">ab ${fTag(ws)}</span></h2><div class="kpis" style="margin-top:12px">
      <div class="kpi"><b>${W.length}${ziel?` <small style="font-size:13px;color:var(--muted)">/ ${ziel}</small>`:''}</b><span>Trainings</span></div>
      <div class="kpi"><b>${W.reduce((a,t)=>a+t.saetze.length,0)}</b><span>Sätze</span></div>
      <div class="kpi"><b>${fDauer(W.reduce((a,t)=>a+dauer(t),0))}</b><span>Zeit</span></div></div></div>
    ${last?`<div class="card"><h2>Zuletzt<span class="cap">${fTag(last.datum)} · ${fDauer(dauer(last))}</span></h2><div class="lst" style="margin-top:10px">${trRow(last)}</div></div>`:''}
    </div>`; }
function trRow(t){ const U=t.reihe.filter(u=>satzVon(t,u).length), v=vol(t.saetze);
  return `<button class="li${t.ende?'':' run'}" data-open="${esc(t.id)}"><span class="n">${esc(t.name)}</span><span class="k">${fTag(t.datum)} · ${fHM(t.start)}</span>
    <span class="s">${t.saetze.length} ${t.saetze.length===1?'Satz':'Sätze'} · ${U.length} ${U.length===1?'Übung':'Übungen'}${v?' · '+fmt(v)+' kg bewegt':''}${t.ende?' · '+fDauer(dauer(t)):''}${t.notiz?' · „'+esc(t.notiz.slice(0,60))+(t.notiz.length>60?'…':'')+'“':''}</span></button>`; }

/* Trainingsbildschirm: Timer oben, darunter die Übungen mit „letztes Mal“ und den Sätzen */
function vTraining(el,t){ t=t||trN(D.trainings[tId]); if(!t) return vStart(el); tId=t.id;
  const run=!t.ende, L=t.lauf||{}, pr=prOf(t), cur=L.uebung&&t.reihe.includes(L.uebung)?L.uebung:t.reihe[0];
  const head=`<div class="head">${run?'':`<button class="ibtn" data-v="verlauf" aria-label="Zurück zum Verlauf">${ICO.back}</button>`}
    <div class="tt"><button class="tname" data-tedit="1" style="border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left">${esc(t.name)}</button>
      <small>${fTag(t.datum)} · ${fHM(t.start)}${run?` · läuft <span data-dauer="${t.start}">${fDauer(dauer(t))}</span>`:` – ${fHM(t.ende)} · ${fDauer(dauer(t))}`}</small></div>
    ${run?'<button class="btn pri" data-tend="1">Beenden</button>':''}</div>`;
  const cards=t.reihe.map(u=>{ const S=satzVon(t,u), p=vorher(u,t.start,t.id), no=t.uebNotiz[u]||'', isCur=run&&u===cur;
    const rows=t.saetze.map((s,i)=>s.uebung!==u?'':`<button class="sr2" data-sedit="${i}"><span class="n">${s.nr}</span><span class="w">${satzTxt(s)}${pr[i]?`<span class="pr" title="${pr[i]==='kg'?'Bestes Gewicht':'Bestes geschätztes 1RM'}">${pr[i]==='kg'?'Bestwert':'1RM ↑'}</span>`:''}${s.notiz?` <small>· ${esc(s.notiz)}</small>`:''}</span><span class="t">${s.satzSek!=null?fClock(s.satzSek):''}${s.pauseSek!=null?(s.satzSek!=null?' · ':'')+'P '+fClock(s.pauseSek):''}</span></button>`).join('');
    return `<div class="card uk${isCur?' cur':''}" id="u-${esc(u)}"><div class="uh"><button class="us" data-cur="${esc(u)}"${run?'':' tabindex="-1"'}><b>${esc(uName(u,t))}</b>
        <span class="lm">${p?`Letztes Mal <i>(${fTag(p.t.datum)})</i>: ${satzListe(p.S)}`:'Zum ersten Mal'}</span></button>
      <button class="x" data-unote="${esc(u)}" aria-label="Notiz zu ${esc(uName(u,t))}" title="Notiz zur Übung">${ICO.note}</button>
      ${S.length?'':`<button class="x" data-urm="${esc(u)}" aria-label="${esc(uName(u,t))} aus dem Training nehmen" title="Aus dem Training nehmen">×</button>`}</div>
      ${noteOpen[u]||no?`<div class="unote"><input class="in" data-unotein="${esc(u)}" value="${esc(no)}" placeholder="z. B. Schulter zwickt" aria-label="Notiz zu ${esc(uName(u,t))}"></div>`:''}
      ${rows?`<div class="sl">${rows}</div>`:''}
      <div class="uadd">${run&&u!==cur&&!(L.phase==='satz'||L.phase==='eingabe')?`<button class="btn sm" data-cur="${esc(u)}">Als Nächstes</button>`:''}<button class="btn sm" data-sadd="${esc(u)}">+ Satz eintragen</button></div></div>`; }).join('');
  el.innerHTML=head+(run?timer(t,cur):'')+(cards||'<div class="card empty" style="margin-bottom:12px">Noch keine Übung. Füge unten die erste hinzu.</div>')
    +`<div class="tfoot"><button class="btn" data-uadd="1" style="align-self:flex-start">+ Übung hinzufügen</button>
      <div class="card stack"><label class="lbl">Wie war's? (Notiz zum Training)<textarea class="in" data-tnotiz="1" placeholder="z. B. müde, schlecht geschlafen – oder: lief richtig gut">${esc(t.notiz)}</textarea></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${t.reihe.length?'<button class="btn" data-tvorl="1">Als Vorlage speichern</button>':''}<span style="flex:1"></span><button class="btn dng" data-tdel="1">Training löschen</button></div></div></div>`; }
function timer(t,u){ const L=t.lauf||{}, ph=L.phase;
  if(!u) return `<div class="tim"><div class="tl"><span class="ph">Bereit</span><span class="un">Füge eine Übung hinzu, dann geht es los.</span></div><div class="acts"><button class="btn pri go" data-uadd="1">+ Übung hinzufügen</button></div></div>`;
  const n=satzVon(t,u).length+1, nm=esc(uName(u,t));
  if(ph==='satz') return `<div class="tim" aria-live="polite"><div class="tl"><div style="min-width:0"><div class="ph">Satz ${satzVon(t,u).length+1} läuft</div><div class="un">${nm}</div></div><span class="clk" data-tick="${L.seit}">${fClock((Date.now()-L.seit)/1000)}</span></div>
      <div class="acts"><button class="btn pri go" data-fertig="1">Fertig</button><button class="btn" data-abbr="1">Abbrechen</button></div></div>`;
  if(ph==='eingabe'){ const v=vorschlag(t,u), p=vorher(u,t.start,t.id), ps=p&&p.S[n-1];
    return `<div class="tim pause" aria-live="polite"><div class="tl"><div style="min-width:0"><div class="ph">Satz ${n} · fertig nach ${fClock(L.satzSek||0)}</div><div class="un">${nm}${ps?` <span class="cap">· letztes Mal ${satzTxt(ps)}</span>`:''}</div></div>
        <div style="text-align:right;margin-left:auto"><div class="cap">Pause</div><span class="clk sm" data-tick="${L.seit}">${fClock((Date.now()-L.seit)/1000)}</span></div></div>
      <div class="ent">${stepper('eKg','kg',v.kg,'Gewicht (kg)')}${stepper('eWdh','wdh',v.wdh,'Wiederholungen')}</div>
      <input class="in" id="eNotiz" placeholder="Notiz zum Satz (optional)" aria-label="Notiz zum Satz">
      <div class="acts"><button class="btn pri go" data-ssave="1">Speichern</button><button class="btn" data-sverw="1">Verwerfen</button></div></div>`; }
  if(ph==='pause') return `<div class="tim pause" aria-live="polite"><div class="tl"><div style="min-width:0"><div class="ph">Pause</div><div class="un">Als Nächstes: Satz ${n} · ${nm}</div></div><span class="clk" data-tick="${L.seit}">${fClock((Date.now()-L.seit)/1000)}</span></div>
      <div class="acts"><button class="btn pri go" data-go="${esc(u)}">Satz ${n} starten</button></div></div>`;
  return `<div class="tim"><div class="tl"><div style="min-width:0"><div class="ph">Bereit</div><div class="un">Als Erstes: ${nm}</div></div></div>
      <div class="acts"><button class="btn pri go" data-go="${esc(u)}">Satz ${n} starten</button></div></div>`; }
function stepper(id,k,v,label){ return `<div><div class="stepl">${label}</div><div class="step"><button type="button" data-step="${id}|-" aria-label="${label} weniger">−</button>
  <input class="in" id="${id}" inputmode="${k==='kg'?'decimal':'numeric'}" value="${v==null?'':String(v).replace('.',',')}" placeholder="${k==='kg'?'0':'–'}" aria-label="${label}"><button type="button" data-step="${id}|+" aria-label="${label} mehr">+</button></div></div>`; }

/* Verlauf: Trainings nach Wochen */
function vVerlauf(el){ const T=trainings(); if(!T.length){ el.innerHTML='<div class="card empty">Noch keine Trainings. Unter „Training“ eine Vorlage starten.</div>'; return; }
  const by={}, ord=[]; T.forEach(t=>{ const w=weekStart(t.datum); if(!by[w]){ by[w]=[]; ord.push(w); } by[w].push(t); });
  el.innerHTML=`<div class="head"><div class="tt">Verlauf<small>${T.length} ${T.length===1?'Training':'Trainings'} · antippen zum Ansehen und Bearbeiten</small></div></div>`
    +ord.map(w=>{ const L=by[w], ms=L.reduce((a,t)=>a+dauer(t),0); return `<div class="wh"><span>${w===weekStart(today())?'Diese Woche':'Woche ab '+fTag(w)}</span><span>${L.length} · ${fDauer(ms)}</span></div><div class="lst">${L.map(trRow).join('')}</div>`; }).join(''); }

/* Fortschritt je Übung: bestes Gewicht, geschätztes 1RM, Volumen */
function vFort(el){ if(progU) return vFortU(el,progU);
  const rows=uebungen().map(u=>({u,V:verlaufU(u.id)})).filter(x=>x.V.length).sort((a,b)=>b.V[b.V.length-1].t.start-a.V[a.V.length-1].t.start);
  const nie=uebungen().filter(u=>!rows.some(r=>r.u.id===u.id));
  el.innerHTML=`<div class="head"><div class="tt">Fortschritt<small>je Übung · 1RM = geschätztes Maximalgewicht für eine Wiederholung (Epley)</small></div></div>`
    +(rows.length?`<div class="lst">${rows.map(({u,V})=>{ const l=V[V.length-1], bk=Math.max(...V.map(x=>x.top)), be=Math.max(...V.map(x=>x.e1));
      return `<button class="li" data-prog="${esc(u.id)}"><span class="n">${esc(u.name)}</span><span class="k">${bk?fkg(bk)+' kg':l.wdh+' Wdh.'}</span><span class="s">zuletzt ${fTag(l.t.datum)}: ${satzListe(l.S)}${be?' · 1RM ≈ '+fmt(be)+' kg':''} · ${V.length} ${V.length===1?'Training':'Trainings'}</span></button>`; }).join('')}</div>`
      :'<div class="card empty">Noch keine Sätze eingetragen.</div>')
    +(nie.length?`<p class="cap" style="margin-top:12px">Noch nie trainiert: ${nie.map(u=>esc(u.name)).join(', ')}</p>`:''); }
function vFortU(el,id){ const V=verlaufU(id), nm=uName(id); if(!V.length){ progU=null; return vFort(el); }
  const bk=Math.max(...V.map(x=>x.top)), be=Math.max(...V.map(x=>x.e1)), n=V.reduce((a,x)=>a+x.S.length,0), bv=Math.max(...V.map(x=>x.vol));
  let svg='';
  const P=V.filter(x=>x.e1>0);
  if(P.length>=2){ const W=Math.round(Math.max(300,Math.min(640,(el.clientWidth||640)-34))),H=W<480?200:220,pl=44,pr=12,pt=14,pb=28, t0=P[0].t.start, t1=P[P.length-1].t.start, sp=Math.max(1,t1-t0);
    const vals=P.flatMap(x=>[x.e1,x.top]), lo=Math.floor(Math.min(...vals)*0.95/5)*5, hi=Math.ceil(Math.max(...vals)*1.03/5)*5||5, X=x=>pl+(x-t0)/sp*(W-pl-pr), Y=v=>pt+(1-(v-lo)/((hi-lo)||1))*(H-pt-pb);
    svg=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="var(--mono)">${fmt(v)}</text>`).join('')
      +P.map(x=>`<circle cx="${X(x.t.start).toFixed(1)}" cy="${Y(x.top).toFixed(1)}" r="3.5" fill="var(--muted)" opacity=".6"><title>${fTag(x.t.datum)}: schwerster Satz ${fkg(x.top)} kg</title></circle>`).join('')
      +`<path d="${P.map((x,i)=>(i?'L':'M')+X(x.t.start).toFixed(1)+' '+Y(x.e1).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`
      +P.map(x=>`<circle cx="${X(x.t.start).toFixed(1)}" cy="${Y(x.e1).toFixed(1)}" r="3" fill="var(--accent)"><title>${fTag(x.t.datum)}: 1RM ≈ ${fmt(x.e1,1)} kg</title></circle>`).join('')
      +`<text x="${pl}" y="${H-8}" font-size="11" fill="var(--faint)" font-family="var(--mono)">${fTag(P[0].t.datum)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="var(--mono)">${fTag(P[P.length-1].t.datum)}</text>`;
    svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf ${esc(nm)}">${svg}</svg><p class="cap" style="margin-top:6px">Linie: geschätztes 1RM · Punkte: schwerster Satz</p>`; }
  el.innerHTML=`<div class="head"><button class="ibtn" data-prog="" aria-label="Zurück zur Übersicht">${ICO.back}</button><div class="tt">${esc(nm)}<small>${V.length} ${V.length===1?'Training':'Trainings'} · ${n} Sätze</small></div></div>
    <div class="stack"><div class="pk"><div class="kpi"><b>${bk?fkg(bk)+' kg':'–'}</b><span>bestes Gewicht</span></div><div class="kpi"><b>${be?'≈ '+fmt(be)+' kg':'–'}</b><span>bestes 1RM (geschätzt)</span></div>
      <div class="kpi"><b>${bv?fmt(bv)+' kg':'–'}</b><span>meistes Volumen</span></div><div class="kpi"><b>${Math.max(...V.map(x=>Math.max(...x.S.map(s=>+s.wdh||0))))}</b><span>meiste Wdh. in einem Satz</span></div></div>
    ${svg?`<div class="card">${svg}</div>`:''}
    <div class="card"><h2>Alle Trainings</h2><div class="hist" style="margin-top:8px">${V.slice().reverse().map(x=>`<div class="hr2"><span class="d">${fTag(x.t.datum)}</span><span class="s">${satzListe(x.S)}${x.t.uebNotiz[id]?` <span class="cap">· ${esc(x.t.uebNotiz[id])}</span>`:''}</span><span class="e">${x.e1?'1RM '+fmt(x.e1):''}${x.vol?'<br>'+fmt(x.vol)+' kg':''}</span></div>`).join('')}</div></div></div>`; }

/* Übungen und Vorlagen verwalten */
function vUeb(el){ const V=vorlagen(), U=uebungen();
  const byG={}; U.forEach(u=>{ const g=GRUPPEN.includes(u.gruppe)?u.gruppe:'Sonstiges'; (byG[g]=byG[g]||[]).push(u); });
  el.innerHTML=`<div class="stack">
    <div class="card"><h2>Vorlagen<button class="btn sm" data-vedit="">+ Vorlage</button></h2>
      ${V.length?`<div class="lst" style="margin-top:10px">${V.map(v=>`<div class="orow"><span class="n">${esc(v.name)}<br><span class="cap" style="font-weight:400">${(v.uebungen||[]).filter(id=>UE(id)).length} Übungen: ${(v.uebungen||[]).filter(id=>UE(id)).map(id=>esc(uName(id))).join(', ')||'–'}</span></span>
        <button class="btn sm" data-vedit="${esc(v.id)}">Bearbeiten</button><button class="btn sm pri" data-start="${esc(v.id)}">Starten</button></div>`).join('')}</div>`:'<div class="empty">Noch keine Vorlage.</div>'}</div>
    <div class="card"><h2>Übungen<button class="btn sm" data-uedit="">+ Übung</button></h2>
      ${GRUPPEN.filter(g=>byG[g]).map(g=>`<div class="grp">${g}</div><div class="lst">${byG[g].map(u=>{ const V2=verlaufU(u.id); return `<button class="li" data-uedit="${esc(u.id)}"><span class="n">${esc(u.name)}</span><span class="k">${V2.length?V2.length+'×':''}</span></button>`; }).join('')}</div>`).join('')||'<div class="empty">Noch keine Übungen.</div>'}</div>
    <div class="card stack"><h2>Einstellungen</h2>
      <label class="lbl">Ziel: Trainings pro Woche (für die Dashboard-Kachel)<span style="display:flex;gap:8px;align-items:center">${[0,1,2,3,4,5,6].map(n=>`<button class="chip${+D.set.wochenziel===n?' on':''}" data-ziel="${n}">${n||'keins'}</button>`).join('')}</span></label>
      <label class="lbl">Schritt der ±-Knöpfe beim Gewicht<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${[1,1.25,2.5,5].map(n=>`<button class="chip${+D.set.schritt===n?' on':''}" data-schritt="${n}">${fmt(n,2)} kg</button>`).join('')}</span></label></div>
  </div>`; }

/* ---------- Blätter (Dialoge) ---------- */
function uaddRes(s){ const t=D.trainings[s.t], q=norm(s.q||'').trim(), have=new Set(t?t.reihe:[]);
  const L=uebungen().filter(u=>!have.has(u.id)&&(!q||norm(u.name).includes(q))), exact=uebungen().some(u=>norm(u.name)===q);
  return (q&&!exact?`<div class="form"><label class="lbl">Muskelgruppe<select class="in" id="ugr">${GRUPPEN.map(g=>`<option${g==='Sonstiges'?' selected':''}>${g}</option>`).join('')}</select></label><span style="align-self:end;min-width:0"><button class="btn pri" data-unew="1" style="width:100%;white-space:normal">„${esc(s.q.trim())}“ anlegen</button></span></div>`:'')
    +`<div class="lst" id="ulist">${L.map(u=>`<button class="li" data-upick="${esc(u.id)}"><span class="n">${esc(u.name)}</span><span class="k">${esc(u.gruppe||'')}</span></button>`).join('')||'<div class="empty" style="padding:12px">Keine passende Übung.</div>'}</div>`; }
function openSheet(s){ sheet=s; drawSheet(); $('ov').classList.add('show'); }
function closeSheet(){ sheet=null; $('ov').classList.remove('show'); }
function drawSheet(){ const s=sheet, d=$('dlg'); if(!s) return; const X='<button class="x" data-close="1" aria-label="Schließen">×</button>';
  if(s.m==='uadd'){
    d.innerHTML=`<div class="dh"><h3 id="dlgT">Übung hinzufügen</h3>${X}</div><div class="db">
      <div class="srch">${ICO.srch}<input class="in" id="uq" type="search" placeholder="Suchen oder neue Übung eintippen" value="${esc(s.q||'')}" autocomplete="off" aria-label="Übung suchen"></div>
      <div id="ures" class="stack" style="gap:12px">${uaddRes(s)}</div></div>`;
    return; }
  if(s.m==='satz'){ const t=D.trainings[s.t], ed=s.i!=null, x=ed?t.saetze[s.i]:null, u=ed?x.uebung:s.u, v=ed?{kg:x.kg,wdh:x.wdh}:vorschlag(t,u);
    d.innerHTML=`<div class="dh"><h3 id="dlgT">${esc(uName(u,t))} · Satz ${ed?x.nr:satzVon(t,u).length+1}</h3>${X}</div><div class="db">
      <div class="form">${stepper('sKg','kg',v.kg,'Gewicht (kg)')}${stepper('sWdh','wdh',v.wdh,'Wiederholungen')}</div>
      <label class="lbl">Notiz (optional)<input class="in" id="sNotiz" value="${esc(ed&&x.notiz||'')}" placeholder="z. B. sauber, letzte Wdh. mit Hilfe"></label>
      ${ed&&(x.satzSek!=null||x.pauseSek!=null)?`<p class="cap">${x.satzSek!=null?'Satzzeit '+fClock(x.satzSek):''}${x.pauseSek!=null?(x.satzSek!=null?' · ':'')+'Pause danach '+fClock(x.pauseSek):''}</p>`:''}
      ${ed?'':'<p class="cap">Ohne Timer: Satz- und Pausenzeit bleiben leer.</p>'}</div>
      <div class="df">${ed?'<button class="btn dng" data-sdel="1">Löschen</button>':''}<span style="flex:1"></span><button class="btn pri" data-sok="1">Speichern</button></div>`; return; }
  if(s.m==='uedit'){ const u=s.id?D.uebungen[s.id]:null;
    d.innerHTML=`<div class="dh"><h3 id="dlgT">${u?'Übung bearbeiten':'Neue Übung'}</h3>${X}</div><div class="db"><div class="form">
      <label class="lbl w2">Name<input class="in" id="un" value="${esc(u?u.name:'')}" placeholder="z. B. Bankdrücken"></label>
      <label class="lbl w2">Muskelgruppe<select class="in" id="ug">${GRUPPEN.map(g=>`<option${(u?u.gruppe:'Sonstiges')===g?' selected':''}>${g}</option>`).join('')}</select></label></div>
      ${u?`<p class="cap">${verlaufU(u.id).length} Trainings mit dieser Übung. Löschen entfernt sie aus der Auswahl und aus Vorlagen; der Verlauf bleibt.</p>`:''}</div>
      <div class="df">${u?'<button class="btn dng" data-udel="1">Löschen</button>':''}<span style="flex:1"></span><button class="btn pri" data-usave="1">Speichern</button></div>`; return; }
  if(s.m==='vedit'){ const v=s.v;
    d.innerHTML=`<div class="dh"><h3 id="dlgT">${v.id&&D.vorlagen[v.id]?'Vorlage bearbeiten':'Neue Vorlage'}</h3>${X}</div><div class="db">
      <label class="lbl">Name<input class="in" id="vn" value="${esc(v.name)}" placeholder="z. B. Push"></label>
      <div class="lst">${v.uebungen.map((id,i)=>`<div class="orow"><span class="n">${esc(uName(id))}</span><button class="x" data-vmv="${i}|-1" ${i?'':'disabled'} aria-label="Nach oben">${ICO.up}</button><button class="x" data-vmv="${i}|1" ${i<v.uebungen.length-1?'':'disabled'} aria-label="Nach unten">${ICO.down}</button><button class="x" data-vrm="${i}" aria-label="${esc(uName(id))} entfernen">×</button></div>`).join('')||'<div class="empty" style="padding:12px">Noch keine Übungen.</div>'}</div>
      <div style="display:flex;gap:8px"><select class="in" id="vadd" aria-label="Übung wählen"><option value="">Übung hinzufügen …</option>${uebungen().filter(u=>!v.uebungen.includes(u.id)).map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select></div></div>
      <div class="df">${v.id&&D.vorlagen[v.id]?'<button class="btn dng" data-vdel="1">Löschen</button>':''}<span style="flex:1"></span><button class="btn pri" data-vsave="1">Speichern</button></div>`; return; }
  if(s.m==='tedit'){ const t=D.trainings[s.t];
    d.innerHTML=`<div class="dh"><h3 id="dlgT">Training</h3>${X}</div><div class="db"><div class="form">
      <label class="lbl w2">Name<input class="in" id="tn" value="${esc(t.name)}"></label>
      <label class="lbl">Datum<input class="in" type="date" id="td" value="${t.datum}"></label><label class="lbl">Beginn<input class="in" type="time" id="ts" value="${fHM(t.start)}"></label>
      ${t.ende?`<label class="lbl">Ende<input class="in" type="time" id="te" value="${fHM(t.ende)}"></label>`:''}</div></div>
      <div class="df"><span style="flex:1"></span><button class="btn pri" data-tsave="1">Speichern</button></div>`; return; }
  if(s.m==='data'){ d.innerHTML=`<div class="dh"><h3 id="dlgT">Daten &amp; Backup</h3>${X}</div><div class="db">
      <p class="cap">Alles liegt im Browser${window.__PI_SYNC?' und auf dem Raspberry Pi (pro Eintrag abgeglichen)':''}. Eine JSON-Sicherung kannst du jederzeit wieder einlesen – Einträge werden zusammengeführt.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-exp="1">JSON-Backup speichern</button><button class="btn" data-imp="1">Backup einlesen</button></div>
      <div class="note">${trainings().length} Trainings · ${trainings().reduce((a,t)=>a+t.saetze.length,0)} Sätze · ${uebungen().length} Übungen · ${vorlagen().length} Vorlagen<br>Zuletzt gespeichert: ${D.savedAt?new Date(D.savedAt).toLocaleString('de-DE'):'noch nie'}</div>
      <p class="cap">Offline: Ist das Netz weg (z. B. im Gym ohne VPN), läuft alles weiter und wird später abgeglichen. Die Seite muss dafür einmal geladen sein. Timer zählen weiter, auch wenn das Handy gesperrt ist – einen Ton gibt es nicht.</p></div>`; return; }
}

/* ---------- Kleinkram ---------- */
function stamp(){ $('saved').textContent=D.savedAt?'Gespeichert '+fHM(D.savedAt):'Noch nichts gespeichert'; }
let toastT=null;
function toast(m,ms,gold){ const t=$('toast'); t.textContent=m; t.classList.toggle('gold',!!gold); t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms||2600); }
/* Uhren: nur Text austauschen, nicht neu zeichnen (Eingaben und Fokus bleiben) */
function tick(){ const now=Date.now();
  document.querySelectorAll('[data-tick]').forEach(e=>{ const v=fClock((now-+e.dataset.tick)/1000); if(e.textContent!==v) e.textContent=v; });
  document.querySelectorAll('[data-dauer]').forEach(e=>{ const v=fDauer(now-+e.dataset.dauer); if(e.textContent!==v) e.textContent=v; }); }
setInterval(tick,500);
const curT=()=>tId&&D.trainings[tId]&&!D.trainings[tId].del?trN(D.trainings[tId]):null;
/* Zweimal tippen statt Bestätigungsdialog */
function armed(b,txt){ if(b.dataset.arm) return true; b.dataset.arm='1'; const o=b.textContent; b.textContent=txt||'Wirklich?'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arm; b.textContent=o; } },3000); return false; }
function show(v){ view=v; if(v!=='fortschritt') progU=null; render(); scrollTo(0,0); }
function oeffne(id){ tId=id; view='training'; render(); scrollTo(0,0); }
function starte(vid){ const run=laufend(); if(run){ toast('Es läuft schon ein Training – erst beenden'); return oeffne(run.id); }
  const t=neuesTraining(vid||null); oeffne(t.id); }
function prToast(t,i){ const p=prOf(t)[i]; if(!p) return; const s=t.saetze[i];
  toast((p==='kg'?'Neues Bestgewicht: ':'Neues bestes 1RM: ')+uName(s.uebung,t)+' '+(p==='kg'?fkg(s.kg)+' kg':'≈ '+fmt(e1(s),1)+' kg'),3500,true); }
const wert=id=>{ const e=$(id); return e?num(e.value):null; };
function holeSatz(pre){ const kg=wert(pre+'Kg'), wdh=wert(pre+'Wdh'), n=$(pre+'Notiz');
  if(wdh==null||wdh<=0){ toast('Bitte Wiederholungen eintragen'); const e=$(pre+'Wdh'); if(e) e.focus(); return null; }
  if(kg!=null&&kg<0){ toast('Gewicht kann nicht negativ sein'); return null; }
  return {kg,wdh,notiz:n?n.value.trim():''}; }
function zeigeUebung(u){ requestAnimationFrame(()=>{ const e=document.getElementById('u-'+u); if(e) e.scrollIntoView({block:'nearest',behavior:'smooth'}); }); }
function nimmUebung(t,u){ if(!t.reihe.includes(u)) t.reihe.push(u); t.namen[u]=uName(u);
  if(!t.ende&&t.lauf&&(!t.lauf.uebung||!t.reihe.includes(t.lauf.uebung))) t.lauf.uebung=u;
  put('trainings',t); save(); closeSheet(); render(); zeigeUebung(u); }
function uSpeichern(name,gruppe,id){ name=name.trim(); if(!name){ toast('Bitte einen Namen eingeben'); return null; }
  const dup=uebungen().find(u=>norm(u.name)===norm(name)&&u.id!==id); if(dup){ toast('„'+dup.name+'“ gibt es schon'); return null; }
  const o=id&&D.uebungen[id]?D.uebungen[id]:{id:uid('u')}; return put('uebungen',{...o,name,gruppe:GRUPPEN.includes(gruppe)?gruppe:'Sonstiges',del:undefined}); }

/* ---------- Klicks ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-v]'); if(!b) { if(e.target===$('ov')) closeSheet(); return; }
  const ds=b.dataset, t=curT();
  if(b.closest('.nav')&&ds.v){ show(ds.v); return; }
  if('v' in ds&&!b.closest('.nav')){ show(ds.v); return; }
  if('start' in ds){ closeSheet(); starte(ds.start); return; }
  if(ds.open){ oeffne(ds.open); return; }
  if('prog' in ds){ progU=ds.prog||null; view='fortschritt'; render(); scrollTo(0,0); return; }
  if(ds.close){ closeSheet(); return; }
  if(ds.ziel!=null){ setS(s=>s.wochenziel=+ds.ziel); render(); return; }
  if(ds.schritt!=null){ setS(s=>s.schritt=+ds.schritt); render(); return; }
  if(ds.step){ const [id,dir]=ds.step.split('|'), inp=$(id); if(!inp) return; const kg=/Kg$/.test(id), st=kg?(+D.set.schritt||2.5):1;
    let v=num(inp.value); if(v==null) v=0; v=dir==='+'?v+st:v-st; v=Math.max(0,kg?Math.round(v/st)*st:Math.round(v)); v=rk(v);
    inp.value=String(v).replace('.',','); return; }
  if(b.id==='dataBtn'){ openSheet({m:'data'}); return; }
  if(ds.exp){ exportJSON(); return; }
  if(ds.imp){ $('impFile').click(); return; }
  /* Timer */
  if(t&&ds.go){ satzStart(t,ds.go); render(); return; }
  if(t&&ds.fertig){ satzFertig(t); render(); const k=$('eWdh'); if(k&&!matchMedia('(pointer:coarse)').matches) k.focus(); return; }
  if(t&&ds.abbr){ satzAbbrechen(t); render(); return; }
  if(t&&ds.ssave){ const L=t.lauf; if(!L||L.phase!=='eingabe') return; const x=holeSatz('e'); if(!x) return;
    const i=satzSpeichern(t,L.uebung,x.kg,x.wdh,x.notiz); render(); prToast(t,i); return; }
  if(t&&ds.sverw){ const L=t.lauf; if(!L) return; t.lauf={phase:letzterSatz(t)?'pause':null,seit:L.seit,uebung:L.uebung}; put('trainings',t); save(); render(); return; }
  if(t&&ds.cur){ if(t.ende||!t.lauf||t.lauf.phase==='satz'||t.lauf.phase==='eingabe') return; t.lauf.uebung=ds.cur; put('trainings',t); save(); render(); return; }
  if(t&&ds.tend){ const L=t.lauf||{}; if(L.phase==='satz'||L.phase==='eingabe'){ if(!armed(b,L.phase==='satz'?'Satz läuft – trotzdem?':'Satz nicht gespeichert – trotzdem?')) return; }
    const n=t.saetze.length, ok=beenden(t); if(!ok){ tId=null; show('start'); toast('Leeres Training verworfen'); return; }
    render(); scrollTo(0,0); toast('Training beendet · '+n+' '+(n===1?'Satz':'Sätze')+' · '+fDauer(dauer(t))); return; }
  if(t&&ds.tdel){ if(!armed(b,'Wirklich löschen?')) return; rm('trainings',t.id); save(); tId=null; show('verlauf'); toast('Training gelöscht'); return; }
  if(t&&ds.unote){ const u=ds.unote; noteOpen[u]=!noteOpen[u]||!!t.uebNotiz[u]; render(); const i=document.querySelector(`[data-unotein="${CSS.escape(u)}"]`); if(i) i.focus(); return; }
  if(t&&ds.urm){ const u=ds.urm; if(satzVon(t,u).length) return; t.reihe=t.reihe.filter(x=>x!==u); delete t.uebNotiz[u];
    if(t.lauf&&t.lauf.uebung===u) t.lauf.uebung=t.reihe[0]||null; put('trainings',t); save(); render(); return; }
  if(t&&ds.uadd){ openSheet({m:'uadd',t:t.id,q:''}); const q=$('uq'); if(q&&!matchMedia('(pointer:coarse)').matches) q.focus(); return; }
  if(t&&ds.upick){ nimmUebung(t,ds.upick); return; }
  if(t&&ds.unew){ const u=uSpeichern(sheet.q||'',($('ugr')||{}).value); if(!u) return; save(); nimmUebung(t,u.id); toast('„'+u.name+'“ angelegt'); return; }
  if(t&&ds.sadd){ openSheet({m:'satz',t:t.id,u:ds.sadd}); return; }
  if(t&&ds.sedit!=null){ openSheet({m:'satz',t:t.id,i:+ds.sedit}); return; }
  if(t&&ds.sok&&sheet&&sheet.m==='satz'){ const x=holeSatz('s'); if(!x) return;
    if(sheet.i!=null){ const s=t.saetze[sheet.i]; if(!s) return closeSheet(); s.kg=x.kg==null?0:rk(x.kg); s.wdh=Math.round(x.wdh); if(x.notiz) s.notiz=x.notiz; else delete s.notiz;
      put('trainings',t); save(); closeSheet(); render(); return; }
    const L=t.lauf, keep=L&&(L.phase==='satz'||L.phase==='eingabe')?{...L}:null;
    const i=satzSpeichern(t,sheet.u,x.kg,x.wdh,x.notiz); if(keep){ t.lauf=keep; put('trainings',t); save(); }
    closeSheet(); render(); prToast(t,i); return; }
  if(t&&ds.sdel&&sheet&&sheet.m==='satz'&&sheet.i!=null){ if(!armed(b,'Wirklich löschen?')) return; const s=t.saetze[sheet.i]; if(!s) return closeSheet();
    t.saetze.splice(sheet.i,1); renum(t,s.uebung); put('trainings',t); save(); closeSheet(); render(); toast('Satz gelöscht'); return; }
  if(t&&ds.tedit){ openSheet({m:'tedit',t:t.id}); return; }
  if(t&&ds.tsave){ const n=$('tn').value.trim()||'Training', d=$('td').value||t.datum, st=$('ts').value, en=$('te')?$('te').value:null;
    const at=(k,hm)=>new Date(k+'T'+(hm||'00:00')).getTime(); let s=st?at(d,st):t.start, x=t.ende;
    if(t.ende&&en){ x=at(d,en); if(x<s) x+=864e5; }
    if(!t.ende&&s>Date.now()){ toast('Ein laufendes Training kann nicht in der Zukunft beginnen'); return; }
    Object.assign(t,{name:n,datum:d,start:s,ende:x}); put('trainings',t); save(); closeSheet(); render(); return; }
  if(t&&ds.tvorl){ const v0=t.vorlage&&D.vorlagen[t.vorlage]&&!D.vorlagen[t.vorlage].del?D.vorlagen[t.vorlage]:null;
    openSheet({m:'vedit',v:{id:v0?v0.id:'',name:v0?v0.name:t.name,uebungen:t.reihe.filter(id=>UE(id))}}); return; }
  /* Vorlagen */
  if('vedit' in ds){ const v=ds.vedit&&D.vorlagen[ds.vedit]; openSheet({m:'vedit',v:v?{id:v.id,name:v.name,uebungen:(v.uebungen||[]).filter(id=>UE(id))}:{id:'',name:'',uebungen:[]}}); return; }
  if(sheet&&sheet.m==='vedit'){ const v=sheet.v; v.name=$('vn')?$('vn').value:v.name;
    if(ds.vmv){ const [i,d]=ds.vmv.split('|').map(Number), j=i+d; if(j<0||j>=v.uebungen.length) return; [v.uebungen[i],v.uebungen[j]]=[v.uebungen[j],v.uebungen[i]]; drawSheet(); return; }
    if(ds.vrm!=null){ v.uebungen.splice(+ds.vrm,1); drawSheet(); return; }
    if(ds.vsave){ const name=v.name.trim(); if(!name){ toast('Bitte einen Namen eingeben'); $('vn').focus(); return; }
      const o=v.id&&D.vorlagen[v.id]&&!D.vorlagen[v.id].del?D.vorlagen[v.id]:{id:uid('v'),ord:vorlagen().reduce((a,x)=>Math.max(a,x.ord??0),-1)+1};
      put('vorlagen',{...o,name,uebungen:v.uebungen.slice()}); save(); closeSheet(); render(); toast('Vorlage „'+name+'“ gespeichert'); return; }
    if(ds.vdel){ if(!armed(b,'Wirklich löschen?')) return; rm('vorlagen',v.id); save(); closeSheet(); render(); toast('Vorlage gelöscht'); return; } }
  /* Übungen */
  if('uedit' in ds){ openSheet({m:'uedit',id:ds.uedit||null}); if(!ds.uedit&&!matchMedia('(pointer:coarse)').matches) $('un').focus(); return; }
  if(sheet&&sheet.m==='uedit'){
    if(ds.usave){ const u=uSpeichern($('un').value,$('ug').value,sheet.id); if(!u) return; save(); closeSheet(); render(); return; }
    if(ds.udel){ if(!armed(b,'Wirklich löschen?')) return; const id=sheet.id; rm('uebungen',id);
      live('vorlagen').forEach(v=>{ if((v.uebungen||[]).includes(id)) put('vorlagen',{...v,uebungen:v.uebungen.filter(x=>x!==id)}); });
      save(); closeSheet(); render(); toast('Übung gelöscht – der Verlauf bleibt'); return; } }
});
/* Eingaben */
document.addEventListener('input',e=>{ const el=e.target;
  if(el.id==='uq'&&sheet&&sheet.m==='uadd'){ sheet.q=el.value; $('ures').innerHTML=uaddRes(sheet); return; } });
document.addEventListener('change',e=>{ const el=e.target, t=curT();
  if(el.id==='vadd'&&sheet&&sheet.m==='vedit'&&el.value){ sheet.v.name=$('vn').value; sheet.v.uebungen.push(el.value); drawSheet(); return; }
  if(t&&el.dataset.unotein){ const u=el.dataset.unotein, v=el.value.trim(); if(v) t.uebNotiz[u]=v; else { delete t.uebNotiz[u]; noteOpen[u]=false; } put('trainings',t); save(); return; }
  if(t&&el.dataset.tnotiz){ t.notiz=el.value.trim(); put('trainings',t); save(); return; }
  if(el.id==='impFile'&&el.files&&el.files[0]){ const f=el.files[0]; el.value=''; f.text().then(importJSON).catch(()=>toast('Datei nicht lesbar')); } });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet){ closeSheet(); return; }
  if(e.key==='Enter'&&e.target.matches('input.in')){
    if(sheet&&sheet.m==='uadd'&&e.target.id==='uq'){ const f=document.querySelector('#ures [data-upick],#ures [data-unew]'); if(f){ e.preventDefault(); f.click(); } return; }
    const ok=sheet?document.querySelector('#dlg [data-sok],#dlg [data-usave],#dlg [data-vsave],#dlg [data-tsave]'):(e.target.closest('.tim')?document.querySelector('[data-ssave]'):null);
    if(ok){ e.preventDefault(); e.target.blur(); ok.click(); } } });

/* ---------- Sicherung ---------- */
function exportJSON(){ const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='training-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Backup gespeichert'); }
/* Einlesen = zusammenführen: pro Eintrag gewinnt der neuere Stand, nichts wird gelöscht, was nicht als gelöscht markiert ist */
function importJSON(txt){ let x; try{ x=JSON.parse(txt); }catch(e){ toast('Keine gültige JSON-Datei'); return; }
  if(!x||typeof x!=='object'||!(x.trainings||x.uebungen||x.vorlagen)){ toast('Das ist kein Training-Backup'); return; }
  let n=0; ['uebungen','vorlagen','trainings'].forEach(c=>{ const src=x[c]; if(!src||typeof src!=='object') return;
    Object.values(src).forEach(it=>{ if(!it||!it.id) return; const o=D[c][it.id]; if(!o||(+it.upd||0)>(+o.upd||0)){ D[c][it.id]=c==='trainings'?trN(it):it; n++; } }); });
  if(x.set&&(+x.set.upd||0)>(+D.set.upd||0)){ D.set=x.set; n++; }
  D=normalize(D); save(); closeSheet(); render(); toast(n?n+' Einträge übernommen':'Nichts Neues im Backup'); }

/* ---------- Kachel-Links: #start=<Vorlage>, #neu, #laeuft ---------- */
function hashGo(){ const h=location.hash; if(!h||h==='#hintergrund') return; let m;
  if((m=/^#start=(.+)$/.exec(h))){ history.replaceState(null,'',location.pathname); const id=decodeURIComponent(m[1]); const v=D.vorlagen[id];
    if(laufend()){ toast('Es läuft schon ein Training'); oeffne(laufend().id); return; }
    if(!v||v.del){ toast('Vorlage nicht gefunden'); show('start'); return; } starte(id); return; }
  if(h==='#neu'){ history.replaceState(null,'',location.pathname); starte(null); return; }
  if(h==='#laeuft'){ history.replaceState(null,'',location.pathname); const r=laufend(); if(r) oeffne(r.id); else show('start'); } }

function setTheme(th){ document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('training_theme',th); }catch(e){} }

(function init(){
  try{ const th=localStorage.getItem('training_theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}
  load();
  if(location.hash!=='#hintergrund'){ const r=laufend(); if(r){ view='training'; tId=r.id; } }
  render(); hashGo(); setTimeout(pushSum,1500);
  if(window.__PI_SYNC){ $('homeBtn').hidden=false; $('piFoot').textContent=' und auf dem Pi'; }
  $('themeBtn').onclick=()=>{ const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches); setTheme(dark?'light':'dark'); };
  window.addEventListener('hashchange',hashGo);
  let rzT=null, rzW=innerWidth; window.addEventListener('resize',()=>{ if(innerWidth===rzW) return; rzW=innerWidth; clearTimeout(rzT); rzT=setTimeout(()=>{ if(view==='fortschritt'&&progU&&!sheet) render(); },200); });
  /* Neue Daten vom Pi oder aus einem anderen Tab: neu zeichnen, getippte Werte behalten */
  window.addEventListener('storage',e=>{ if(e.key!==KEY||!e.newValue) return; let x=null; try{ x=JSON.parse(e.newValue); }catch(_){} if(!x) return; D=normalize(x);
    if(sheet){ if(sheet.m==='data') drawSheet(); return; }
    const keep={}; document.querySelectorAll('#main input[id],#main textarea[data-tnotiz]').forEach(i=>keep[i.id||'tnotiz']=i.value); const f=document.activeElement&&document.activeElement.id;
    render(); Object.keys(keep).forEach(k=>{ const i=k==='tnotiz'?document.querySelector('[data-tnotiz]'):$(k); if(i) i.value=keep[k]; }); if(f&&$(f)) $(f).focus(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ tick(); if(!sheet&&!document.activeElement.matches('input,textarea,select')) render(); } });
})();
</script>
</body></html>
