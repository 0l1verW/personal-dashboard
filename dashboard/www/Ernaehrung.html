<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#128A4A">
<title>Ernährung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F6F8FC; --surface-3:#E9EEF6; --border:#E1E6F0; --border-strong:#CBD3E2;
  --ink:#141B2C; --muted:#5C6680; --faint:#646D84; --good-ink:#0D7038; --mid-ink:#8F5400; --bad-ink:#A8241A;
  --accent:#128A4A; --accent-2:#22B36A; --accent-fill:#128A4A; --accent-soft:rgba(18,138,74,.10); --accent-line:rgba(18,138,74,.28);
  --p:#2C7BD6; --kh:#D99318; --f:#B4567F; --bal:#6B8E23; --water:#2E9BB5;
  --shadow:0 1px 2px rgba(20,27,44,.04),0 8px 24px rgba(20,27,44,.06); --r:16px; --r-lg:22px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; --disp:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1016; --surface:#161B25; --surface-2:#1B212D; --surface-3:#242C3A; --border:#28303F; --border-strong:#3A4458;
  --ink:#EAEEF6; --muted:#98A3B8; --faint:#8A95AA; --good-ink:#5AD597; --mid-ink:#F2B65C; --bad-ink:#FF8577;
  --accent:#3FCB7E; --accent-2:#5FD896; --accent-fill:#138C4C; --accent-soft:rgba(63,203,126,.14); --accent-line:rgba(63,203,126,.32);
  --p:#5AA2EE; --kh:#E5A23A; --f:#D0739B; --bal:#8DB33A; --water:#4CC0D9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1016; --surface:#161B25; --surface-2:#1B212D; --surface-3:#242C3A; --border:#28303F; --border-strong:#3A4458;
  --ink:#EAEEF6; --muted:#98A3B8; --faint:#8A95AA; --good-ink:#5AD597; --mid-ink:#F2B65C; --bad-ink:#FF8577;
  --accent:#3FCB7E; --accent-2:#5FD896; --accent-fill:#138C4C; --accent-soft:rgba(63,203,126,.14); --accent-line:rgba(63,203,126,.32);
  --p:#5AA2EE; --kh:#E5A23A; --f:#D0739B; --bal:#8DB33A; --water:#4CC0D9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1040px;margin:0 auto;padding:18px 20px 100px}
@media(max-width:640px){.app{padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.glyph{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent-fill),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--accent-line)}
.glyph svg{width:22px;height:22px}
.brand h1{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.brand .sub{font-size:12.5px;color:var(--muted)}
.ibtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn svg{width:18px;height:18px}
/* Navigation */
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:5px;margin-bottom:16px;width:fit-content;box-shadow:var(--shadow)}
.nav button{border:0;background:none;color:var(--muted);font-weight:500;font-size:13.5px;padding:9px 15px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.nav button svg{width:16px;height:16px;flex:none}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media(max-width:640px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;width:auto;margin:0;border-radius:0;border:0;border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 0 6px}
  .nav button svg{width:22px;height:22px}.nav button[aria-current="page"]{background:none}
}
/* Karten */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-family:var(--disp);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between}
.cap{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media(max-width:860px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{font-weight:600;font-size:13.5px;border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn.pri:hover{color:#fff;filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.btn.dng:hover{border-color:#D63F30;color:#D63F30}
.btn:disabled{opacity:.45;cursor:default}
.x{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted);display:grid;place-items:center;font-weight:700;flex:none}
.x:hover{border-color:#D63F30;color:#D63F30}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.in{font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);width:100%;min-width:0}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:14px 2px;color:var(--muted);font-size:13.5px}
/* Tageskopf */
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dayhead .dt{font-family:var(--disp);font-weight:700;font-size:18px;min-width:0;margin-right:auto}
.dayhead .dt small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted)}
/* Zusammenfassung */
.sum{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.s5 .sum{flex-direction:column;align-items:stretch;gap:16px}.s5 .ring{width:150px;height:150px;align-self:center}
@media(max-width:860px){.s5 .sum{flex-direction:row;align-items:center}.s5 .ring{width:132px;height:132px}}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.ring .rl b{font-family:var(--mono);font-size:24px;font-weight:700}
.ring .rl span{font-size:11.5px;color:var(--muted)}
.macros{flex:1;min-width:200px;display:flex;flex-direction:column;gap:9px}
.mb{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.mb .ml{color:var(--muted);font-weight:600}
.mb .tr{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;position:relative}
.mb .tr i{display:block;height:100%;border-radius:5px}
.mb .vl{font-family:var(--mono);font-size:12px;white-space:nowrap}
.mb .vl small{color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini .h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600;gap:6px}
.mini b.v{font-family:var(--mono);font-size:20px}
.mini.w2{grid-column:1/-1}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:2px 2px 2px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px}.bchip b{font-family:var(--mono)}.bchip .x{width:28px;height:28px;border:0;background:none}
.ring .rl .sp{font-size:10.5px;color:var(--accent)}
.mini .acts{display:flex;gap:6px;flex-wrap:wrap}
.wcus{display:inline-flex;gap:4px}.wcus .in{width:72px;padding:5px 8px}
.wbar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}.wbar i{display:block;height:100%;background:var(--water);border-radius:4px}
.fbar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}.fbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
@media(max-width:420px){.tiles{grid-template-columns:1fr}}
/* Zeitleiste */
.tl{display:flex;flex-direction:column;gap:10px}
.hr{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.hr .hl{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:10px;text-align:right}
.hr.now .hl{color:var(--accent);font-weight:700}
.blk{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;min-width:0}
.blk .bh{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.blk .bh b{color:var(--ink);font-family:var(--mono);font-size:12.5px}
.blk .bh .sp{margin-right:auto}
.ent{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;border-top:1px solid var(--border);cursor:pointer;align-items:center;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.ent:first-of-type{border-top:0}
.ent:hover{background:var(--surface-2)}
.ent .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .k{font-family:var(--mono);font-size:13px;font-weight:700;text-align:right}
.ent .m{font-size:12px;color:var(--muted);grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.ent .m i{font-style:normal}
.addrow{display:flex;gap:8px;align-items:center}
.addrow .btn{border-style:dashed;color:var(--muted)}
.blkmenu{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px dashed var(--border);background:var(--surface-2)}
.blkmenu .bmv{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;width:100%;padding-bottom:4px}.blkmenu .bmv .in{width:auto}.blkmenu .bmv .cap{padding-bottom:8px}
.ent .k::after{content:' ›';color:var(--faint);font-weight:400}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sg{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:12px;border:1px dashed var(--accent-line);background:var(--accent-soft);cursor:pointer;text-align:left;max-width:220px}
.sg b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:196px}
.sg span{font-size:11.5px;color:var(--muted)}
.sg:hover{border-style:solid}
/* Blatt (Erfassen) */
.ov{position:fixed;inset:0;background:rgba(10,13,20,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:24px 16px;overscroll-behavior:contain}
.ov.show{display:flex}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);width:100%;max-width:600px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;overflow:hidden}
.dlg .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex:none}
.dlg .dh h3{font-family:var(--disp);font-size:17px;margin-right:auto;min-width:0}
.dlg .db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.dlg .db>*{flex-shrink:0}   /* nichts im Blatt zusammenquetschen (Nährwert-Tabelle, Trefferliste haben overflow:hidden) – stattdessen scrollt das Blatt */
.dlg .df{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);flex:none;padding-bottom:max(12px,env(safe-area-inset-bottom))}
@media(max-width:640px){.ov{padding:0}.dlg{max-width:none;max-height:none;height:100%;height:100dvh;border-radius:0;border:0}}
.when{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.when .in{width:auto}
.srch{position:relative}
.srch .in{padding-left:34px;font-size:15px;min-height:42px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.res{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.rr{border-top:1px solid var(--border)}
.rr:first-child{border-top:0}
.rr>button{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;padding:9px 12px;background:none;border:0;text-align:left;cursor:pointer;align-items:center}
.rr>button:hover{background:var(--surface-2)}
.rr .n{font-weight:600;font-size:13.5px}
.rr .s{font-size:12px;color:var(--muted)}
.rr .k{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;grid-row:1/3;grid-column:2}
.tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--surface-3);color:var(--muted)}
.tag.own{background:var(--accent-soft);color:var(--accent)}
.amt{padding:10px 12px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:9px;border-top:1px dashed var(--border)}
.amt .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.amt .gin{width:96px;font-family:var(--mono);font-weight:700;font-size:16px;text-align:right}
.amt .live{font-size:12.5px;color:var(--muted)}.amt .live b{color:var(--ink);font-family:var(--mono)}
.plate{display:flex;flex-direction:column;gap:4px;width:100%;max-height:min(30vh,240px);max-height:min(30dvh,240px);overflow:auto;overscroll-behavior:contain}
.pi{display:flex;align-items:center;gap:8px;font-size:13px}
.pi .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .g{font-family:var(--mono);color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
@media(max-width:520px){.form{grid-template-columns:1fr 1fr}.form .w2{grid-column:1/-1}}
.nk{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.nk .nr{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--border);font-size:13px}
.nk .nr:first-child{border-top:0;background:var(--surface-2);font-weight:700;font-size:12px;color:var(--muted)}
.nk .nr.sub{padding-left:24px;color:var(--muted)}
.nk .in{text-align:right;font-family:var(--mono)}
/* Verlauf */
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;line-height:1.5}
.note b{color:var(--ink)}
.ci{display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--accent-line);background:var(--accent-soft);border-radius:14px;padding:14px}
.ci .big{font-family:var(--mono);font-size:26px;font-weight:700}
/* Listen (Lebensmittel) */
.lst{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .n{font-weight:600;font-size:13.5px}.li .s{font-size:12px;color:var(--muted)}
/* Auswahl-Karten */
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.opt b{font-size:14px}.opt span{font-size:12.5px;color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.sent{font-size:13.5px;line-height:2}
.sent .in{display:inline-block;width:76px;text-align:center;font-family:var(--mono);padding:4px 6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:11px 18px;border-radius:11px;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:640px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
body:has(.ov.show) .toast{bottom:auto;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-90px)}body:has(.ov.show) .toast.show{transform:translateX(-50%) translateY(0)}   /* bei offenem Fenster oben, damit die Knöpfe frei bleiben */
.foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (pointer:coarse){
  .in{font-size:16px}.btn{min-height:42px}.btn.sm{min-height:38px}.x{width:42px;height:42px}.ibtn{width:44px;height:44px}.chip{min-height:38px}
  .srch .in{font-size:16px}
}
/* Mikronährstoffe */
.mis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;margin-top:12px}
@media(max-width:760px){.mis{grid-template-columns:1fr}}
.mi{display:grid;grid-template-columns:108px 1fr auto;grid-template-rows:auto auto;gap:2px 10px;align-items:center;font-size:12.5px}
.mi .ml{color:var(--ink);font-weight:600}.mi .ml sup{color:var(--muted);font-size:9px;margin-left:2px}
.mi .tr{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.mi .tr i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.mi .vl{font-family:var(--mono);font-size:12px;white-space:nowrap}.mi .vl small{color:var(--muted)}
.mi .cv{grid-column:2/-1;font-size:11px;color:var(--muted);min-height:0}
.mi .cv:empty{display:none}
.mi.low .tr i{opacity:.4}.mi.low .vl{color:var(--muted)}
.xs{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:12.5px;color:var(--muted)}.xs b{color:var(--ink);font-family:var(--mono);font-weight:600}
.src{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.45}
.nt{width:100%;border-collapse:collapse;font-size:13px}.nt td{padding:6px 2px;border-bottom:1px solid var(--border)}.nt td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.nt tr.h td{font-weight:700;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:14px}
.tag.bls{background:transparent;border:1px solid var(--border)}
.li.lib{grid-template-columns:1fr auto;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;cursor:pointer;border-radius:0}
.li.lib:hover{background:var(--surface-2)}
@media(max-width:520px){.li.lib .cap{display:none}}
.srow{display:flex;gap:8px;align-items:center}.srow>.srch,.srow>.in{flex:1;min-width:0}
.srow .ibtn{width:42px;height:42px;flex:none}.srow .x svg,.srow .ibtn svg{width:18px;height:18px}
.srow .x:hover{border-color:var(--accent);color:var(--accent)}

/* Runde 3: gesättigte Fettsäuren, Bilanz, Makro-Stile, Health-Import */
.mb.sub .ml{padding-left:10px;font-weight:500}
.mb .vl.bad{color:var(--bad-ink);font-weight:700}
.mbc{font-size:11.5px;color:var(--muted);line-height:1.4}
.xl{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin-top:2px}.xl b{color:var(--ink);font-family:var(--mono);font-weight:600}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:980px){.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi.bad b{color:var(--bad-ink)}
.opts.o4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.opts.o4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.opts.o4{grid-template-columns:1fr}}
.note.warn{border-color:var(--mid-ink);color:var(--ink)}
.conf{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:8px 0 4px}.conf i{display:block;height:100%;background:var(--accent)}
.bl{border-top:1px solid var(--border);padding-top:12px}.bl .big2{font-family:var(--mono);font-size:22px;font-weight:700}
.bchip.off{opacity:.55;text-decoration:line-through}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55}
.steps code,.note code{font-family:var(--mono);font-size:12px;background:var(--surface-3);border-radius:4px;padding:1px 5px}
.urlbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.urlbox code{flex:1;min-width:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
/* Runde 4 */
.wk{display:flex;flex-direction:column;gap:1px;font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px}.wk b{color:var(--ink);font-size:13px}
.wk.neg{border-left-color:var(--mid-ink)}
/* Runde 6: Mikro-Karte – Grundwerte immer sichtbar, Vitamine & Mineralstoffe eingeklappt */
.mbas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
@media(max-width:760px){.mbas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mba{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mba span{font-size:12px;color:var(--muted);font-weight:600}
.mba b{font-family:var(--mono);font-size:17px;font-weight:700;white-space:nowrap}.mba b small{font-size:11.5px;color:var(--muted);font-weight:500}
.mba em{font-style:normal;font-size:11.5px;color:var(--muted)}
.mba.ok b{color:var(--good-ink)}.mba.bad b{color:var(--bad-ink)}
.mtog{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font-weight:600;font-size:13.5px}
.mtog:hover{border-color:var(--accent)}
.mtog .mt{margin-right:auto}
.mtog .ms{font-size:12px;font-weight:500;color:var(--muted)}
.mtog svg{width:16px;height:16px;flex:none;transition:transform .15s;color:var(--muted)}
.mtog[aria-expanded="true"] svg{transform:rotate(180deg)}
.mikro .note{margin-top:10px}
/* Runde 6b: eigene Lebensmittel aus dem Eintragen-Blatt und aus einem Eintrag heraus bearbeiten */
.amt .row .sp{flex:1}
.fref{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.fref span{flex:1;min-width:160px}
</style>

/* ---------- Datum ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const kDate=k=>new Date(k+'T00:00');

/* ---------- Zustand ---------- */
const DEFSET=()=>({upd:0,ziele:{kcal:2500,p:140,kh:300,f:80,bal:30,wasser:2500,sfa:0},profil:{sex:'',alter:null,cm:null,akt:1.55},   // sfa: Obergrenze in g, 0 = automatisch 10 % der Kalorien
  phase:{art:'halten',tempo:0.25,ab:today(),zielKg:null},phasen:[],fasten:{on:false,h:16},checkin:null,mikro:false,sport:1,makro:{stil:'ausgewogen',pkg:null},trinkKn:[250,500,750,1000]});   // trinkKn: Schnellknöpfe fürs Trinken in ml (unter Ziele änderbar)   // sport: Anteil der Sport-Kalorien, der aufs Tagesziel kommt (1 | 0.5 | 0)
let fq='', D, view='heute', day=today(), sheet=null, openBlk=null, rng=7, foodTab='eigen', lastTheme=null;
function normalize(x){ TD=null;

  const d=DEFSET(); x.set=x.set&&typeof x.set==='object'?x.set:d;
  Object.keys(d).forEach(k=>{ if(x.set[k]==null) x.set[k]=d[k]; else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])) Object.keys(d[k]).forEach(j=>{ if(x.set[k][j]===undefined) x.set[k][j]=d[k][j]; }); });
  x.app=APP; x.v=1; x.savedAt=+x.savedAt||0; return x; }
function load(){ let x=null; try{ x=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){} D=normalize(x); }
let sumT=null, TD=null;   // TD: Zwischenspeicher für den Bedarf
function save(){ D.savedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){ toast('Speichern im Browser nicht möglich'); }
  clearTimeout(sumT); sumT=setTimeout(pushSum,1200); stamp(); }
const live=c=>Object.values(D[c]).filter(x=>x&&!x.del);

function rm(c,id){ TD=null; if(D[c][id]) D[c][id]={id,upd:Date.now(),del:true}; }

const G=()=>D.set.ziele;

/* ---------- Lebensmittel ---------- */
const STDMAP=Object.fromEntries(STD.map(f=>[f.id,f]));
function scale(je100,g){ const o={}; ALLK.forEach(k=>{ if(je100&&je100[k]!=null&&je100[k]!=='') o[k]=rK(k,je100[k]*g/100); }); return o; }
function sumN(list){ const o={}; NUT.forEach(k=>o[k]=0); list.forEach(e=>NUT.forEach(k=>{ o[k]+=+((e.n||{})[k])||0; })); NUT.forEach(k=>o[k]=r1(o[k])); return o; }
function recipeFood(r){ const Z=r.zutaten||[], tot=Z.reduce((t,z)=>t+(+z.g||0),0), gesamt=+r.gesamtG>0?+r.gesamtG:tot, n=sumN(Z.map(z=>({n:scale(z.n100,z.g)}))), je100={};

  return {id:r.id,name:r.name,quelle:'rezept',je100,portionen:[{l:'1 Portion',g:Math.round(gesamt/(+r.portionen||1))}],rez:r}; }
function food(ref){ if(STDMAP[ref]) return STDMAP[ref]; if(ref&&ref.startsWith('bls-')) return BLSMAP[ref.slice(4)]||null; const f=D.foods[ref]; if(f&&!f.del) return {...f,quelle:'eigen'}; const r=D.recipes[ref]; if(r&&!r.del) return recipeFood(r); return null; }
const allFoods=withBls=>[...live('foods').map(f=>({...f,quelle:'eigen'})),...live('recipes').map(recipeFood),...STD,...(withBls&&BLS?BLS:[])];
/* ---------- BLS 4.0: liegt als /bls.json auf dem Pi (gzip, gecacht) – keine Internetverbindung nötig ---------- */
let BLS=null; const BLSMAP={};
/* Getränke im BLS: N = alkoholfreie Getränke, P = alkoholische, F…saft/nektar = Säfte, M1…milch/drink – ohne Pulver/Konzentrat */
const blsFl=(c,n)=>!/pulver|granulat|konzentrat|instant|extrakt/i.test(n)&&(/^[NP]/.test(c)||(/^F/.test(c)&&/saft|nektar|smoothie/i.test(n))||(/^M1/.test(c)&&/milch|drink|kakao/i.test(n)));

function loadBLS(){ if(location.protocol==='file:') return;

    BLS=j.rows.map(r=>{ const je100={}; K.forEach((k,i)=>{ const v=r[i+2]; if(v!=null) je100[k]=v; }); return {id:'bls-'+r[0],code:r[0],name:r[1],quelle:'bls',je100,portionen:[],_n:norm(r[1]),fl:blsFl(r[0],r[1])}; });
    BLS.forEach(f=>BLSMAP[f.code]=f);
    STD.forEach(s=>{ const b=s.bls&&BLSMAP[s.bls]; if(b) MX.forEach(k=>{ if(s.je100[k]==null&&b.je100[k]!=null) s.je100[k]=b.je100[k]; }); });   // Grundliste: Mikros aus dem BLS
    if(sheet&&sheet.m==='add') drawRes(); else if(!sheet) render(); }).catch(()=>{}); }
const norm=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
let USE=null;
function usage(){ if(USE) return USE; const u={}; live('log').forEach(e=>{ if(!e.ref) return; const x=u[e.ref]=u[e.ref]||{n:0,g:e.g,last:0}; x.n++; if(e.upd>x.last){ x.last=e.upd; x.g=e.g; } }); return USE=u; }
function search(q,tab,lim){ const u=usage(), qn=norm(q).trim(), toks=qn.split(/\s+/).filter(Boolean);
  let L=tab==='bls'?(BLS||[]):allFoods(toks.length>0||tab==='zuletzt');

  if(toks.length) L=L.filter(f=>{ const h=f._n||norm(f.name+' '+(f.marke||'')); return toks.every(t=>h.includes(t)); });
  const sc=f=>(u[f.id]?Math.min(30,u[f.id].n)*3+(tab==='zuletzt'?u[f.id].last/1e12:0):0)+(toks.length&&norm(f.name).startsWith(toks[0])?8:0)+(f.quelle==='eigen'?2:0)+(f.quelle==='rezept'?1:0)+(f.quelle==='std'?4:0)
    +(f.quelle==='bls'?(/\broh\b/.test(f._n)?1:0)-f.name.length/25:0);
  return L.sort((a,b)=>sc(b)-sc(a)||a.name.localeCompare(b.name,'de')).slice(0,lim||60); }
const defG=f=>{ const u=usage()[f.id]; return u&&u.g?u.g:(f.portionen&&f.portionen[0]?f.portionen[0].g:100); };

/* ---------- Tagesdaten ---------- */
const entriesOn=k=>live('log').filter(e=>e.datum===k).sort((a,b)=>(a.zeit||'').localeCompare(b.zeit||'')||a.upd-b.upd);

const drinkMl=k=>entriesOn(k).filter(e=>e.fl&&!(e.n&&+e.n.alk>0)).reduce((t,e)=>t+(+e.g||0),0);   // Getränke ohne Alkohol zählen zum Trinken
/* Sport/Garmin: verbrannte (aktive) Kalorien je Tag; erhöhen das Tagesziel um den eingestellten Anteil */
const burnOn=k=>live('burn').filter(b=>b.datum===k).sort((a,b)=>a.upd-b.upd);
const dayBurn=L=>{ const T=L.filter(b=>b.tag); return (T.length?T:L).reduce((t,b)=>t+(+b.kcal||0),0); };   // Tageswert der Uhr (tag) ersetzt Einzel-Einträge – nichts zählt doppelt
const burnSum=k=>dayBurn(burnOn(k));
const budget=k=>Math.round(G().kcal+burnSum(k)*(+D.set.sport||0));
/* Gesättigte Fettsäuren: Summe und Anteil des Fetts, für den ein Wert vorliegt (fehlt er, zählt er nicht als 0).

function sfaOf(L){ let v=0, fk=0, ft=0; L.forEach(e=>{ const n=e.n||{}, f=+n.f||0; let s=n.sfa!=null?+n.sfa:null;

    ft+=f; if(s!=null){ v+=s; fk+=f; } }); return {v:r1(v),cov:ft>0?fk/ft:1,ft}; }
const sfaMax=()=>+G().sfa>0?+G().sfa:Math.round(G().kcal*0.1/9);
/* Trink-Knöpfe: aufsteigend, ohne Doppelte, 1–5000 ml, höchstens 6; leer → Standard */
const TRINK_STD=[250,500,750,1000], TRINK_MAX=6;
const trinkKn=()=>{ const a=[...new Set((Array.isArray(D.set.trinkKn)?D.set.trinkKn:[]).map(v=>Math.round(+v)).filter(v=>v>0&&v<=5000))].sort((x,y)=>x-y).slice(0,TRINK_MAX); return a.length?a:TRINK_STD.slice(); };
const fMl=v=>v>=1000?fmt(v/1000,2)+' l':fmt(v)+' ml';
const waterSum=k=>waterOn(k).reduce((t,w)=>t+(+w.ml||0),0)+drinkMl(k);
function addEntries(items,k,zeit){ items.forEach(it=>put('log',{id:uid('e'),datum:k,zeit,ref:it.ref||null,name:it.name,g:r1(it.g),n:it.n,quelle:it.quelle||'',...(it.fl?{fl:1}:{})})); USE=null; save(); }
function suggestions(k){ const ref=k===today()?hm2min(nowHM()):12*60, since=kAdd(k,-30), have=new Set(entriesOn(k).map(e=>e.ref)), c={};
  live('log').forEach(e=>{ if(!e.ref||e.datum>=k||e.datum<since||have.has(e.ref)) return; const m=hm2min(e.zeit); if(m==null) return;
    const dlt=Math.min(Math.abs(m-ref),1440-Math.abs(m-ref)); if(dlt>90) return;
    const x=c[e.ref]=c[e.ref]||{ref:e.ref,name:e.name,n:0,g:e.g,u:0}; x.n++; if(e.upd>x.u){ x.u=e.upd; x.g=e.g; } });
  return Object.values(c).filter(x=>x.n>=2&&food(x.ref)).sort((a,b)=>b.n-a.n).slice(0,6); }

/* ---------- Gewicht, Trend, Bedarf ---------- */
function weights(){ return live('weight').filter(w=>+w.kg>0).sort((a,b)=>a.datum.localeCompare(b.datum)); }
function trend(){ const W=weights(); let t=null, prev=null; return W.map(w=>{ if(t==null) t=+w.kg; else { const dd=Math.max(1,kDiff(w.datum,prev)); const a=1-Math.pow(0.9,dd); t=t+a*(+w.kg-t); } prev=w.datum; return {datum:w.datum,kg:+w.kg,t:r1(t*10)/10}; }); }
function trendAt(T,k){ let v=null; T.forEach(x=>{ if(x.datum<=k) v=x.t; }); return v; }
function lastKg(){ const W=weights(); return W.length?+W[W.length-1].kg:null; }
/* ---------- Bedarf ----------
   Bedarf = Grundbedarf (Ruhe + Alltag) + Sport. Der Grundbedarf kommt erst aus der Formel (Profil) und wird dann aus den
   eigenen Daten gemessen: Ø gegessen − Gewichtsänderung × 7700 kcal/kg, über 4 Wochen. Angerechnete Sport-Kalorien werden
   vorher abgezogen, damit Sport nicht doppelt zählt (einmal im Bedarf, einmal als Zuschlag aufs Tagesziel). */
const SPF=()=>+D.set.sport||0;
function bmr(){ const p=D.set.profil, kg=lastKg(); if(!p.sex||!(+p.alter>0)||!(+p.cm>0)||!kg) return null; return Math.round(10*kg+6.25*+p.cm-5*+p.alter+(p.sex==='m'?5:-161)); }
const tagBurn=(a,b)=>live('burn').some(x=>x.tag&&x.datum>=a&&x.datum<=b);
const uhrTag=()=>!!SPF()&&tagBurn(kAdd(today(),-14),today());   // die Uhr liefert den ganzen Tag → Alltagsbewegung steckt schon in den Sport-Kalorien
function mifflin(){ const b=bmr(); if(!b) return null; return Math.round(b*(uhrTag()?1.1:(+D.set.profil.akt||1.55))); }
const minKcal=()=>{ const b=bmr(); return b?b*0.6:900; };   // darunter gilt ein Tag als unvollständig erfasst
function tdee(){ if(TD&&TD.s===D.savedAt&&TD.d===today()) return TD.r; const r=tdeeCalc(); TD={s:D.savedAt,d:today(),r}; return r; }
function tdeeCalc(){ const N=28, end=kAdd(today(),-1), start=kAdd(end,-(N-1)), f=SPF(), form=mifflin(), minK=minKcal(), by={}, B={};
  live('log').forEach(e=>{ if(e.datum>=start&&e.datum<=end) by[e.datum]=(by[e.datum]||0)+(+((e.n||{}).kcal)||0); });
  live('burn').forEach(x=>{ if(x.datum>=start&&x.datum<=end) (B[x.datum]=B[x.datum]||[]).push(x); });
  const full=Object.keys(by).filter(k=>by[k]>=minK), part=Object.keys(by).length-full.length;

function timeline(E,isT){ const by={}; E.forEach(e=>{ const h=(e.zeit||'12:00').slice(0,2); (by[h]=by[h]||[]).push(e); });
  const nowH=String(new Date().getHours()).padStart(2,'0'); const hs=Object.keys(by); if(isT&&!by[nowH]) hs.push(nowH); hs.sort();
  let h=hs.map(H=>{ const L=by[H]||[], n=sumN(L), now=isT&&H===nowH;
    if(!L.length) return `<div class="hr now"><span class="hl">${H}:00</span><div class="addrow"><button class="btn" data-add="${now?nowHM():H+':00'}">+ jetzt eintragen</button></div></div>`;
    return `<div class="hr${now?' now':''}"><span class="hl">${H}:00</span><div class="blk"><div class="bh"><span class="sp">${L.length} ${L.length===1?'Eintrag':'Einträge'} · <b>${fmt(n.kcal)} kcal</b></span>
      <button class="x" data-add="${now?nowHM():esc(L[L.length-1].zeit)}" aria-label="Zu ${H} Uhr hinzufügen" title="Hinzufügen">+</button><button class="x" data-blk="${H}" aria-label="Aktionen für ${H} Uhr" aria-expanded="${openBlk===H}">⋯</button></div>
      ${L.map(e=>`<button class="ent" data-ent="${e.id}"><span class="n">${esc(e.name)}</span><span class="k">${fmt(e.n.kcal)} kcal</span><span class="m"><i>${esc(e.zeit)}</i><i>${e.g>0?fmt(e.g)+' '+unitOf(e):'Schnell-Eintrag'}</i>${nLine(e.n)}</span></button>`).join('')}
      ${openBlk===H?`<div class="blkmenu"><div class="bmv"><label class="lbl">Uhrzeit<input class="in" type="time" id="bT" value="${esc(L[0].zeit)}"></label><label class="lbl">Tag<input class="in" type="date" id="bD" value="${day}"></label><button class="btn sm pri" data-bmove="${H}">Übernehmen</button><span class="cap">${L.length===1?'für diesen Eintrag':'für alle '+L.length+' Einträge'}</span></div>${day!==today()?`<button class="btn sm" data-bcopy="${H}|${today()}">Nach heute kopieren</button>`:''}<button class="btn sm" data-bcopy="${H}|${kAdd(day,1)}">Nach morgen kopieren</button><button class="btn sm" data-brec="${H}">Als Rezept speichern</button><button class="btn sm dng" data-bdel="${H}">Alle löschen</button></div>`:''}</div></div>`; }).join('');
  if(!E.length){ const y=entriesOn(kAdd(day,-1)); h+=`<div class="empty">${isT?'Noch nichts eingetragen.':'An diesem Tag ist nichts eingetragen.'}${y.length?` <button class="btn sm" data-dcopy="${kAdd(day,-1)}">Wie am Vortag (${y.length} Einträge)</button>`:''}</div>`; }
  else if(day!==today()) h+=`<div><button class="btn sm" data-dcopy="${day}|${today()}">Ganzen Tag nach heute kopieren</button></div>`;
  return h; }

function vZiele(el){ const s=D.set, p=s.profil, g=s.ziele, rec=recommend(), td=tdee(), kg=lastKg(), ph=s.phase, pd=phDelta(ph.art,ph.tempo), pg=prognose(), mk=s.makro||{}, st=stilK(), ab=ph.art==='ab';

/* Eintrag bearbeiten. Mit Lebensmittel: Werte = Lebensmittel × Menge.
   Ohne Lebensmittel (Schnell-Eintrag/Foto): Bezug ist sheet.base = {g, n} – der Stand beim Öffnen bzw. nach der letzten Wert-Änderung.
   mode 'menge': neue Menge rechnet die Felder aus dem Bezug nach (nur wenn Bezug und neue Menge > 0, sonst bleiben die Felder stehen);
   mode 'wert':  Eingaben übernehmen und als neuen Bezug merken; ohne mode: nur lesen. Leere Felder gelten als „kein Wert“. */
function liveEdit(mode){ const e=D.log[sheet.id], f=food(e.ref), g=num($('eg').value)||0; let n;
  if(f) n=scale(f.je100,g);
  else { const b=sheet.base||(sheet.base={g:+e.g||0,n:{...(e.n||{})}}), sc=b.g>0&&g>0;
    n=sc?scaleN(b.n,g/b.g):{...b.n};
    EVK.forEach(k=>{ const i=$('ev_'+k); if(!i) return;
      if(mode==='menge'&&sc){ i.value=n[k]!=null?String(n[k]).replace('.',','):''; return; }
      const v=num(i.value); if(v!=null&&v>=0) n[k]=rK(k,v); else delete n[k]; });
    if(mode==='wert') sheet.base={g,n:{...n}}; }
  $('elive').innerHTML=`= <b>${fmt(n.kcal)} kcal</b> · Eiweiß ${fmt(n.p,1)} g · KH ${fmt(n.kh,1)} g · Fett ${fmt(n.f,1)} g`; return n; }

  if(ds.fsave){ const name=$('fn').value.trim(); if(!name){ toast('Bitte einen Namen eingeben'); return; } const je100={}; [...NUT,'sfa'].forEach(k=>{ const v=num($('n_'+k).value); if(v!=null) je100[k]=v; });
    if(je100.kcal==null){ toast('Mindestens die Kalorien je 100 g eintragen'); return; }

    const src=sheet.id?D.foods[sheet.id]:sheet.copy?food(sheet.copy):null; if(src&&src.je100) MX.forEach(k=>{ if(k!=='sfa'&&src.je100[k]!=null) je100[k]=src.je100[k]; });   // Vitamine & Co. übernehmen
    const pg=num($('pg').value), pl=$('pl').value.trim(), ean=$('fe').value.replace(/\D/g,'');
    if(ean&&live('foods').some(f=>f.ean===ean&&f.id!==sheet.id)){ toast('Diese Barcode-Nummer gehört schon zu einem anderen Lebensmittel'); return; }
    const f=put('foods',{id:sheet.id||uid('f'),...(src&&src.quelle==='bls'?{bls:src.code}:src&&src.bls?{bls:src.bls}:{}),name,marke:$('fm').value.trim(),ean,fl:$('ffl').checked,je100,portionen:pg>0?[{l:pl||'Portion',g:pg}]:[]}); USE=null; save();
    if(sheet.back&&sheet.back.m==='edit'){ const b=sheet.back, e=D.log[b.id];   // aus einem Eintrag heraus bearbeitet: diesen Eintrag gleich mit den neuen Werten neu rechnen
      if(e&&!e.del&&e.ref===f.id&&e.g>0) put('log',{...e,n:scale(je100,e.g)}); USE=null; save(); sheet=b; drawSheet(); return toast('Lebensmittel gespeichert – Eintrag neu berechnet'); }
    if(sheet.back){ const b=sheet.back, neu=!sheet.id; b.q=f.ean||f.name; b.tab='alle'; b.open=f.id; b.g=sheet.id?(b.g||defG(food(f.id))):pg>0?pg:100; sheet=b; drawSheet(); return toast(neu?'Gespeichert – Menge wählen':'Lebensmittel gespeichert'); }   // Suche auf das Lebensmittel setzen, damit es sicher in der Liste steht
    sheet=null; $('ov').classList.remove('show'); foodTab='eigen'; render(); return toast('Lebensmittel gespeichert'); }
  if(ds.esave){ const e=D.log[sheet.id], f=food(e.ref), g=num($('eg').value);
    if(f&&!(g>0)){ toast('Menge eintragen'); $('eg').focus(); return; }

    const fl=$('efl').checked; put('log',{...e,name:($('en').value.trim()||e.name).slice(0,60),g:g>0?r1(g):0,n,fl:fl?1:0,datum:$('ek').value||e.datum,zeit:$('ez').value||e.zeit}); USE=null; save(); sheet=null; $('ov').classList.remove('show'); render(); return toast('Gespeichert'); }
  if(ds.edel){ rm('log',sheet.id); USE=null; save(); sheet=null; $('ov').classList.remove('show'); render(); return toast('Eintrag gelöscht'); }
  if(ds.edup){ const e=D.log[sheet.id]; put('log',{...e,id:uid('e'),zeit:day===today()?nowHM():e.zeit,datum:day}); save(); sheet=null; $('ov').classList.remove('show'); render(); return toast('Noch einmal eingetragen'); }
  if(ds.zrm!=null){ sheet.r.zutaten.splice(+ds.zrm,1); return drawSheet(); }
  if(ds.rsave){ const r=sheet.r; r.name=$('rn').value.trim(); if(!r.name){ toast('Bitte einen Namen für das Rezept'); return; } if(!(r.zutaten||[]).length){ toast('Das Rezept hat keine Zutaten'); return; }
    r.portionen=Math.max(1,Math.round(num($('rp').value)||1)); r.gesamtG=num($('rg').value)||null; if(!r.id) r.id=uid('r'); put('recipes',r); USE=null; save();
    if(sheet.back){ sheet=sheet.back; drawSheet(); return toast('Rezept gespeichert – findest du unter „Rezepte“'); }
    sheet=null; $('ov').classList.remove('show'); render(); return toast('Rezept gespeichert'); }
  if(ds.exp){ const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}), u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download='ernaehrung_'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); return toast('Backup gespeichert'); }
  if(ds.imp) return $('impFile').click();
});
function setTempo(v,soon){ let k0=G().kcal,k1; setS(s=>{ const o=phDelta(s.phase.art,s.phase.tempo); s.phase.tempo=v; k1=shiftGoal(s,o,phDelta(s.phase.art,v)); }); soon?renderSoon():render(); if(k1!==k0) toast(`Kalorienziel ${fmt(k0)} → ${fmt(k1)} kcal`); }
/* Foto-Schätzung (Skill „essen-foto“): Code „ESSEN1 [{…},…]“ ins Suchfeld einfügen → alle Teile landen auf dem Teller */
function fotoCode(s){ s=String(s||'').replace(/[“”„]/g,'"'); if(!/^\s*ESSEN1\b/i.test(s)) return null;
  const m=/^\s*ESSEN1\s*(\[[\s\S]*\]|\{[\s\S]*\})\s*$/i.exec(s); if(!m) return [];
  let x; try{ x=JSON.parse(m[1]); }catch(_){ return []; } if(!Array.isArray(x)) x=[x];
  return x.slice(0,20).filter(it=>it&&typeof it==='object'&&+it.kcal>=0).map(it=>{ const n={};
    ALLK.forEach(k=>{ const v=+it[k]; if(it[k]!=null&&it[k]!==''&&isFinite(v)&&v>=0&&v<20000) n[k]=rK(k,v); });
    const ml=+it.ml>0&&+it.ml<5000, g=ml?r1(it.ml):+it.g>0&&+it.g<5000?r1(it.g):0; return {ref:null,name:(String(it.t||it.name||'Foto-Schätzung').trim()||'Foto-Schätzung').slice(0,60),g,n,quelle:'foto',...(ml?{fl:1}:{})}; }); }
let fqT; document.addEventListener('input',e=>{ const el=e.target;
  if(el.id==='q'&&sheet&&sheet.m==='add'){ const F=fotoCode(el.value);
    if(F){ if(!F.length){ sheet.q=el.value; sheet.open=null; if(!sheet.fw){ sheet.fw=1; toast('Der Code ist unvollständig – bitte komplett kopieren und einfügen.',4000); } return; }   // Hinweis nur einmal, nicht bei jedem Tastendruck
      sheet.fw=0; sheet.plate.push(...F); sheet.q=''; sheet.open=null; drawSheet(); const k=F.reduce((t,p)=>t+(+p.n.kcal||0),0);
      return toast(`${F.length} ${F.length===1?'Teil':'Teile'} vom Foto auf dem Teller (${Math.round(k)} kcal) – prüfen, dann „Eintragen“`,4500); }
    sheet.fw=0; }
  if(el.id==='q'&&sheet){ sheet.q=el.value; sheet.open=null; return drawRes(); }
  if(el.id==='gIn') return liveAmt();
  if(el.id==='eg') return liveEdit('menge');
  if(/^ev_/.test(el.id)) return liveEdit('wert');
  if(el.id==='fq'){ fq=el.value; clearTimeout(fqT); fqT=setTimeout(()=>{ const l=$('flist'); if(l) l.innerHTML=blsList(); },150); return; }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet) return closeSheet();
  if(e.key==='Enter'&&(e.target.id==='bIn'||e.target.id==='bNm')){ e.preventDefault(); const b=document.querySelector('[data-burn]'); if(b) b.click(); }
  if(e.key==='Enter'&&e.target.id==='tkIn'){ e.preventDefault(); const b=document.querySelector('[data-tkadd]'); if(b) b.click(); }
  if(e.key==='Enter'&&e.target.id==='wIn'){ e.preventDefault(); const b=document.querySelector('[data-water="x"]'); if(b) b.click(); }
  if(e.key==='Enter'&&e.target.id==='gIn'){ e.preventDefault(); const b=document.querySelector('[data-toplate]'); if(b) b.click(); }
  if(e.key==='Enter'&&e.target.id==='q'&&sheet){ e.preventDefault(); const R=search(sheet.q,sheet.tab); if(R.length===1||(/^\d{8,14}$/.test(sheet.q.trim())&&R.length)){ sheet.open=R[0].id; sheet.g=defG(R[0]); drawRes(); const g=$('gIn'); if(g){ g.focus(); g.select(); } } else if(!R.length&&/^\d{8,14}$/.test(sheet.q.trim())){ const b=document.querySelector('[data-fnew="ean"]'); if(b) b.click(); } }
});
document.addEventListener('change',e=>{ const el=e.target;
  if(el.id==='kgIn'){ const v=num(el.value); if(v==null){ rm('weight','w'+day); } else if(v<25||v>350){ toast('Bitte ein Gewicht in kg eintragen'); return; } else put('weight',{id:'w'+day,datum:day,kg:r1(v*10)/10}); save(); return renderSoon(); }
  if(el.id==='bcIn'){ const v=num(el.value); if(v==null){ rm('mass','m'+day); } else if(v<40||v>200){ toast('Bitte den Bauchumfang in cm eintragen'); return; } else put('mass',{id:'m'+day,datum:day,bauch:r1(v)}); save(); return renderSoon(); }
  if(el.dataset.goal){ const v=num(el.value); if(el.dataset.goal==='sfa'&&(v==null||v<=0)){ setS(s=>{ s.ziele.sfa=0; }); return renderSoon(); } if(v==null||v<0) return render(); setS(s=>{ s.ziele[el.dataset.goal]=Math.round(v); }); return renderSoon(); }
  if(el.dataset.prof==='sport'){ setS(s=>{ s.sport=+el.value; }); return renderSoon(); }
  if(el.dataset.prof){ const k=el.dataset.prof; setS(s=>{ s.profil[k]=k==='sex'?el.value:num(el.value); }); return renderSoon(); }
  if(el.dataset.tempo){ const v=num(el.value); if(v==null||v<0||v>1.5){ toast('Tempo zwischen 0 und 1,5 kg pro Woche'); return render(); } return setTempo(v,true); }
  if(el.dataset.zielkg){ const v=num(el.value); if(v!=null&&(v<25||v>350)){ toast('Bitte ein Zielgewicht in kg'); return render(); } setS(s=>{ s.phase.zielKg=v==null?null:r1(v); }); return renderSoon(); }
  if(el.dataset.pkg){ const v=num(el.value); if(v!=null&&(v<0.8||v>3.5)){ toast('Eiweiß zwischen 0,8 und 3,5 g je kg'); return render(); } setS(s=>{ s.makro={...(s.makro||{}),pkg:v}; }); return renderSoon(); }
  if(el.dataset.mikro){ setS(s=>{ s.mikro=el.checked; }); return render(); }
  if(el.dataset.fast){ setS(s=>{ if(el.dataset.fast==='on') s.fasten.on=el.checked; else { const v=num(el.value); if(v>=8&&v<=23) s.fasten.h=Math.round(v); } }); return el.dataset.fast==='on'?render():renderSoon(); }
  if(el.dataset.zg!=null&&sheet&&sheet.m==='recipe'){ const v=num(el.value); if(v>0) sheet.r.zutaten[+el.dataset.zg].g=v; return drawSheet(); }
  if(el.id==='sk'&&sheet) sheet.k=el.value; if(el.id==='sz'&&sheet) sheet.zeit=el.value;
  if(el.id==='scanFile'&&el.files[0]){ const file=el.files[0], to=scanFor; el.value=''; toast('Barcode wird gelesen …',60000);
    decodeBarcode(file).then(code=>gotCode(code,to)).catch(()=>toast('Der Barcode-Leser ist nur verfügbar, wenn die Seite vom Pi geöffnet wird.')); return; }
  if(el.id==='impFile'&&el.files[0]){ const r=new FileReader(); r.onload=()=>{ let x=null; try{ x=JSON.parse(r.result); }catch(_){}
      if(!x||x.app!==APP){ toast('Keine Ernährungs-Daten in der Datei'); return; }
      if(!confirm(`Backup vom ${x.savedAt?new Date(x.savedAt).toLocaleString('de-DE'):'?'} einlesen? Einträge werden zusammengeführt – nichts geht verloren.`)) return;
      ['log','foods','recipes','weight','water','burn','mass'].forEach(c=>Object.values(x[c]||{}).forEach(it=>{ const o=D[c][it.id]; if(!o||(+it.upd||0)>(+o.upd||0)) D[c][it.id]=it; }));
      if(x.set&&(+x.set.upd||0)>(+D.set.upd||0)) D.set=x.set; D=normalize(D); USE=null; save(); sheet=null; $('ov').classList.remove('show'); render(); toast('Backup eingelesen'); };
    r.readAsText(el.files[0]); el.value=''; }
});
$('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet(); });
/* Nach einer Eingabe erst neu zeichnen, wenn kein Feld mehr den Fokus hat und kein Finger/Mausknopf unten ist.
   Sonst baut die Seite um, während man ins nächste Feld tippt – am Handy geht dann die Tastatur zu. */
let rPend=false, ptrDown=false;
function renderSoon(){ rPend=true; setTimeout(()=>{ if(!rPend||ptrDown||sheet) return; const a=document.activeElement;
  if(a&&a.matches&&a.matches('#main input,#main select,#main textarea')) return; rPend=false; render(); },60); }
document.addEventListener('focusout',()=>{ if(rPend) renderSoon(); });
document.addEventListener('pointerdown',()=>{ ptrDown=true; },true);
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{ ptrDown=false; if(rPend) renderSoon(); },true));

/* ---------- Dashboard-Kachel, Kleinkram ---------- */
function pushSum(){ if(!window.__PI_SYNC) return; const k=today(), t=sumN(entriesOn(k)), g=G(), w=waterSum(k), bud=budget(k);
  const s={v:1,savedAt:Date.now(),zahl:{wert:Math.round(t.kcal),von:bud,einheit:'kcal',label:bud!==g.kcal?'heute (inkl. Sport)':'heute',datum:k},ring:{wert:Math.round(t.kcal),von:bud,label:'kcal'},
    balken:[{l:'P',wert:Math.round(t.p),von:g.p,einheit:'g'},{l:'KH',wert:Math.round(t.kh),von:g.kh,einheit:'g'},{l:'F',wert:Math.round(t.f),von:g.f,einheit:'g'},{l:'H₂O',wert:r1(w/1000),von:r1(g.wasser/1000),einheit:'l',farbe:'#2C7BD6'}],ring2:{wert:r1(w/1000),von:r1(g.wasser/1000),einheit:'l',label:'Wasser',farbe:'#2C7BD6'},
    zeilen:entriesOn(k).slice(-5).reverse().map(e=>({t:e.name,sub:e.zeit+' · '+Math.round(e.n.kcal||0)+' kcal'})),leerHeute:'Heute noch nichts eingetragen'};
  fetch('/api/sum_essen',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)}).catch(()=>{}); }
function stamp(){ const el=$('saved'); if(el) el.textContent=D.savedAt?'gespeichert '+new Date(D.savedAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'noch nichts gespeichert'; }
let toastT; function toast(m,ms){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms||2600); }

/* ---------- Barcode per Foto: Erkennung lokal im Browser (ZXing liegt auf dem Pi unter /vendor, kein Internet) ---------- */
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>';
const SCAN_OK=()=>!!window.__PI_SYNC;
let ZXP=null, scanFor=null;
function zxLoad(){ if(window.ZXing) return Promise.resolve(window.ZXing); if(ZXP) return ZXP;
  return ZXP=new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='/vendor/zxing.min.js'; s.onload=()=>window.ZXing?ok(window.ZXing):no(new Error('ZXing fehlt')); s.onerror=e=>{ ZXP=null; no(e); }; document.head.appendChild(s); }); }
function loadImg(file){ return new Promise((ok,no)=>{ const u=URL.createObjectURL(file), i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); ok(i); }; i.onerror=e=>{ URL.revokeObjectURL(u); no(e); }; i.src=u; }); }
async function decodeBarcode(file){ const Z=await zxLoad(), img=await loadImg(file), W=img.naturalWidth, H=img.naturalHeight;
  const hints=new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]); hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const rd=new Z.MultiFormatReader(); rd.setHints(hints);
  const tries=[[1,1400],[1,2200],[.6,1400],[.4,1200]];   // [Bildausschnitt (Mitte), max. Kantenlänge]
  for(const [crop,max] of tries) for(const rot of [0,90]){ await new Promise(r=>setTimeout(r,0));   // Oberfläche zwischendurch atmen lassen
    const cw=W*crop, ch=H*crop, sc=Math.min(1,max/Math.max(cw,ch)), w=Math.round(cw*sc), h=Math.round(ch*sc), cv=document.createElement('canvas'), x=cv.getContext('2d');
    cv.width=rot?h:w; cv.height=rot?w:h; x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); if(rot){ x.translate(h,0); x.rotate(Math.PI/2); } x.drawImage(img,(W-cw)/2,(H-ch)/2,cw,ch,0,0,w,h);
    try{ const r=rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))); const t=r.getText(); if(/^\d{8,14}$/.test(t)) return t.length===12?'0'+t:t; }catch(e){} }
  return null; }
function gotCode(code,to){ if(!code){ toast('Kein Barcode erkannt. Tipp: nah ran, scharf, gerade von vorn – oder die Nummer unter dem Strichcode eintippen.',5000); return; }
  if(to==='food'){ const i=$('fe'); if(i){ i.value=code; } toast('Barcode '+code+' übernommen'); return; }
  if(!sheet||sheet.m!=='add') return; sheet.q=code; sheet.tab='alle'; sheet.open=null; drawSheet(); const R=search(code,'alle');
  if(R.length){ sheet.open=R[0].id; sheet.g=defG(R[0]); drawRes(); toast(R[0].name+' gefunden'); } else toast('Barcode '+code+' ist noch unbekannt – einmal mit den Packungswerten anlegen.',4000); }
const hm2m=t=>{ const [h,m]=String(t||'12:00').split(':'); return (+h||0)*60+(+m||0); }, m2hm=x=>{ x=Math.max(0,Math.min(1439,x)); return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); };
function setTheme(th){ document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('essen_theme',th); }catch(e){} }

(function init(){
  try{ const th=localStorage.getItem('essen_theme'); if(th) document.documentElement.setAttribute('data-theme',th); view=localStorage.getItem('er_view')||'heute'; }catch(e){}
  load(); render(); setTimeout(pushSum,1500); loadBLS();
  if(window.__PI_SYNC) $('homeBtn').hidden=false;
  $('themeBtn').onclick=()=>{ const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches); setTheme(dark?'light':'dark'); };
  $('dataBtn').onclick=()=>{ sheet={m:'data'}; drawSheet(); $('ov').classList.add('show'); };
  if(location.hash==='#neu'){ history.replaceState(null,'',location.pathname); view='heute'; render(); openAdd(); }
  /* iOS-Kurzbefehl „Barcode scannen“ öffnet …/Ernaehrung.html#ean=<Nummer> → direkt im Hinzufügen-Blatt suchen */
  const eanHash=()=>{ const m=/^#ean=(\d{8,14})$/.exec(location.hash); if(!m) return; history.replaceState(null,'',location.pathname);
    const c=m[1].length===12?'0'+m[1]:m[1]; view='heute'; render(); if(!sheet||sheet.m!=='add') openAdd(); gotCode(c,'add'); };
  eanHash(); window.addEventListener('hashchange',eanHash);
  window.addEventListener('storage',e=>{ if(e.key!==KEY||!e.newValue) return; let x=null; try{ x=JSON.parse(e.newValue); }catch(_){} if(!x) return; D=normalize(x); USE=null;
    if(sheet&&sheet.m==='add'){ drawPlate(); } else if(!sheet) render(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&!sheet){ if(day<today()&&day===kAdd(today(),-1)) day=today(); render(); } });
  setInterval(()=>{ if(!sheet&&view==='heute'&&!document.activeElement.matches('input,select,textarea')) render(); },60e3);
})();
