<header><div class="hd"><h1>{{TITLE}}</h1><div class="date" id="date"></div></div>

<script>

var DEF=[{id:'alex',name:'Alex',kz:'alex',farbe:'#5B4BE0',owner:true},{id:'sam',name:'Sam',kz:'sam',farbe:'#E0673A'},{id:'kim',name:'Kim',kz:'kim',farbe:'#2C7BD6'},{id:'robin',name:'Robin',kz:'robin',farbe:'#16A85A'}];
var P={savedAt:0,list:DEF.slice()}, SUM={}, me=null, draft=null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
me=ROLE.pid||null; try{ localStorage.setItem('pd_person',me||''); }catch(e){}
if(!me) location.replace('/anmelden?z=/');   // erst anmelden bzw. Person wählen
function person(id){ return P.list.filter(function(p){ return p.id===id; })[0]; }
function owner(){ return P.list.filter(function(p){ return p.owner; })[0]||P.list[0]; }
function isAdmin(){ return !!ROLE.admin; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rel(ts){ var ms=ts-Date.now(), h=ms/36e5;
  if(ms<0){ var a=-ms/36e5; return a<24?'überfällig':'seit '+Math.round(a/24)+' T überfällig'; }
  if(h<1) return 'in '+Math.max(1,Math.round(ms/6e4))+' Min.'; if(h<48) return 'in '+Math.round(h)+' Std.'; return 'in '+Math.round(h/24)+' Tagen'; }
function num(v){ if(v==null||v==='') return null; var x=parseFloat(String(v).replace(',','.')); return isNaN(x)?null:x; }
function fmt(v){ var n=num(v); return n==null?esc(v):n.toLocaleString('de-DE',{maximumFractionDigits:1}); }

/* Ältere Kurzinfos (vor dem einheitlichen Format) in den Vorschau-Vertrag übersetzen */
function adapt(id,s){ if(!s) return null; if(s.v===1) return s;
  if(id==='planer'&&s.next){ var now=Date.now(), n=s.next.filter(function(x){ return x.due>now; }).sort(function(a,b){ return a.due-b.due; });

  if(t.id==='dOk'){ var v=$('dAlt').value; if(!v) return; t.disabled=true; return delSecret(v).then(function(m){ if(m!==true){ t.disabled=false; $('sErr').textContent=m; $('dAlt').value=''; } }); }
  if(t.id==='sOk'){ var neu=$('sNeu').value, alt=$('sAlt')?$('sAlt').value:'';
    if(sec.kind==='pin'&&!/^\d{4,8}$/.test(neu)){ $('sErr').textContent='PIN: 4–8 Ziffern'; return; }
    if(sec.kind==='pw'&&neu.length<4){ $('sErr').textContent='Mindestens 4 Zeichen'; return; }
    return post('/api/geheimnis',{pid:me,neu:neu,alt:alt,kind:sec.kind}).then(function(r){ if(r.ok){ location.reload(); return; }
      return r.json().catch(function(){ return {}; }).then(function(x){ $('sErr').textContent=x.error==='altes falsch'?'Die bisherige stimmt nicht.':(x.error||'Fehler'); }); }); }
  if(t.id==='tb'){ var r=document.documentElement, cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'), nx=cur==='dark'?'light':'dark';
    r.setAttribute('data-theme',nx); try{ ['launcher_theme','sp_theme','cockpit_theme','aufg_theme','essen_theme'].forEach(function(k){ localStorage.setItem(k,nx); }); }catch(_){} }
});
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.target.id==='sNeu'||e.target.id==='sAlt')){ var b=$('sOk'); if(b) b.click(); } if(e.key==='Enter'&&e.target.id==='dAlt'){ var d=$('dOk'); if(d) d.click(); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeWho(); });
$('ov').addEventListener('click',function(e){ if(e.target.id==='ov') closeWho(); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') load(); });
setInterval(function(){ if(document.visibilityState==='visible'&&!$('ov').classList.contains('show')) load(); },60000);
if(me){ render(); load().then(function(){ if(ROLE.open&&me===ROLE.ownerId&&!sessionStorage.getItem('pd_openhint')){ sessionStorage.setItem('pd_openhint',1); openWho(); } }); }
</script></body></html>
